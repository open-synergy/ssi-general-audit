      - step: "Create source worksheet ddf034c"
        action: "create"
        model: "general_audit_ws_ddf034c"
        save_as: "src_ddf034c"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_ddf034c.id"

      - step: "Create source worksheet e78a3c6"
