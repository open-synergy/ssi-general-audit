setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-F87B2E1-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - WS f87b2e1"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type f87b2e1"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_f87b2e1"
      save_as: "ws_type"

    # Worksheet types for the 8 worksheets linked by f87b2e1's compute fields.
    # NOTE: the mapping below follows the ACTUAL compute methods in
    # models/ga_f87b2e1/general_audit_ws_f87b2e1.py (obj = self.env[...] inside
    # each _compute_link_N_id), not the class docstring, which is stale/wrong
    # for link_4, link_6, link_7 and link_8 (see report).
    - step: "Get worksheet type ddf034c (source for link_1_id)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_ddf034c"
      save_as: "ws_type_ddf034c"

    - step: "Get worksheet type e78a3c6 (source for link_2_id)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_e78a3c6"
      save_as: "ws_type_e78a3c6"

    - step: "Get worksheet type ae11f7e (source for link_3_id)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_ae11f7e"
      save_as: "ws_type_ae11f7e"

    - step: "Get worksheet type a13a30e (source for link_4_id)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_a13a30e"
      save_as: "ws_type_a13a30e"

    - step: "Get worksheet type bdcdfc5 (source for link_5_ids)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_bdcdfc5"
      save_as: "ws_type_bdcdfc5"

    - step: "Get worksheet type c0d0898 (source for link_6_id)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_c0d0898"
      save_as: "ws_type_c0d0898"

    - step: "Get worksheet type f6a227 (source for link_7_id)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_f6a227"
      save_as: "ws_type_f6a227"

    - step: "Get worksheet type c0e0eec (source for link_8_id)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_c0e0eec"
      save_as: "ws_type_c0e0eec"

scenarios:
  # ------------------------------------------------------------------
  # Create - draft
  # ------------------------------------------------------------------
  - name: "Worksheet f87b2e1 - Create in draft"
    steps:
      - step: "Create worksheet f87b2e1"
        action: "create"
        model: "general_audit_ws_f87b2e1"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # Compute link_1_id .. link_8_id - normal (all 8 source worksheets exist)
  # ------------------------------------------------------------------
  - name: "Worksheet f87b2e1 - Compute link_1..link_8 with source worksheets present"
