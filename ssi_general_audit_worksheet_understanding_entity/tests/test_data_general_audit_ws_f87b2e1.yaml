            operator: "is_falsy"

  # ------------------------------------------------------------------
  # action_reload_links - source worksheets created AFTER f87b2e1 exists
  # ------------------------------------------------------------------
  - name: "Worksheet f87b2e1 - action_reload_links refreshes links after creation"
    steps:
      - step: "Create worksheet f87b2e1 before any source worksheet exists"
        action: "create"
        model: "general_audit_ws_f87b2e1"
        save_as: "worksheet"
        as_user: "base.user_admin"
