  # ------------------------------------------------------------------
  # _compute_adm_authorized_value
  # ------------------------------------------------------------------
  - name: "Worksheet ddf034c - Compute adm_authorized_value (normal)"
    steps:
      - step: "Create worksheet with adm authorized amount and number"
        action: "create"
        model: "general_audit_ws_ddf034c"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
