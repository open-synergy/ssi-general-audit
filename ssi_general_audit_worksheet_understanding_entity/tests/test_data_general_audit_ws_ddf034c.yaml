setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-DDF034C-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - WS ddf034c"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type ddf034c"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_ddf034c"
      save_as: "ws_type"

    - step: "Create client contact person (individual, child of client)"
      action: "create"
      model: "res.partner"
      save_as: "contact_partner"
      as_user: "base.user_admin"
      values:
        name: "Onchange Contact Person"
        is_company: false
        parent_id: "REC: client.id"
        function: "Finance Manager"
        phone: "021-5551234"
        mobile: "0812-3456-7890"
        email: "contact@example.com"

scenarios:
  # ------------------------------------------------------------------
  # Create - draft
  # ------------------------------------------------------------------
  - name: "Worksheet ddf034c - Create in draft"
    steps:
      - step: "Create worksheet ddf034c"
        action: "create"
        model: "general_audit_ws_ddf034c"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"

  # ------------------------------------------------------------------
  # _compute_est_authorized_value
  # ------------------------------------------------------------------
  - name: "Worksheet ddf034c - Compute est_authorized_value (normal)"
    steps:
      - step: "Create worksheet with est authorized amount and number"
        action: "create"
        model: "general_audit_ws_ddf034c"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          est_authorized_amount: 1250.5
          est_authorized_number: 200

      - step: "Assert est_authorized_value is amount x number"
        action: "assert"
        target: "worksheet"
        asserts:
          est_authorized_value:
            type: "value"
            expected: 250100.0

  - name: "Worksheet ddf034c - Compute est_authorized_value (zero)"
    steps:
      - step: "Create worksheet with est authorized amount and number both zero"
        action: "create"
        model: "general_audit_ws_ddf034c"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          est_authorized_amount: 0.0
          est_authorized_number: 0

      - step: "Assert est_authorized_value is zero"
        action: "assert"
        target: "worksheet"
        asserts:
          est_authorized_value:
            type: "value"
            expected: 0.0

  # ------------------------------------------------------------------
  # _compute_est_paid_value
  # ------------------------------------------------------------------
  - name: "Worksheet ddf034c - Compute est_paid_value (normal)"
