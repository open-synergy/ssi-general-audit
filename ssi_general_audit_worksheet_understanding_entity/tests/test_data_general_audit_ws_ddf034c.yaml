        action: "create"
        model: "general_audit_ws_ddf034c"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          est_paid_amount: 0.0
          est_paid_number: 0

      - step: "Assert est_paid_value is zero"
        action: "assert"
        target: "worksheet"
        asserts:
          est_paid_value:
            type: "value"
