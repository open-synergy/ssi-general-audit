scenarios:
  # ------------------------------------------------------------------
  # accounting_application - CRUD
  # ------------------------------------------------------------------
  - name: "Accounting Application - Create, write, delete"
    steps:
      - step: "Create accounting application"
        action: "create"
        model: "accounting_application"
        save_as: "record"
        as_user: "base.user_admin"
        values:
          name: "Test Accounting Application"
          code: "TAA001"

      - step: "Assert accounting application created"
        action: "assert"
        target: "record"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Accounting Application"
          code:
            type: "value"
            expected: "TAA001"

      - step: "Write new name"
        action: "write"
        target: "record"
        as_user: "base.user_admin"
        values:
          name: "Updated Accounting Application"

      - step: "Assert name updated"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Updated Accounting Application"

      - step: "Delete accounting application"
        action: "unlink"
        target: "record"
        as_user: "base.user_admin"

      - step: "Verify accounting application deleted"
        action: "search"
        model: "accounting_application"
        domain:
          - ["id", "=", "REC: record.id"]
        save_as: "result"
        expect_count: 0

