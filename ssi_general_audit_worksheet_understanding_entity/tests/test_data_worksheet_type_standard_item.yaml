scenarios:
  # ------------------------------------------------------------------
  # Installed data - worksheet_type_f87b2e1.standard_item_ids
  # ------------------------------------------------------------------
  - name:
      "Worksheet type F87B2E1 (Understanding of The Entity and it's Environment) -
      standard_item_ids installed data"
    steps:
      - step: "Get worksheet type F87B2E1"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_f87b2e1"
        save_as: "type_f87b2e1"

      - step: "Assert standard_item_ids is exactly ISA 315"
        action: "assert"
        target: "type_f87b2e1"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_11_81c669bd"

      - step:
          "Verify unrelated audit standards (ISA 240, ISA 570) from sibling records are
          not linked to F87B2E1"
        action: "search"
        model: "general_audit_worksheet_type"
        domain:
          [
            ["id", "=", "REC: type_f87b2e1.id"],
            ["standard_item_ids.code", "in", ["ISA 240", "ISA 570"]],
          ]
        save_as: "unrelated_standard_link_f87b2e1"
        expect_count: 0

