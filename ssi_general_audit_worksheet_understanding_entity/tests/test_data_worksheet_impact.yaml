#
# Scope of this file (BL-0174, last slice of
# ssi_general_audit_worksheet_understanding_entity):
#
# - Create scenarios (+ assert state = draft) for the 6 worksheets not
#   covered by sibling test files: general_audit_ws_a13a30e, bdcdfc5, f6a227,
#   c0d0898, e78a3c6, ae11f7e.
# - `_compute_standard_detail_ids` on 3 detail models (a13a30e.detail,
#   bdcdfc5.detail, f6a227.detail) — chosen because they belong to worksheets
#   in THIS file's scope; general_audit_ws_c0e0eec.detail and
#   general_audit_ws_a604795.detail are already the scope of sibling test
#   files (test_data_general_audit_ws_c0e0eec.yaml /
#   test_data_general_audit_ws_a604795.yaml) and are skipped here to avoid
#   duplicate coverage.
# - The 8 `*_impacted_account_type_ids` computes on `general_audit`
#   (models/general_audit.py) — tested by writing the boolean `*_impacted`
#   field directly on a `general_audit.standard_detail` record (these
#   booleans are themselves stored computes derived from the worksheet
#   detail M2M relations, e.g. `bdcdfc5_detail_ids`; writing them directly
#   here isolates the general_audit-level compute from the worksheet-detail
#   compute already covered above/elsewhere, and Odoo's dependency tracking
#   still fires `general_audit`'s recompute on a direct ORM write, not just
#   when the value arrives via its own compute chain).
# - `_compute_expert_type_ids` on `general_audit` (from
#   general_audit_ws_ae11f7e.expert rows).
# - `organtization_structure_ids` (typo is production code, kept as-is) on
#   general_audit_ws_e78a3c6.
# - `onchange_partner_name` on general_audit_ws_ae11f7e.other_evidence.
# - Full workflow (draft -> open -> confirm -> approve -> done -> cancel ->
#   restart) for general_audit_ws_ae11f7e — the worksheet named for this in
#   the backlog's "Skenario Uji" #24; it needs no extra required-before-confirm
#   fields (unlike a604795's ws_cbbbaf4_id) and no post_open_action side
#   effects (unlike c0d0898's auto-reload of detail_ids), so it is the
#   simplest worksheet in this file's scope to drive end-to-end.
#
# NOTE on Many2many fields inside `action: form`: Odoo's real Form test
# helper (`odoo/tests/common.py`) explicitly asserts
# `descr['type'] not in ('many2many', 'one2many')` in `Form.__setattr__`, and
# `M2MProxy` (unlike `O2MProxy`) has no `.new()`/`.edit()` — so a many2many
# field can only be populated in a form via `.add()`, which this repo's
# odoo-yaml-test library does not expose as a form op (`set`/`new`/`edit`/
# `remove`/`assert` only). The onchange scenarios below therefore leave
# `related_account_type_ids` unset when creating `other_evidence` via
# `action: form` — harmless here because Odoo's ORM does not enforce
# `required=True` on x2many fields at all (only the web client's view layer
# does), so `form.save()` succeeds regardless.
#
# NOTE on typo fields kept as-is (production code, not "fixed" here):
# `business_environmeny_impacted` (general_audit.standard_detail) and
# `organtization_structure_ids` (general_audit_ws_e78a3c6).

setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - WS Impact"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - WS Impact"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-WSIMPACT-0001"

    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - WS Impact"
        code: "/"

    - step: "Create client account type 1 with a safe extrapolation python_code"
      action: "create"
      model: "client_account_type"
      save_as: "account_type_1"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type 1 - WS Impact"
        code: "/"
        group_id: "REC: account_group.id"
        python_code: "result = 0.0"

    - step: "Create client account type 2 with a safe extrapolation python_code"
      action: "create"
      model: "client_account_type"
      save_as: "account_type_2"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type 2 - WS Impact"
        code: "/"
        group_id: "REC: account_group.id"
        python_code: "result = 0.0"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - WS Impact"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - WS Impact"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - WS Impact"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type a13a30e"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_a13a30e"
      save_as: "ws_type_a13a30e"

    - step: "Get worksheet type bdcdfc5"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_bdcdfc5"
      save_as: "ws_type_bdcdfc5"

    - step: "Get worksheet type f6a227"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_f6a227"
      save_as: "ws_type_f6a227"

    - step: "Get worksheet type c0d0898"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_c0d0898"
      save_as: "ws_type_c0d0898"

    - step: "Get worksheet type e78a3c6"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_e78a3c6"
      save_as: "ws_type_e78a3c6"

    - step: "Get worksheet type ae11f7e"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_ae11f7e"
      save_as: "ws_type_ae11f7e"

    - step: "Get conclusion for ae11f7e worksheet type"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.general_audit_worksheet_conclusion_54_87806302"
      save_as: "conclusion_ae11f7e"

