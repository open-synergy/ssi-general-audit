      "OtherEvidence ae11f7e - Onchange partner_id clears partner_name when partner
      removed"
    steps:
      - step: "Create worksheet ae11f7e"
        action: "create"
        model: "general_audit_ws_ae11f7e"
        save_as: "worksheet"
        as_user: "base.user_admin"
