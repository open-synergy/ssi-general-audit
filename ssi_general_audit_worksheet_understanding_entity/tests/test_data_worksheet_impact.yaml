        action: "create"
        model: "res.partner"
        save_as: "evidence_partner"
        as_user: "base.user_admin"
        values:
          name: "Onchange Other Evidence Partner To Clear"

      - step: "Open other_evidence form and set partner_id"
        action: "form"
        model: "general_audit_ws_ae11f7e.other_evidence"
        save_as: "other_evidence"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet"
          evidence_id: "REC: evidence"
          summary: "Other evidence summary - onchange clears"
          partner_id: "REC: evidence_partner"
        save: true

      - step: "Assert partner_name filled before clearing partner_id"
        action: "assert"
        target: "other_evidence"
        asserts:
          partner_name:
            type: "value"
            operator: "is_truthy"

      - step: "Re-open other_evidence form and clear partner_id"
        action: "form"
        target: "other_evidence"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {partner_id: "EVAL: env['res.partner']"}

      - step: "Assert partner_name cleared by onchange"
        action: "assert"
        target: "other_evidence"
        asserts:
