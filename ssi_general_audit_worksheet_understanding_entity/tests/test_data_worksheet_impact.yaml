  # ==================================================================
  # general_audit._compute_fraud_impacted_account_types
  #
  # `fraud_impacted` on general_audit.standard_detail is itself a stored
  # compute derived from `c0e0eec_detail_ids` (populated via the reverse M2M
  # from general_audit_ws_c0e0eec.detail.standard_detail_ids, out of scope
  # for this file). Writing it directly here isolates and exercises only the
  # general_audit-level compute; Odoo still recomputes
  # `fraud_impacted_account_type_ids` because the dependency is declared on
  # the field itself (`standard_detail_ids.fraud_impacted`), regardless of
  # whether the value arrived via compute or a direct ORM write.
  # ==================================================================
  - name: "General audit - Compute fraud_impacted_account_type_ids (normal)"
    steps:
      - step: "Add a standard detail for account_type_1 to the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type_1.id"

