        save_as: "evidence"
        as_user: "base.user_admin"
        values:
          name: "Test Evidence Type - Onchange"

      - step: "Create partner for the onchange"
        action: "create"
        model: "res.partner"
        save_as: "evidence_partner"
        as_user: "base.user_admin"
        values:
          name: "Onchange Other Evidence Partner"

      - step: "Open other_evidence form and set partner_id"
        action: "form"
        model: "general_audit_ws_ae11f7e.other_evidence"
        save_as: "other_evidence"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet"
          evidence_id: "REC: evidence"
          summary: "Other evidence summary - onchange fills"
          partner_id: "REC: evidence_partner"
        save: true

      - step: "Assert partner_name filled from partner via onchange"
        action: "assert"
        target: "other_evidence"
        asserts:
          partner_name:
            type: "value"
            expected: "Onchange Other Evidence Partner"

