            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_25_fc28b019"

  - name:
      "Worksheet Type EE819AE (Commitment and Contingent) - standard_item_ids is exactly
      ISA 330 + ISA 560"
    steps:
      - step: "Load worksheet type EE819AE"
