            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_23_9244e2be"

  - name:
      "Worksheet Type CB82C5F (Subsequent Event) - standard_item_ids is exactly ISA 560"
    steps:
      - step: "Load worksheet type CB82C5F"
