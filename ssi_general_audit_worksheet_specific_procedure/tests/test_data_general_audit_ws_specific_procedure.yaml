setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - Specific Procedure"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - Specific Procedure"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-SPECPROC-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - Specific Procedure"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - Specific Procedure"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - Specific Procedure"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type a8f4d88"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.worksheet_type_a8f4d88"
      save_as: "ws_type_a8f4d88"

    - step: "Get worksheet type c40cfd9"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.worksheet_type_c40cfd9"
      save_as: "ws_type_c40cfd9"

    - step: "Get worksheet type cb82c5f"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.worksheet_type_cb82c5f"
      save_as: "ws_type_cb82c5f"

    - step: "Get worksheet type fbf57ee"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.worksheet_type_fbf57ee"
      save_as: "ws_type_fbf57ee"

    - step: "Get worksheet type ee819ae"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.worksheet_type_ee819ae"
      save_as: "ws_type_ee819ae"

    - step:
        "Get worksheet type ae11f7e (Understanding of the Entity, source for c40cfd9)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_ae11f7e"
      save_as: "ws_type_ae11f7e"

    - step: "Get seeded conclusion for a8f4d88"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.general_audit_worksheet_conclusion_98_55ed0386"
      save_as: "conclusion_a8f4d88"

    - step: "Get seeded conclusion for c40cfd9"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.general_audit_worksheet_conclusion_100_fb2bbce4"
      save_as: "conclusion_c40cfd9"

    - step: "Get seeded conclusion for cb82c5f"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.general_audit_worksheet_conclusion_102_cedd4794"
      save_as: "conclusion_cb82c5f"

    - step: "Get seeded conclusion for fbf57ee"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.general_audit_worksheet_conclusion_104_22e53346"
      save_as: "conclusion_fbf57ee"

    - step: "Get seeded conclusion for ee819ae"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_specific_procedure.general_audit_worksheet_conclusion_110_8d6085b1"
      save_as: "conclusion_ee819ae"

scenarios:
  # ------------------------------------------------------------------
  # fbf57ee (Going Concern) - Create and workflow draft to done
  # ------------------------------------------------------------------
  - name: "WS fbf57ee - Create and workflow draft to done"
    steps:
      - step: "Create z-score coefficient set (required before open)"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set"
        save_as: "coefficient_set"
        as_user: "base.user_admin"
        values:
          name: "Test Z-Score Coefficient Set - fbf57ee Workflow"
          code: "/"

      - step: "Create worksheet fbf57ee"
        action: "create"
        model: "general_audit_ws_fbf57ee"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fbf57ee.id"
          balance_type: "end_period"
          z_score_coefficient_set_id: "REC: coefficient_set.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion_fbf57ee.id"
          conclusion: "Going concern evaluation reviewed and adequately addressed."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # fbf57ee - action_load_computation
  #
  # Regression coverage for the fix in _compute_current_amount
  # (models/fbf57ee/general_audit_ws_fbf57ee_computation.py): it now reads
  # `general_audit_computation_id.home_amount` / `.interim_amount` (the
  # fields that actually exist on `general_audit.computation`) instead of
  # the non-existent `home_balance` / `interim_balance`. This scenario
  # feeds a real home + interim trial balance computation and proves both
  # branches of `balance_type` resolve to the correct amount, and that
  # `result` (current_amount x coefficient) is computed correctly, with no
  # AttributeError raised.
  # ------------------------------------------------------------------
  - name: "WS fbf57ee - action_load_computation (real amounts, end_period and interim)"
    steps:
      - step: "Create computation item flagged for going concern"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "gc_computation_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - fbf57ee Load (going_concern_ok)"
          code: "/"
          going_concern_ok: true

      - step: "Create home trial balance for the audit"
        action: "create"
        model: "client_trial_balance"
        save_as: "tb_home"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          trial_balance_type: "home"

      - step: "Create home trial balance computation line (real home_amount source)"
        action: "create"
        model: "client_trial_balance.computation"
        save_as: "tb_computation_home"
        as_user: "base.user_admin"
        values:
          trial_balance_id: "REC: tb_home.id"
          computation_item_id: "REC: gc_computation_item.id"
          amount: 100000.0

      - step: "Create interim trial balance for the audit"
        action: "create"
        model: "client_trial_balance"
        save_as: "tb_interim"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          trial_balance_type: "interim"

      - step:
          "Create interim trial balance computation line (real interim_amount source)"
        action: "create"
        model: "client_trial_balance.computation"
        save_as: "tb_computation_interim"
        as_user: "base.user_admin"
        values:
          trial_balance_id: "REC: tb_interim.id"
          computation_item_id: "REC: gc_computation_item.id"
          amount: 80000.0

      - step: "Create general_audit.computation row for the audit"
        action: "create"
        model: "general_audit.computation"
        save_as: "audit_computation"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: gc_computation_item.id"

      - step: "Assert general_audit.computation resolved real home/interim amounts"
        action: "assert"
        target: "audit_computation"
        asserts:
          home_amount:
            type: "value"
            expected: 100000.0
          interim_amount:
            type: "value"
            expected: 80000.0

      - step: "Create z-score coefficient set with a coefficient for the item"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set"
        save_as: "coefficient_set"
        as_user: "base.user_admin"
        values:
          name: "Test Z-Score Coefficient Set - fbf57ee Load"
          code: "/"
          item_ids:
            - - 0
              - 0
              - computation_item_id: "REC: gc_computation_item.id"
                coefficient: 2.0

      - step: "Create worksheet fbf57ee (balance_type = end_period)"
        action: "create"
        model: "general_audit_ws_fbf57ee"
        save_as: "worksheet_end_period"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fbf57ee.id"
          balance_type: "end_period"
          z_score_coefficient_set_id: "REC: coefficient_set.id"

      - step: "Verify no computation lines before loading (end_period worksheet)"
        action: "search"
        model: "general_audit_ws_fbf57ee.computation"
        domain:
          - ["worksheet_id", "=", "REC: worksheet_end_period.id"]
        save_as: "lines_before_end_period"
        expect_count: 0

      - step: "Call action_load_computation on the end_period worksheet"
        action: "call"
        target: "worksheet_end_period"
        method: "action_load_computation"
        as_user: "base.user_admin"

      - step: "Verify the computation line was loaded (end_period worksheet)"
        action: "search"
        model: "general_audit_ws_fbf57ee.computation"
        domain:
          - ["worksheet_id", "=", "REC: worksheet_end_period.id"]
        save_as: "line_end_period"
        expect_count: 1

      - step: "Assert end_period current_amount, coefficient and result"
        action: "assert"
        target: "line_end_period"
        asserts:
          current_amount:
            type: "value"
            expected: 100000.0
          coefficient:
            type: "value"
            expected: 2.0
          result:
            type: "value"
            expected: 200000.0

      - step: "Create worksheet fbf57ee (balance_type = interim)"
        action: "create"
        model: "general_audit_ws_fbf57ee"
        save_as: "worksheet_interim"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fbf57ee.id"
          balance_type: "interim"
          z_score_coefficient_set_id: "REC: coefficient_set.id"

      - step: "Call action_load_computation on the interim worksheet"
        action: "call"
        target: "worksheet_interim"
        method: "action_load_computation"
        as_user: "base.user_admin"

      - step: "Verify the computation line was loaded (interim worksheet)"
        action: "search"
        model: "general_audit_ws_fbf57ee.computation"
        domain:
          - ["worksheet_id", "=", "REC: worksheet_interim.id"]
        save_as: "line_interim"
        expect_count: 1

      - step: "Assert interim current_amount, coefficient and result"
        action: "assert"
        target: "line_interim"
        asserts:
          current_amount:
            type: "value"
            expected: 80000.0
          coefficient:
            type: "value"
            expected: 2.0
          result:
            type: "value"
            expected: 160000.0

  # ------------------------------------------------------------------
  # fbf57ee - z_score with no computation lines (only Z-Score case
  # reachable without hitting the action_load_computation bug above)
  # ------------------------------------------------------------------
  - name: "WS fbf57ee - z_score with no computation lines (locked-in current behaviour)"
    steps:
      # _compute_z_score sums computation_line_ids.result (0.0 when empty)
      # and categorizes strictly by `total_z_score < 1.23` => "unsolvent".
      # This locks in the EXISTING behaviour per BL-0168 notes: it is not
      # necessarily the intended business rule for "no data yet", but the
      # backlog directs testing actual behaviour, not desired behaviour.
      - step: "Create z-score coefficient set (required before open, unused here)"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set"
        save_as: "coefficient_set"
        as_user: "base.user_admin"
        values:
          name: "Test Z-Score Coefficient Set - fbf57ee Empty"
          code: "/"

      - step: "Create worksheet fbf57ee without any computation line"
        action: "create"
        model: "general_audit_ws_fbf57ee"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fbf57ee.id"
          balance_type: "end_period"
          z_score_coefficient_set_id: "REC: coefficient_set.id"

      - step: "Assert z_score is 0.0 and category is unsolvent"
        action: "assert"
        target: "worksheet"
        asserts:
          z_score:
            type: "value"
            expected: 0.0
          z_score_category:
            type: "value"
            expected: "unsolvent"

  # ------------------------------------------------------------------
  # fbf57ee - Z-Score category "solvent" with real computation data
  #
  # _compute_z_score categorizes total_z_score >= 2.90 as "solvent"
  # (models/fbf57ee/general_audit_ws_fbf57ee.py). A single computation
  # line with current_amount = 1.0 (real home_amount, via a real trial
  # balance computation) and coefficient = 3.0 yields result = z_score =
  # 3.0, which is >= 2.90.
  # ------------------------------------------------------------------
  - name: "WS fbf57ee - Z-Score category solvent (real data)"
    steps:
      - step: "Create computation item for the solvent scenario"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item_solvent"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - fbf57ee Solvent"
          code: "/"

      - step: "Create home trial balance for the solvent scenario"
        action: "create"
        model: "client_trial_balance"
        save_as: "tb_home_solvent"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          trial_balance_type: "home"

      - step: "Create home trial balance computation line (amount = 1.0)"
        action: "create"
        model: "client_trial_balance.computation"
        save_as: "tb_computation_solvent"
        as_user: "base.user_admin"
        values:
          trial_balance_id: "REC: tb_home_solvent.id"
          computation_item_id: "REC: comp_item_solvent.id"
          amount: 1.0

      - step: "Create general_audit.computation row for the solvent scenario"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation_solvent"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item_solvent.id"

      - step: "Create z-score coefficient set (unused, required before open)"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set"
        save_as: "coefficient_set_solvent"
        as_user: "base.user_admin"
        values:
          name: "Test Z-Score Coefficient Set - fbf57ee Solvent"
          code: "/"

      - step: "Create worksheet fbf57ee for the solvent scenario"
        action: "create"
        model: "general_audit_ws_fbf57ee"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fbf57ee.id"
          balance_type: "end_period"
          z_score_coefficient_set_id: "REC: coefficient_set_solvent.id"

      - step: "Create computation line with coefficient 3.0 (z_score = 3.0)"
        action: "create"
        model: "general_audit_ws_fbf57ee.computation"
        save_as: "line_solvent"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          general_audit_computation_id: "REC: computation_solvent.id"
          coefficient: 3.0

      - step: "Assert computation line current_amount and result"
        action: "assert"
        target: "line_solvent"
        asserts:
          current_amount:
            type: "value"
            expected: 1.0
          result:
            type: "value"
            expected: 3.0

      - step: "Assert z_score is 3.0 and category is solvent"
        action: "assert"
        target: "worksheet"
        asserts:
          z_score:
            type: "value"
            expected: 3.0
          z_score_category:
            type: "value"
            expected: "solvent"

  # ------------------------------------------------------------------
  # fbf57ee - Z-Score category "grey_area" with real computation data
  #
  # _compute_z_score categorizes 1.23 <= total_z_score < 2.90 as
  # "grey_area". A single computation line with current_amount = 1.0 and
  # coefficient = 2.0 yields result = z_score = 2.0, which falls in that
  # range.
  # ------------------------------------------------------------------
  - name: "WS fbf57ee - Z-Score category grey_area (real data)"
    steps:
      - step: "Create computation item for the grey_area scenario"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item_grey_area"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - fbf57ee Grey Area"
          code: "/"

      - step: "Create home trial balance for the grey_area scenario"
        action: "create"
        model: "client_trial_balance"
        save_as: "tb_home_grey_area"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          trial_balance_type: "home"

      - step: "Create home trial balance computation line (amount = 1.0)"
        action: "create"
        model: "client_trial_balance.computation"
        save_as: "tb_computation_grey_area"
        as_user: "base.user_admin"
        values:
          trial_balance_id: "REC: tb_home_grey_area.id"
          computation_item_id: "REC: comp_item_grey_area.id"
          amount: 1.0

      - step: "Create general_audit.computation row for the grey_area scenario"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation_grey_area"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item_grey_area.id"

      - step: "Create z-score coefficient set (unused, required before open)"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set"
        save_as: "coefficient_set_grey_area"
        as_user: "base.user_admin"
        values:
          name: "Test Z-Score Coefficient Set - fbf57ee Grey Area"
