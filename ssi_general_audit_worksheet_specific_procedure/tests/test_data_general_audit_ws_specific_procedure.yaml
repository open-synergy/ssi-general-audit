      - step: "Create worksheet fbf57ee for the grey_area scenario"
        action: "create"
        model: "general_audit_ws_fbf57ee"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fbf57ee.id"
          balance_type: "end_period"
          z_score_coefficient_set_id: "REC: coefficient_set_grey_area.id"

      - step: "Create computation line with coefficient 2.0 (z_score = 2.0)"
        action: "create"
        model: "general_audit_ws_fbf57ee.computation"
