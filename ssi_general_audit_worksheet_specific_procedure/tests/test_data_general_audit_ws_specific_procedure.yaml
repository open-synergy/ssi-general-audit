            type: "value"
            expected: "grey_area"

  # ------------------------------------------------------------------
  # fbf57ee - Z-Score category "unsolvent" with real computation data
  #
  # _compute_z_score categorizes total_z_score < 1.23 as "unsolvent". A
  # single computation line with current_amount = 1.0 and coefficient =
  # 1.0 yields result = z_score = 1.0, which is below the threshold.
  # ------------------------------------------------------------------
  - name: "WS fbf57ee - Z-Score category unsolvent (real data)"
    steps:
      - step: "Create computation item for the unsolvent scenario"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item_unsolvent"
