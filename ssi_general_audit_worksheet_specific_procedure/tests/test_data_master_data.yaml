  # ------------------------------------------------------------------
  # trial_balance_computation_item.going_concern_ok - default and write
  # ------------------------------------------------------------------
  - name: "Trial Balance Computation Item - going_concern_ok default and write"
    steps:
      - step: "Create computation item without going_concern_ok"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "computation_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - going_concern_ok"
          code: "/"

      - step: "Assert going_concern_ok defaults to false"
        action: "assert"
        target: "computation_item"
        asserts:
          going_concern_ok:
            type: "value"
            expected: false

      - step: "Write going_concern_ok to true"
        action: "write"
        target: "computation_item"
        as_user: "base.user_admin"
        values:
          going_concern_ok: true

      - step: "Assert going_concern_ok updated to true"
        action: "assert"
        target: "computation_item"
        asserts:
          going_concern_ok:
            type: "value"
            expected: true
