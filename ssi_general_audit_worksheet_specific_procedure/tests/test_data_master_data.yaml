  # ------------------------------------------------------------------
  # general_audit_subsequent_event - CRUD
  # ------------------------------------------------------------------
  - name: "Subsequent Event - Create, write, delete"
    steps:
      - step: "Create subsequent event needing adjustment"
        action: "create"
        model: "general_audit_subsequent_event"
        save_as: "event"
        as_user: "base.user_admin"
        values:
          name: "Test Subsequent Event"
          need_adjustment: true

      - step: "Assert event created with default code and need_adjustment true"
        action: "assert"
        target: "event"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          code:
            type: "value"
            expected: "/"
          need_adjustment:
            type: "value"
            expected: true

      - step: "Write need_adjustment to false"
        action: "write"
        target: "event"
        as_user: "base.user_admin"
        values:
          need_adjustment: false

      - step: "Assert need_adjustment updated"
        action: "assert"
        target: "event"
        asserts:
          need_adjustment:
            type: "value"
            expected: false

      - step: "Delete event"
        action: "unlink"
        target: "event"
        as_user: "base.user_admin"

      - step: "Verify event deleted"
        action: "search"
        model: "general_audit_subsequent_event"
        domain:
          - ["id", "=", "REC: event.id"]
        save_as: "result"
        expect_count: 0

