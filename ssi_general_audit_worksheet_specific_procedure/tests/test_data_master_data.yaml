scenarios:
  # ------------------------------------------------------------------
  # general_audit_going_concern_z_score_coeficient_set - CRUD (with
  # inline item_ids)
  # ------------------------------------------------------------------
  - name: "Z-Score Coefficient Set - Create with item, write, delete"
    steps:
      - step: "Create computation item prerequisite"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "computation_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - ZScore Set CRUD"
          code: "/"

      - step: "Create z-score coefficient set with inline item"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set"
        save_as: "coefficient_set"
        as_user: "base.user_admin"
        values:
          name: "Test Z-Score Coefficient Set"
          code: "/"
          item_ids:
            - - 0
              - 0
              - computation_item_id: "REC: computation_item.id"
                coefficient: 1.2

      - step: "Assert coefficient set created with item"
        action: "assert"
        target: "coefficient_set"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          item_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Write new name"
        action: "write"
        target: "coefficient_set"
        as_user: "base.user_admin"
        values:
          name: "Updated Z-Score Coefficient Set"

      - step: "Assert name updated"
        action: "assert"
        target: "coefficient_set"
        asserts:
          name:
            type: "value"
            expected: "Updated Z-Score Coefficient Set"

      - step: "Delete z-score coefficient set"
        action: "unlink"
        target: "coefficient_set"
        as_user: "base.user_admin"

      - step: "Verify z-score coefficient set deleted"
        action: "search"
        model: "general_audit_going_concern_z_score_coeficient_set"
        domain:
          - ["id", "=", "REC: coefficient_set.id"]
        save_as: "result"
        expect_count: 0

  # ------------------------------------------------------------------
  # general_audit_going_concern_z_score_coeficient_set.item - CRUD
  # ------------------------------------------------------------------
  - name: "Z-Score Coefficient Set Item - Create, write, delete"
    steps:
      - step: "Create computation item prerequisite"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "computation_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - ZScore Item CRUD"
          code: "/"

      - step: "Create coefficient set prerequisite"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set"
        save_as: "coefficient_set"
        as_user: "base.user_admin"
        values:
          name: "Test Z-Score Coefficient Set - Item CRUD"
          code: "/"

      - step: "Create coefficient set item"
        action: "create"
        model: "general_audit_going_concern_z_score_coeficient_set.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          set_id: "REC: coefficient_set.id"
          computation_item_id: "REC: computation_item.id"
          coefficient: 1.2

      - step: "Assert coefficient set item created"
        action: "assert"
        target: "item"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          coefficient:
            type: "value"
            expected: 1.2
          set_id:
            type: "m2o"
            expected: "REC: coefficient_set"
          computation_item_id:
            type: "m2o"
            expected: "REC: computation_item"

      - step: "Write new coefficient"
        action: "write"
        target: "item"
        as_user: "base.user_admin"
        values:
          coefficient: 3.3

      - step: "Assert coefficient updated"
        action: "assert"
        target: "item"
        asserts:
          coefficient:
            type: "value"
            expected: 3.3

      - step: "Delete coefficient set item"
        action: "unlink"
        target: "item"
        as_user: "base.user_admin"

      - step: "Verify coefficient set item deleted"
        action: "search"
        model: "general_audit_going_concern_z_score_coeficient_set.item"
        domain:
          - ["id", "=", "REC: item.id"]
        save_as: "result"
        expect_count: 0

