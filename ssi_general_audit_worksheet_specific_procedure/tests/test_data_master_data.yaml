        target: "procedure"
        asserts:
          name:
            type: "value"
            expected: "Updated Going Concern Confirmation Procedure"
          sequence:
            type: "value"
            expected: 20

      - step: "Delete procedure"
        action: "unlink"
        target: "procedure"
        as_user: "base.user_admin"

      - step: "Verify procedure deleted"
        action: "search"
        model: "general_audit_going_concern_confirmation_procedure"
        domain:
          - ["id", "=", "REC: procedure.id"]
        save_as: "result"
