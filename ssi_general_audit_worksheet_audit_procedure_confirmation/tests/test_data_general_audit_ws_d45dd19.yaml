        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          party_name: "Bank ABC"
          data_mode: "gl"
          general_ledger_id: "REC: ws_gl.id"

      - step: "Set a dangerous filter_where_clause"
        action: "write"
        target: "confirmation"
        as_user: "base.user_admin"
        values:
          filter_where_clause: "DROP TABLE data"

      - step: "Assert raw_data is left unfiltered (identical to source)"
        action: "assert"
        target: "confirmation"
        asserts:
          raw_data:
            type: "value"
            expected: "REC: ws_gl.raw_data"

      - step: "Set a safe filter_where_clause"
        action: "write"
        target: "confirmation"
        as_user: "base.user_admin"
        values:
