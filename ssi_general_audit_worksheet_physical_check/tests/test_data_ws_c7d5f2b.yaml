setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-C7D5F2B-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - Physical Check"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type c7d5f2b"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_physical_check.worksheet_type_c7d5f2b"
      save_as: "ws_type"

    - step: "Get worksheet type e51bb1c (Key Audit Procedures)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_lead_schedule.worksheet_type_e51bb1c"
      save_as: "ws_type_e51bb1c"

    - step: "Get worksheet type d209914 (General Ledger)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_client_package.worksheet_type_d209914"
      save_as: "ws_type_d209914"

    - step: "Get worksheet type b5e3d9f (Subledger)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_client_package.worksheet_type_b5e3d9f"
      save_as: "ws_type_b5e3d9f"

    - step: "Get worksheet type a916660 (Sample Determination)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_sample_determination.worksheet_type_a916660"
      save_as: "ws_type_a916660"

    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - C7D5F2B"
        code: "/"

    - step: "Create client account type"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - C7D5F2B"
        code: "/"
        group_id: "REC: account_group.id"
        # No general_audit.standard_detail is created against this account
        # type anywhere in this file, so the crashing default
        # ("result = document.balance") never actually gets evaluated here.
        # Set explicitly anyway, per the repo-wide rule of never leaving
        # client_account_type.python_code at its default.
        python_code: "result = 0.0"

    - step: "Create assertion type"
      action: "create"
      model: "general_audit_assersion_type"
      save_as: "assertion_type"
      as_user: "base.user_admin"
      values:
        name: "Existence"
        code: "/"

    - step: "Create audit procedure category (performed)"
      action: "create"
      model: "general_audit_audit_procedure_category"
      save_as: "category_performed"
      as_user: "base.user_admin"
      values:
        name: "Physical Check - Performed Category"
        code: "/"
        account_type_id: "REC: account_type.id"
        assertion_type_ids:
          - - 6
            - 0
            - - "REC: assertion_type.id"

    - step: "Create WS-E51BB1C worksheet (Key Audit Procedures)"
      action: "create"
      model: "general_audit_ws_e51bb1c"
      save_as: "ws_e51bb1c"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: ws_type_e51bb1c.id"

    - step: "Create WS-E51BB1C detail with status performed"
      action: "create"
      model: "general_audit_ws_e51bb1c.detail"
      save_as: "detail_performed"
      as_user: "base.user_admin"
      values:
        worksheet_id: "REC: ws_e51bb1c.id"
        audit_procedure_category_id: "REC: category_performed.id"
        assertion_type_ids:
          - - 6
            - 0
            - - "REC: assertion_type.id"
        status: "performed"

scenarios:
  # ------------------------------------------------------------------
  # worksheet_type_c7d5f2b - sequence aligned with AURA_SWR (BL-0317)
  # ------------------------------------------------------------------
  - name: "Worksheet type c7d5f2b - sequence aligned with AURA_SWR"
    steps:
      - step: "Assert worksheet type sequence, code, and name"
        action: "assert"
        target: "ws_type"
        asserts:
          code:
            type: "value"
            expected: "C7D5F2B"
          sequence:
            type: "value"
            expected: 472
          name:
            type: "value"
            expected: "Physical Check"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Create in draft
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Create in draft"
    steps:
      - step: "Assert general audit is open"
        action: "assert"
        target: "audit"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"
          type_id:
            type: "m2o"
            expected: "REC: ws_type"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Workflow open assigns sequence name
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Workflow open assigns sequence name"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open with sequence assigned"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Workflow confirm to done
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Workflow confirm to done"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Create conclusion for this worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "No exception noted"
          code: "/"
          type_id: "REC: ws_type.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Physical inspection raised no exception."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Confirm without conclusion fields is rejected
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Confirm without conclusion fields is rejected"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Confirm without conclusion_id/conclusion must be rejected"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Cancel and restart (from open)
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Cancel and restart"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # standard_item_ids - inherited compute from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Compute standard_item_ids normal"
    steps:
      - step: "Create standard audit item"
        action: "create"
        model: "general_audit_standard_audit"
        save_as: "std_item"
        values:
          name: "ISA 501 - Inventory Observation"
          code: "/"

      - step: "Create worksheet type carrying the standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_with_item"
        values:
          name: "Ad-hoc Type With Standard Item"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"
          standard_item_ids:
            - - 6
              - 0
              - - "REC: std_item.id"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_with_item.id"

      - step: "Assert standard_item_ids contains the standard item"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: std_item"

  - name: "Worksheet c7d5f2b - Compute standard_item_ids kosong"
    steps:
      - step: "Create worksheet type without any standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_no_item"
        values:
          name: "Ad-hoc Type Without Standard Item"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_no_item.id"

      - step: "Assert standard_item_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # allowed_conclusion_ids - inherited compute from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Compute allowed_conclusion_ids normal"
    steps:
      - step: "Create worksheet type"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_with_conclusion"
        values:
          name: "Ad-hoc Type With Conclusion"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"

      - step: "Create conclusion for that type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        values:
          name: "Sufficient evidence obtained"
          code: "/"
          type_id: "REC: type_with_conclusion.id"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_with_conclusion.id"

      - step: "Assert allowed_conclusion_ids contains the conclusion"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_conclusion_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: conclusion"

  - name: "Worksheet c7d5f2b - Compute allowed_conclusion_ids kosong"
    steps:
      - step: "Create worksheet type without any conclusion"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_no_conclusion"
        values:
          name: "Ad-hoc Type Without Conclusion"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_no_conclusion.id"

      - step: "Assert allowed_conclusion_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_conclusion_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # onchange_parent_type_id - inherited from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Onchange type_id sets parent_type_id"
    steps:
      # type_id is hard-readonly in the form view
      # (`<field name="type_id" readonly="1" force_save="1" />` in
      # ssi_general_audit/views/worksheet/general_audit_worksheet_mixin_views.xml),
      # so it can only ever take its default value on a new record -- it is
      # never user-editable. The onchange therefore only fires once, from
      # that default. Asserting directly on the live Form object trips a
      # library/Form interaction bug (`hasattr(form, "__len__")` raises
      # AssertionError instead of returning False), so save the form first
      # and assert on the resulting record instead -- same pattern as
      # ssi_general_audit_worksheet_analytic_cycle's onchange test.
      - step: "Open new worksheet form with default type_id"
        action: "form"
        model: "general_audit_ws_c7d5f2b"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit"
        save: true

      - step: "Assert default type_id propagated to parent_type_id via onchange"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_physical_check.worksheet_type_c7d5f2b"
          parent_type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_physical_check.worksheet_type_c7d5f2b"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Delete in draft
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Delete in draft"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Delete the worksheet"
        action: "unlink"
        target: "worksheet"

      - step: "Verify worksheet deleted"
        action: "search"
        model: "general_audit_ws_c7d5f2b"
        domain:
          - ["id", "=", "REC: worksheet.id"]
        save_as: "result"
        expect_count: 0

  # ------------------------------------------------------------------
  # _compute_raw_data - data_mode = gl
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Compute raw_data (data_mode = gl)"
    steps:
      - step: "Create General Ledger worksheet with raw data"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          raw_data: "Ref,Amount\nR1,1000\nR2,2000\n"
          title: "GL Fixed Asset"

      - step: "Create worksheet c7d5f2b pointing at the GL"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"

      - step: "Assert raw_data comes from the GL"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            expected: "Ref,Amount\nR1,1000\nR2,2000\n"

  # ------------------------------------------------------------------
  # _compute_raw_data - data_mode = subledger
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Compute raw_data (data_mode = subledger)"
    steps:
      - step: "Create Subledger worksheet with raw data"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "sl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_b5e3d9f.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          raw_data: "Ref,Amount\nR1,500\nR2,700\n"
          title: "Subledger Inventory"

      - step: "Create worksheet c7d5f2b pointing at the Subledger"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "subledger"
          subledger_id: "REC: sl.id"

      - step: "Assert raw_data comes from the Subledger"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            expected: "Ref,Amount\nR1,500\nR2,700\n"

  # ------------------------------------------------------------------
  # _compute_check_data - data_source = sample
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Compute check_data (data_source sample)"
    steps:
      - step: "Create General Ledger worksheet with raw data"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          raw_data: "Ref,Amount\nREF1,1000\nREF2,2000\nREF3,3000\n"
          title: "GL Physical Check Header"

      - step: "Create Sample Determination worksheet with sampling data"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sd"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"
          sampling_data: "No,Ref\n1,REF1\n2,REF3\n"

      - step: "Create worksheet c7d5f2b referencing both"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"
          data_source: "sample"
          sample_determination_id: "REC: sd.id"
          reference_col_number: 1

      - step: "Assert check_data contains only the sampled references"
        action: "assert"
        target: "worksheet"
        asserts:
          check_data:
            type: "value"
            operator: "contains"
            expected: "REF1,1000"

      - step: "Assert check_data contains the second sampled reference too"
        action: "assert"
        target: "worksheet"
        asserts:
          check_data:
            type: "value"
            operator: "contains"
            expected: "REF3,3000"

