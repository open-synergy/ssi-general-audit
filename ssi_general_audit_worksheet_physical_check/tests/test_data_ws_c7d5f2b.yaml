setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-C7D5F2B-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - Physical Check"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type c7d5f2b"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_physical_check.worksheet_type_c7d5f2b"
      save_as: "ws_type"

scenarios:
  # ------------------------------------------------------------------
  # worksheet_type_c7d5f2b - sequence aligned with AURA_SWR (BL-0317)
  # ------------------------------------------------------------------
  - name: "Worksheet type c7d5f2b - sequence aligned with AURA_SWR"
    steps:
      - step: "Assert worksheet type sequence and code"
        action: "assert"
        target: "ws_type"
        asserts:
          code:
            type: "value"
            expected: "C7D5F2B"
          sequence:
            type: "value"
            expected: 472

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Create in draft
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Create in draft"
    steps:
      - step: "Assert general audit is open"
        action: "assert"
        target: "audit"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"
          type_id:
            type: "m2o"
            expected: "REC: ws_type"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Workflow open assigns sequence name
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Workflow open assigns sequence name"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open with sequence assigned"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Workflow confirm to done
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Workflow confirm to done"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Create conclusion for this worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "No exception noted"
          code: "/"
          type_id: "REC: ws_type.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Physical inspection raised no exception."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Confirm without conclusion fields is rejected
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Confirm without conclusion fields is rejected"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Confirm without conclusion_id/conclusion must be rejected"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Cancel and restart (from open)
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Cancel and restart"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # standard_item_ids - inherited compute from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Compute standard_item_ids normal"
    steps:
      - step: "Create standard audit item"
        action: "create"
        model: "general_audit_standard_audit"
        save_as: "std_item"
        values:
          name: "ISA 501 - Inventory Observation"
          code: "/"

      - step: "Create worksheet type carrying the standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_with_item"
        values:
          name: "Ad-hoc Type With Standard Item"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"
          standard_item_ids:
            - - 6
              - 0
              - - "REC: std_item.id"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_with_item.id"

      - step: "Assert standard_item_ids contains the standard item"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: std_item"

  - name: "Worksheet c7d5f2b - Compute standard_item_ids kosong"
    steps:
      - step: "Create worksheet type without any standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_no_item"
        values:
          name: "Ad-hoc Type Without Standard Item"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_no_item.id"

      - step: "Assert standard_item_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # allowed_conclusion_ids - inherited compute from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Compute allowed_conclusion_ids normal"
    steps:
      - step: "Create worksheet type"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_with_conclusion"
        values:
          name: "Ad-hoc Type With Conclusion"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"

      - step: "Create conclusion for that type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        values:
          name: "Sufficient evidence obtained"
          code: "/"
          type_id: "REC: type_with_conclusion.id"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_with_conclusion.id"

      - step: "Assert allowed_conclusion_ids contains the conclusion"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_conclusion_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: conclusion"

  - name: "Worksheet c7d5f2b - Compute allowed_conclusion_ids kosong"
    steps:
      - step: "Create worksheet type without any conclusion"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_no_conclusion"
        values:
          name: "Ad-hoc Type Without Conclusion"
          code: "/"
          model_name: "general_audit_ws_c7d5f2b"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_no_conclusion.id"

      - step: "Assert allowed_conclusion_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_conclusion_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # onchange_parent_type_id - inherited from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Onchange type_id sets parent_type_id"
    steps:
      # type_id is hard-readonly in the form view
      # (`<field name="type_id" readonly="1" force_save="1" />` in
      # ssi_general_audit/views/worksheet/general_audit_worksheet_mixin_views.xml),
      # so it can only ever take its default value on a new record -- it is
      # never user-editable. The onchange therefore only fires once, from
      # that default. Asserting directly on the live Form object trips a
      # library/Form interaction bug (`hasattr(form, "__len__")` raises
      # AssertionError instead of returning False), so save the form first
      # and assert on the resulting record instead -- same pattern as
      # ssi_general_audit_worksheet_analytic_cycle's onchange test.
      - step: "Open new worksheet form with default type_id"
        action: "form"
        model: "general_audit_ws_c7d5f2b"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit"
        save: true

      - step: "Assert default type_id propagated to parent_type_id via onchange"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_physical_check.worksheet_type_c7d5f2b"
          parent_type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_physical_check.worksheet_type_c7d5f2b"

  # ------------------------------------------------------------------
  # general_audit_ws_c7d5f2b - Delete in draft
  # ------------------------------------------------------------------
  - name: "Worksheet c7d5f2b - Delete in draft"
    steps:
      - step: "Create worksheet c7d5f2b"
        action: "create"
        model: "general_audit_ws_c7d5f2b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Delete the worksheet"
        action: "unlink"
        target: "worksheet"

      - step: "Verify worksheet deleted"
        action: "search"
        model: "general_audit_ws_c7d5f2b"
        domain:
          - ["id", "=", "REC: worksheet.id"]
        save_as: "result"
        expect_count: 0
