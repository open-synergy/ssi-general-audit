  # Workflow - cancel and restart
  # ------------------------------------------------------------------
  - name: "bb33b94 - Cancel and restart"
    steps:
      - step: "Create worksheet bb33b94"
        action: "create"
        model: "general_audit_ws_bb33b94"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
