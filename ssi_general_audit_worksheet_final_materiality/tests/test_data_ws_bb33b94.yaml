setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - BB33B94"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - BB33B94"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-BB33B94-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - BB33B94"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - BB33B94"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - BB33B94"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type bb33b94"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_final_materiality.worksheet_type_bb33b94"
      save_as: "ws_type_bb33b94"

    - step: "Get worksheet type d9d2b44 (preliminary materiality, used as fixture only)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.worksheet_type_d9d2b44"
      save_as: "ws_type_d9d2b44"

    - step: "Get conclusion bb33b94 (adequate)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_final_materiality.general_audit_worksheet_conclusion_116_0f4a4d2d"
      save_as: "conclusion_bb33b94"

scenarios:
  # ------------------------------------------------------------------
  # _compute_base - normal, override other_amount_ok, kosong
  # ------------------------------------------------------------------
  - name: "bb33b94 - _compute_base (normal, override other_amount_ok, kosong)"
    steps:
      - step: "Create computation item"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - Base Amount"
          code: "/"

      - step: "Create general audit computation with audited_amount"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item.id"
          audited_amount: 1000000.0

      - step: "Create worksheet bb33b94"
        action: "create"
        model: "general_audit_ws_bb33b94"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bb33b94.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Set computation_item_id"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          computation_item_id: "REC: comp_item.id"

      - step: "Assert base_computation_amount from computation"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 1000000.0
          general_audit_computation_id:
            type: "m2o"
            expected: "REC: computation"

      - step: "Enable other_amount_ok override"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          other_amount_ok: true
          other_amount_source: "Management estimate"
          other_base_amount: 750000.0

      - step: "Assert base_computation_amount overridden by other_base_amount"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 750000.0

      - step: "Create worksheet bb33b94 without computation_item_id (kosong)"
        action: "create"
        model: "general_audit_ws_bb33b94"
        save_as: "worksheet_empty"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bb33b94.id"

      - step: "Open empty worksheet"
        action: "call"
        target: "worksheet_empty"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening empty worksheet"
        action: "call"
        target: "worksheet_empty"
        method: "invalidate_cache"

      - step: "Assert base_computation_amount is zero without computation_item_id"
        action: "assert"
        target: "worksheet_empty"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 0.0

  # ------------------------------------------------------------------
  # _compute_materiality - normal, nol
  # ------------------------------------------------------------------
  - name: "bb33b94 - _compute_materiality (normal and nol)"
    steps:
      - step: "Create computation item"
