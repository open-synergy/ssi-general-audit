        as_user: "base.user_admin"
        values:
          computation_item_id: "REC: comp_item.id"
          overall_materiality_percentage: 5.0
          performance_materiality_percentage: 75.0
          tolerable_misstatement_percentage: 50.0

      - step: "Assert materiality amounts computed per formula"
        action: "assert"
        target: "worksheet"
        asserts:
          overall_materiality:
            type: "value"
            expected: 50000.0
          performance_materiality:
            type: "value"
            expected: 37500.0
          tolerable_misstatement:
            type: "value"
            expected: 18750.0

      - step: "Set percentages to zero"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          overall_materiality_percentage: 0.0
          performance_materiality_percentage: 0.0
          tolerable_misstatement_percentage: 0.0

      - step: "Assert materiality amounts are zero"
        action: "assert"
        target: "worksheet"
        asserts:
          overall_materiality:
            type: "value"
            expected: 0.0
          performance_materiality:
            type: "value"
            expected: 0.0
          tolerable_misstatement:
            type: "value"
