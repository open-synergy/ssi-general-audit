options:
  auto_refresh: true

setup:
  steps:
    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - Data Collection"
        code: "/"

    - step: "Create client account type"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - Data Collection"
        code: "/"
        group_id: "REC: account_group.id"
        normal_balance: "dr"
        python_code: "result = 0.0"

    - step: "Create data collection category"
      action: "create"
      model: "general_audit_data_collection_category"
      save_as: "category"
      as_user: "base.user_admin"
      values:
        name: "Test Category - Data Collection"
        code: "/"

scenarios:
  # Positive: an Account Type item keeps its account type, and a file
  # item is saved without one.
  - name: "Account Type and file items are saved"
    steps:
      - step: "Create item of type Account Type"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_account_type"
        as_user: "base.user_admin"
        values:
          name: "Trial balance file"
          code: "/"
          type: "account_type"
          account_type_id: "REC: account_type.id"
          category_id: "REC: category.id"

      - step: "Create item of type Permanent File"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_file"
        as_user: "base.user_admin"
        values:
          name: "Organization chart"
          code: "/"
          type: "permanent_file"
          category_id: "REC: category.id"

      - step: "Assert the Account Type item keeps its account type"
        action: "assert"
        target: "item_account_type"
        asserts:
          account_type_id:
            type: "m2o"
            expected: "REC: account_type"

      - step: "Assert the Permanent File item has no account type"
        action: "assert"
        target: "item_file"
        asserts:
          account_type_id:
            type: "value"
            operator: "is_falsy"

  # Positive: the sort key starts with the type rank, so Permanent File
  # sorts before Current File even when its code sorts after, and numbers still sort by value inside a type.
  - name: "Sort key ranks Permanent File before Current File"
    steps:
      - step: "Create Permanent File item 2"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_paf_2"
        as_user: "base.user_admin"
        values:
          name: "Sort key permanent 2"
          code: "ZP-2"
          type: "permanent_file"
          category_id: "REC: category.id"

      - step: "Create Permanent File item 10"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_paf_10"
        as_user: "base.user_admin"
        values:
          name: "Sort key permanent 10"
          code: "ZP-10"
          type: "permanent_file"
          category_id: "REC: category.id"

      - step: "Create Current File item 2"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_caf_2"
        as_user: "base.user_admin"
        values:
          name: "Sort key current 2"
          code: "ZC-2"
          type: "current_file"
          category_id: "REC: category.id"

      - step: "Assert the Permanent File item 2 key"
        action: "assert"
        target: "item_paf_2"
        asserts:
          code_sort:
            type: "value"
            expected: "1ZP-00000002"

      - step: "Assert the Permanent File item 10 key sorts by number"
        action: "assert"
        target: "item_paf_10"
        asserts:
          code_sort:
            type: "value"
            expected: "1ZP-00000010"

      - step: "Assert the Current File item 2 key"
        action: "assert"
        target: "item_caf_2"
        asserts:
          code_sort:
            type: "value"
            expected: "2ZC-00000002"

  # Negative: an Account Type item without an account type is rejected,
  # and an item without a category is rejected.
  - name: "Account Type item without account type is rejected"
    steps:
      - step: "Item of type Account Type without account type must be rejected"
        action: "create"
        model: "general_audit_data_collection"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          name: "Invalid item"
          code: "/"
          type: "account_type"
          category_id: "REC: category.id"

  - name: "Item without category is rejected"
    steps:
      - step: "Item without category must be rejected"
        action: "form"
        model: "general_audit_data_collection"
        as_user: "base.user_admin"
        expect_error:
          type: "AssertionError"
          message_contains: "is a required field"
        values:
          name: "Invalid item"
          code: "/"
          type: "permanent_file"

  # Positive: a Primary item is saved without a category, and its sort key
  # starts with the Primary rank.
  - name: "Primary item is saved without a category"
    steps:
      - step: "Create item of type Primary without category"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_primary"
        as_user: "base.user_admin"
        values:
          name: "Primary item"
          code: "ZR-2"
          type: "primary"

      - step: "Assert the Primary item has no category and ranks last"
        action: "assert"
        target: "item_primary"
        asserts:
          category_id:
            type: "value"
            operator: "is_falsy"
          code_sort:
            type: "value"
            expected: "3ZR-00000002"

  # Positive: the form saves a Primary item and clears the chosen category.
  - name: "Changing the type to Primary clears the category"
    steps:
      - step: "Choose a category, then change the type to Primary"
        action: "form"
        model: "general_audit_data_collection"
        save_as: "item_form_primary"
        as_user: "base.user_admin"
        values:
          name: "Primary item from form"
          code: "/"
          type: "permanent_file"
          category_id: "REC: category"

      - step: "Change the saved item to Primary"
        action: "form"
        target: "item_form_primary"
        as_user: "base.user_admin"
        values:
          type: "primary"

      - step: "Assert the category was cleared"
        action: "assert"
        target: "item_form_primary"
        asserts:
          category_id:
            type: "value"
            operator: "is_falsy"

  # Negative: only Primary items may be saved without a category.
  - name: "Current File item without category is rejected"
    steps:
      - step: "Item of type Current File without category must be rejected"
        action: "create"
        model: "general_audit_data_collection"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
          message_contains: "Category is required when the type is not Primary."
        values:
          name: "Invalid current file item"
          code: "/"
          type: "current_file"

  - name: "Removing the type Primary without category is rejected"
    steps:
      - step: "Create item of type Primary"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_primary_changed"
        as_user: "base.user_admin"
        values:
          name: "Primary item to change"
          code: "/"
          type: "primary"

      - step: "Changing the type without a category must be rejected"
        action: "write"
        target: "item_primary_changed"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
          message_contains: "Category is required when the type is not Primary."
        values:
          type: "permanent_file"

  # Positive: the five Primary items ship as master data.
  - name: "Primary items are installed"
    steps:
      - step: "Search the Primary items without category"
        action: "search"
        model: "general_audit_data_collection"
        domain:
          [
            ["code", "in", ["PRM-1", "PRM-2", "PRM-3", "PRM-4", "PRM-5"]],
            ["type", "=", "primary"],
            ["category_id", "=", false],
            ["account_type_id", "=", false],
          ]
        save_as: "primary_items"
        expect_count: 5

  # Positive: the standard categories ship as master data.
  - name: "Standard categories are installed"
    steps:
      - step: "Search the standard categories by code"
        action: "search"
        model: "general_audit_data_collection_category"
        domain:
          [
            [
              "code",
              "in",
              [
                "DATA-CATEG-1",
                "DATA-CATEG-2",
                "DATA-CATEG-3",
                "DATA-CATEG-4",
                "DATA-CATEG-5",
              ],
            ],
          ]
        save_as: "standard_categories"
        expect_count: 5
