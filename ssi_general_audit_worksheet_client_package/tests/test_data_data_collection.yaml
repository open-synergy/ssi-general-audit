options:
  auto_refresh: true

setup:
  steps:
    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - Data Collection"
        code: "/"

    - step: "Create client account type"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - Data Collection"
        code: "/"
        group_id: "REC: account_group.id"
        normal_balance: "dr"
        python_code: "result = 0.0"

    - step: "Create data collection category"
      action: "create"
      model: "general_audit_data_collection_category"
      save_as: "category"
      as_user: "base.user_admin"
      values:
        name: "Test Category - Data Collection"
        code: "/"

scenarios:
  # Positive: an Account Type item keeps its account type, and an Others
  # item is saved without one.
  - name: "Account Type and Others items are saved"
    steps:
      - step: "Create item of type Account Type"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_account_type"
        as_user: "base.user_admin"
        values:
          name: "Trial balance file"
          code: "/"
          type: "account_type"
          account_type_id: "REC: account_type.id"
          category_id: "REC: category.id"

      - step: "Create item of type Others"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "item_others"
        as_user: "base.user_admin"
        values:
          name: "Organization chart"
          code: "/"
          type: "others"
          category_id: "REC: category.id"

      - step: "Assert the Account Type item keeps its account type"
        action: "assert"
        target: "item_account_type"
        asserts:
          account_type_id:
            type: "m2o"
            expected: "REC: account_type"

      - step: "Assert the Others item has no account type"
        action: "assert"
        target: "item_others"
        asserts:
          account_type_id:
            type: "value"
            operator: "is_falsy"

  # Negative: an Account Type item without an account type is rejected,
  # and an item without a category is rejected.
  - name: "Account Type item without account type is rejected"
    steps:
      - step: "Item of type Account Type without account type must be rejected"
        action: "create"
        model: "general_audit_data_collection"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
        values:
          name: "Invalid item"
          code: "/"
          type: "account_type"
          category_id: "REC: category.id"

  - name: "Item without category is rejected"
    steps:
      - step: "Item without category must be rejected"
        action: "form"
        model: "general_audit_data_collection"
        as_user: "base.user_admin"
        expect_error:
          type: "AssertionError"
          message_contains: "is a required field"
        values:
          name: "Invalid item"
          code: "/"
          type: "others"

  # Positive: the three standard categories ship as master data.
  - name: "Standard categories are installed"
    steps:
      - step: "Search the three standard categories by name"
        action: "search"
        model: "general_audit_data_collection_category"
        domain:
          [
            [
              "name",
              "in",
              [
                "Client Data (Internal)",
                "Third-Party Data (External)",
                "Additional / Analytical Data",
              ],
            ],
          ]
        save_as: "standard_categories"
        expect_count: 3
