      - step: "Map client account A (type A only)"
        action: "create"
        model: "client_account_mapping.detail"
        save_as: "mapping_detail_a"
        as_user: "base.user_admin"
        values:
          mapping_id: "REC: mapping.id"
          account_id: "REC: account_a.id"

      - step: "Get a seeded category"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_client_package.general_audit_data_collection_category_1_ffbc1f1d"
        save_as: "category"

      - step: "Create master for type A (mapped)"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "master_a"
        as_user: "base.user_admin"
        values:
          name: "Master for type A"
          code: "/"
          type: "account_type"
          account_type_id: "REC: account_type_a.id"
          category_id: "REC: category.id"

      - step: "Create master for type B (not mapped)"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "master_b"
        as_user: "base.user_admin"
        values:
          name: "Master for type B"
          code: "/"
          type: "account_type"
          account_type_id: "REC: account_type_b.id"
          category_id: "REC: category.id"

      - step: "Create master of type Permanent File"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "master_p"
        as_user: "base.user_admin"
        values:
          name: "Master Permanent"
          code: "/"
          type: "permanent_file"
          category_id: "REC: category.id"

      - step: "Create master of type Current File"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "master_c"
        as_user: "base.user_admin"
        values:
          name: "Master Current"
          code: "/"
          type: "current_file"
          category_id: "REC: category.id"

      - step: "Create master of type Primary"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "master_primary"
        as_user: "base.user_admin"
        values:
          name: "Master Primary"
          code: "/"
          type: "primary"

      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_f5a3cee"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Populate"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert the Permanent File list holds only items of its type"
        action: "search"
        model: "general_audit_ws_f5a3cee.permanent"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id.type", "!=", "permanent_file"]
        save_as: "permanent_wrong_type"
        expect_count: 0

      - step: "Assert the Current File list holds only items of its type"
        action: "search"
        model: "general_audit_ws_f5a3cee.current"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id.type", "!=", "current_file"]
        save_as: "current_wrong_type"
        expect_count: 0

      - step: "Assert one detail, for the mapped type only"
        action: "search"
        model: "general_audit_ws_f5a3cee.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "detail"
        expect_count: 1

      - step: "Assert one data line, from the mapped type's master"
        action: "search"
        model: "general_audit_ws_f5a3cee.detail_line"
        domain:
          - ["detail_id", "=", "REC: detail.id"]
          - ["data_collection_id", "=", "REC: master_a.id"]
        save_as: "line_a"
        expect_count: 1

      - step: "Assert no data line from the unmapped type's master"
        action: "search"
        model: "general_audit_ws_f5a3cee.detail_line"
        domain:
          - ["detail_id", "=", "REC: detail.id"]
          - ["data_collection_id", "=", "REC: master_b.id"]
        save_as: "found_1"
        expect_count: 0

      - step: "Assert Populate adds no reporting timetable row"
        action: "search"
        model: "general_audit_ws_f5a3cee.reporting_timetable"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "timetable_rows"
        expect_count: 0

      - step: "Assert one Permanent File line, from its master"
        action: "search"
        model: "general_audit_ws_f5a3cee.permanent"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_p.id"]
        save_as: "permanent_o"
        expect_count: 1

      - step: "Assert one Current File line, from its master"
        action: "search"
        model: "general_audit_ws_f5a3cee.current"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_c.id"]
        save_as: "current_c"
        expect_count: 1

      - step: "Fill the date on the populated data line"
        action: "write"
        target: "line_a"
        as_user: "base.user_admin"
        values:
          date: "2026-03-31"
          complete_ok: true

      - step: "Populate a second time"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert no duplicated data line"
        action: "search"
        model: "general_audit_ws_f5a3cee.detail_line"
        domain:
          - ["detail_id", "=", "REC: detail.id"]
        save_as: "found_2"
        expect_count: 1

      - step: "Assert no duplicated Permanent File line"
        action: "search"
        model: "general_audit_ws_f5a3cee.permanent"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_p.id"]
        save_as: "found_3"
        expect_count: 1

      - step: "Assert no duplicated Current File line"
        action: "search"
        model: "general_audit_ws_f5a3cee.current"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_c.id"]
        save_as: "found_current"
        expect_count: 1

      - step: "Assert the filled data line kept its date and completion"
        action: "assert"
        target: "line_a"
        asserts:
          name:
            type: "value"
            expected: "Master for type A"
          complete_ok:
            type: "value"
            expected: true

      - step: "Clear the category of the populated Permanent File line"
        action: "write"
        target: "permanent_o"
        as_user: "base.user_admin"
        values:
          category_id: false

      - step: "Populate to refill the empty category"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert the category was refilled from the master"
        action: "assert"
        target: "permanent_o"
        asserts:
          category_id:
            type: "m2o"
            expected: "REC: category"

      - step: "Add a data line without master"
        action: "create"
        model: "general_audit_ws_f5a3cee.detail_line"
        as_user: "base.user_admin"
        values:
          detail_id: "REC: detail.id"
          name: "Manual data"

      - step: "Deactivate master A"
        action: "write"
        target: "master_a"
        as_user: "base.user_admin"
        values:
          active: false

      - step: "Populate after deactivating master A"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert only the line without master survived"
        action: "search"
        model: "general_audit_ws_f5a3cee.detail_line"
        domain:
          - ["detail_id", "=", "REC: detail.id"]
        save_as: "found_4"
        expect_count: 1

      - step: "Assert the surviving line has no master"
        action: "search"
        model: "general_audit_ws_f5a3cee.detail_line"
        domain:
          - ["detail_id", "=", "REC: detail.id"]
          - ["data_collection_id", "=", false]
        save_as: "found_5"
        expect_count: 1

      - step: "Assert the Permanent File line is untouched"
        action: "search"
        model: "general_audit_ws_f5a3cee.permanent"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_p.id"]
        save_as: "found_6"
        expect_count: 1

