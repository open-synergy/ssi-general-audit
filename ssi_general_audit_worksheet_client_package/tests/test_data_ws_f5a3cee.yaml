        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Populate"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Find the line of the item to archive"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_archived.id"]
        save_as: "line_archived"
        expect_count: 1

      - step: "Find the line of the item to move"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_moved.id"]
        save_as: "line_moved"
        expect_count: 1

      - step: "Add a Primary line without master"
        action: "create"
        model: "general_audit_ws_f5a3cee.primary"
        save_as: "manual_line"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          description: "Manual primary line kept"

      - step: "Archive the first master item"
        action: "write"
        target: "master_archived"
        as_user: "base.user_admin"
        values:
          active: false

      - step: "Change the type of the second master item"
        action: "write"
        target: "master_moved"
        as_user: "base.user_admin"
        values:
          type: "permanent_file"
          category_id: "REC: category.id"

      - step: "Populate after the master changes"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert the line of the archived item is removed"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_archived.id"]
        save_as: "gone_archived"
        expect_count: 0

      - step: "Assert the line of the moved item is removed"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master_moved.id"]
        save_as: "gone_moved"
        expect_count: 0

      - step: "Assert the line without master survived"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", false]
        save_as: "manual_after"
        expect_count: 1

