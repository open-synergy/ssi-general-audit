    steps:
      - step: "Get the seeded Primary item PRM-1"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_client_package.general_audit_data_collection_1155_9f4c2a17"
        save_as: "seed_prm_1"

      - step: "Get the seeded Primary item PRM-2"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_client_package.general_audit_data_collection_1156_3b8e6d52"
        save_as: "seed_prm_2"

      - step: "Get the seeded Primary item PRM-3"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_client_package.general_audit_data_collection_1157_c71a0f94"
        save_as: "seed_prm_3"

      - step: "Get the seeded Primary item PRM-4"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_client_package.general_audit_data_collection_1158_5e29b8c3"
        save_as: "seed_prm_4"

      - step: "Get the seeded Primary item PRM-5"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_client_package.general_audit_data_collection_1159_a04d7e6b"
        save_as: "seed_prm_5"

      - step: "Create master item: Primary populate item"
        action: "create"
        model: "general_audit_data_collection"
        save_as: "master"
        as_user: "base.user_admin"
        values:
          name: "Primary populate item"
          code: "/"
          type: "primary"

      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_f5a3cee"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Populate a new worksheet"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert one line for each of the five seeded items"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - - "data_collection_id"
            - "in"
            - - "REC: seed_prm_1.id"
              - "REC: seed_prm_2.id"
              - "REC: seed_prm_3.id"
              - "REC: seed_prm_4.id"
              - "REC: seed_prm_5.id"
        save_as: "seeded_lines"
        expect_count: 5

      - step: "Assert every line comes from a Primary master"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id.type", "!=", "primary"]
        save_as: "wrong_type"
        expect_count: 0

      - step: "Find the line of the new master item"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master.id"]
        save_as: "line"
        expect_count: 1

      - step: "Assert the line took its name from the master"
        action: "assert"
        target: "line"
        asserts:
          description:
            type: "value"
            expected: "Primary populate item"
          complete_ok:
            type: "value"
            expected: false

      - step: "Fill the line like a user does"
        action: "write"
        target: "line"
        as_user: "base.user_admin"
        values:
          description: "Name typed by the user"
          date: 2026-03-31
          complete_ok: true

      - step: "Add a Primary line without master"
        action: "create"
        model: "general_audit_ws_f5a3cee.primary"
        save_as: "manual_line"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          description: "Manual primary line"

      - step: "Populate again"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert the master item is not duplicated"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["data_collection_id", "=", "REC: master.id"]
        save_as: "line_again"
        expect_count: 1

      - step: "Assert the user values are kept"
        action: "assert"
        target: "line_again"
        asserts:
          id:
            type: "value"
            expected: "EVAL: registry['line'].id"
          description:
            type: "value"
            expected: "Name typed by the user"
          date:
            type: "value"
            expected: "EVAL: date(2026, 3, 31)"
          complete_ok:
            type: "value"
            expected: true

      - step: "Assert the seeded items are not duplicated"
        action: "search"
        model: "general_audit_ws_f5a3cee.primary"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - - "data_collection_id"
            - "in"
            - - "REC: seed_prm_1.id"
              - "REC: seed_prm_2.id"
              - "REC: seed_prm_3.id"
              - "REC: seed_prm_4.id"
              - "REC: seed_prm_5.id"
        save_as: "seeded_lines_again"
        expect_count: 5

      - step: "Empty the name of the line"
        action: "write"
        target: "line"
        as_user: "base.user_admin"
        values:
          description: ""

      - step: "Populate to refill the empty name"
        action: "call"
        target: "worksheet"
        method: "action_populate_details"
        as_user: "base.user_admin"

      - step: "Assert the empty name was filled from the master"
        action: "assert"
        target: "line"
        asserts:
          description:
            type: "value"
            expected: "Primary populate item"

      - step: "Assert the line without master is untouched"
        action: "assert"
        target: "manual_line"
        asserts:
          description:
            type: "value"
            expected: "Manual primary line"
          data_collection_id:
            type: "value"
            operator: "is_falsy"

