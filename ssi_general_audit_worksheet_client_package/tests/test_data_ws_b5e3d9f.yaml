setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - B5E3D9F"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - B5E3D9F"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-B5E3D9F-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - B5E3D9F"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - B5E3D9F"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - B5E3D9F"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type b5e3d9f"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_client_package.worksheet_type_b5e3d9f"
      save_as: "ws_type"

    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - B5E3D9F"
        code: "/"

    - step: "Create client account type"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - B5E3D9F"
        code: "/"
        group_id: "REC: account_group.id"
        normal_balance: "dr"
        # DILARANG membiarkan python_code pada default "result = document.balance":
        # general_audit.standard_detail._compute_extrapolation_balance akan crash
        # (AttributeError) begitu tipe akun ini terhubung ke sebuah standard_detail.
        python_code: "result = 0.0"

    - step: "Create client account"
      action: "create"
      model: "client_account"
      save_as: "account"
      as_user: "base.user_admin"
      values:
        name: "Test Client Account - B5E3D9F"
        code: "/"
        partner_id: "REC: client.id"
        type_id: "REC: account_type.id"

    - step: "Create conclusion for b5e3d9f worksheet type"
      action: "create"
      model: "general_audit_worksheet_conclusion"
      save_as: "conclusion"
      as_user: "base.user_admin"
      values:
        name: "Subledger is fully entered"
        code: "/"
        type_id: "REC: ws_type.id"

scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_b5e3d9f - Create in draft
  # ------------------------------------------------------------------
  - name: "Worksheet b5e3d9f - Create in draft"
    steps:
      - step: "Create worksheet b5e3d9f"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"
          type_id:
            type: "m2o"
            expected: "REC: ws_type"
          account_id:
            type: "m2o"
            expected: "REC: account"

  # ------------------------------------------------------------------
  # general_audit_ws_b5e3d9f.amount - _compute_amount - normal, CSV deterministik
  # ------------------------------------------------------------------
  - name: "Worksheet b5e3d9f - Compute amount lines (normal)"
    steps:
      - step: "Create worksheet with deterministic CSV raw data"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"
          thousand_separator: ","
          decimal_separator: "."
          raw_data: |
            Ref,Amount1,Amount2
            R1,"1,250.00",100
            R2,750.50,"2,000.00"
            R3,0,50.25

      - step: "Create amount line for column 2"
        action: "create"
        model: "general_audit_ws_b5e3d9f.amount"
        save_as: "amount_col2"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          label: "Amount1"
          col_number: 2

      - step: "Create amount line for column 3"
        action: "create"
        model: "general_audit_ws_b5e3d9f.amount"
        save_as: "amount_col3"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          label: "Amount2"
          col_number: 3

      - step: "Assert amount computed for column 2 (1,250.00 + 750.50 + 0)"
        action: "assert"
        target: "amount_col2"
        asserts:
          amount:
            type: "value"
            expected: 2000.50

      - step: "Assert amount computed for column 3 (100 + 2,000.00 + 50.25)"
        action: "assert"
        target: "amount_col3"
        asserts:
          amount:
            type: "value"
            expected: 2150.25

  # ------------------------------------------------------------------
  # general_audit_ws_b5e3d9f.amount - _compute_amount - kolom invalid /
  # raw_data kosong
  # ------------------------------------------------------------------
  - name: "Worksheet b5e3d9f - Compute amount (kolom invalid / raw_data kosong)"
    steps:
      - step: "Create worksheet with CSV raw data (2 columns wide)"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"
          thousand_separator: ","
          decimal_separator: "."
          raw_data: |
            Ref,Amount1
            R1,100
            R2,200

      - step: "Create amount line pointing at an out-of-range column"
        action: "create"
        model: "general_audit_ws_b5e3d9f.amount"
        save_as: "amount_invalid_col"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          label: "Out of range column"
          col_number: 99

      - step: "Assert amount is zero for the out-of-range column"
        action: "assert"
        target: "amount_invalid_col"
        asserts:
          amount:
            type: "value"
            expected: 0.0

      - step: "Create worksheet without raw data"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet_empty"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"
          thousand_separator: ","
          decimal_separator: "."

      - step: "Create amount line on the raw-data-less worksheet"
        action: "create"
        model: "general_audit_ws_b5e3d9f.amount"
        save_as: "amount_no_raw_data"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet_empty.id"
          label: "No raw data"
          col_number: 1

      - step: "Assert amount is zero when raw_data is empty"
        action: "assert"
        target: "amount_no_raw_data"
        asserts:
          amount:
            type: "value"
            expected: 0.0

  # ------------------------------------------------------------------
  # _compute_detail_id - normal and kosong
  # ------------------------------------------------------------------
  - name: "Worksheet b5e3d9f - Compute detail_id (normal and kosong)"
    steps:
      - step: "Create general_audit.detail for the account"
        action: "create"
        model: "general_audit.detail"
        save_as: "detail"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          account_id: "REC: account.id"

      - step: "Create worksheet with account_id set"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet_with_account"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"

      - step: "Assert detail_id resolved to the matching general_audit.detail"
        action: "assert"
        target: "worksheet_with_account"
        asserts:
          detail_id:
            type: "m2o"
            expected: "REC: detail"

      - step: "Create worksheet without account_id (standard_account mode)"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet_without_account"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"

      - step: "Assert detail_id empty when account_id is not set"
        action: "assert"
        target: "worksheet_without_account"
        asserts:
          detail_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # onchange_account_mode - clears the field not relevant to the new mode
  # ------------------------------------------------------------------
  - name: "Worksheet b5e3d9f - Onchange account_mode clears the other account field"
    steps:
      - step: "Create worksheet in account mode with account_id set"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"

      - step: "Open worksheet (account_mode/account_id/account_type_id become editable)"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Switch account_mode to standard_account via Form"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {account_mode: "standard_account"}

      - step: "Assert account_id was cleared by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          account_id:
            type: "value"
            operator: "is_falsy"

      - step: "Set account_type_id now that standard_account mode is active"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {account_type_id: "REC: account_type"}

      - step: "Assert account_type_id was actually persisted"
        action: "assert"
        target: "worksheet"
        asserts:
          account_type_id:
            type: "value"
            operator: "is_truthy"

      - step: "Switch account_mode back to account via Form"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {account_mode: "account"}

      - step: "Assert account_type_id was cleared by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          account_type_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # Workflow draft -> open -> confirm -> done
  # ------------------------------------------------------------------
  - name: "Worksheet b5e3d9f - Workflow confirm to done"
    steps:
      - step: "Create worksheet for workflow"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Subledger fully reconciles to the lead schedule."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # Cancel and restart (from open)
  # ------------------------------------------------------------------
  - name: "Worksheet b5e3d9f - Cancel and restart"
    steps:
      - step: "Create worksheet for cancel/restart"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_mode: "account"
          account_id: "REC: account.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"
