  # ------------------------------------------------------------------
  # 18. onchange_parent_type_id (mixin) - triggered by type_id
  #
  # `type_id` only ever takes its default value on a new record (see
  # `_default_type_id` in `general_audit_worksheet_mixin.py`) and the onchange
  # that copies it into `parent_type_id` (`onchange_parent_type_id`, declared
  # `@api.onchange("type_id")`) only fires through a Form. The installed
  # odoo_yaml_test (0.1.0) has no `action: form` handler, so - same as
  # scenarios 15-17 above - create the record normally (`type_id` gets its
  # default), then call the onchange method directly and assert in-memory.
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Onchange type_id mengisi parent_type_id (mixin)"
    steps:
      - step: "Create worksheet with default type_id"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"

      - step: "Call onchange_parent_type_id to simulate the type_id form trigger"
        action: "call"
        target: "onchange_worksheet"
        method: "onchange_parent_type_id"
        as_user: "base.user_admin"

      - step: "Assert default type_id propagated to parent_type_id via onchange"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_test_of_control.worksheet_type_e3f4a5b"
          parent_type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_test_of_control.worksheet_type_e3f4a5b"

