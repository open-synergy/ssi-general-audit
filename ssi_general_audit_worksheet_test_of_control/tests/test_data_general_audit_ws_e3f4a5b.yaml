scenarios:
  # ------------------------------------------------------------------
  # 1. Create WS e3f4a5b - draft
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Create in draft"
    steps:
      - step: "Create worksheet e3f4a5b"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"
          ref_col_number: 1
          note_col_number: 2

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          general_audit_id:
            type: "value"
            operator: "is_truthy"
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_test_of_control.worksheet_type_e3f4a5b"

  # ------------------------------------------------------------------
  # 2. Workflow draft -> open -> confirm -> done
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Workflow draft to done"
    steps:
      - step: "Create worksheet for workflow"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"
          ref_col_number: 1
          note_col_number: 2

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "EVAL: self.fx_conclusion.id"
          conclusion: "Control attributes tested are operating effectively."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # 3. _compute_raw_data / _compute_raw_data_title / _compute_population_count - normal
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Compute raw_data & population_count (normal)"
    steps:
      - step: "Create worksheet sourced from GL"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"
          ref_col_number: 1
          note_col_number: 2

      - step: "Assert raw_data, raw_data_title and population_count computed from GL"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            operator: "is_truthy"
          raw_data_title:
            type: "value"
            expected: "Test GL Population"
          population_count:
            type: "value"
            expected: 20

  # ------------------------------------------------------------------
  # 4. _compute_raw_data / _compute_population_count - kosong (data_mode tidak diisi)
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Compute raw_data & population_count (kosong)"
    steps:
      - step: "Create worksheet without data_mode/general_ledger_id"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"

      - step: "Assert raw_data falsy and population_count zero"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            operator: "is_falsy"
          population_count:
            type: "value"
            expected: 0

  # ------------------------------------------------------------------
  # 5. _compute_sample_actual (worksheet) - kosong, tanpa attribute
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Compute sample_actual (kosong, tanpa attribute)"
    steps:
      - step: "Create worksheet without any attribute"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"

      - step: "Assert sample_actual is zero"
        action: "assert"
        target: "worksheet"
        asserts:
          sample_actual:
            type: "value"
            expected: 0

  # ------------------------------------------------------------------
  # 6. Attribute - _compute_sample_sizes / _compute_sample_initial / _compute_sample_final
  #    aro = "5" (default) - EPER 0.00%, TDR 5% -> AICPA table lookup
  # ------------------------------------------------------------------
  - name: "Attribute e3f4a5b - Compute sample sizes (aro 5)"
    steps:
      - step: "Create worksheet with 20-item population"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"

      - step: "Create attribute Otorisasi"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Otorisasi"
          eper: 0.0
          tdr: 5
          aro: "5"

      - step: "Assert sample sizes from AICPA table (EPER 0.00%, TDR 5%)"
        action: "assert"
        target: "attribute"
        asserts:
          # _AICPA_5PCT[0.00][tdr=5] = 59
          sample_5pct:
            type: "value"
            expected: 59
          # _AICPA_10PCT[0.00][tdr=5] = 45
          sample_10pct:
            type: "value"
            expected: 45
          # aro = "5" -> sample_initial = sample_5pct
          sample_initial:
            type: "value"
            expected: 59
          # finite population correction: 59 / (1 + 59/20) = 14.9367... -> ceil = 15
          sample_final:
            type: "value"
            expected: 15

  # ------------------------------------------------------------------
  # 7. Attribute - aro diganti ke "10": sample_initial dan cuer ikut ARO yang baru
  # ------------------------------------------------------------------
  - name: "Attribute e3f4a5b - aro diganti ke 10 (sample_initial & cuer ikut ARO)"
    steps:
      - step: "Create worksheet with 20-item population"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"

      - step:
          "Create attribute Otorisasi with aro 5 and a deterministic zero-deviation
          sample"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Otorisasi"
          eper: 0.0
          tdr: 5
          aro: "5"
          # 25 filled rows, 0 deviations -> cuer_5pct = 11.3, cuer_10pct = 8.8
          # (genuinely different, so switching aro below is a meaningful check)
          sample_data: |
            Seq,Deviation
            1,FALSE
            2,FALSE
            3,FALSE
            4,FALSE
            5,FALSE
            6,FALSE
            7,FALSE
            8,FALSE
            9,FALSE
            10,FALSE
            11,FALSE
            12,FALSE
            13,FALSE
            14,FALSE
            15,FALSE
            16,FALSE
            17,FALSE
            18,FALSE
            19,FALSE
            20,FALSE
            21,FALSE
            22,FALSE
            23,FALSE
            24,FALSE
            25,FALSE

      - step:
          "Call action_compute_deviation (sample_actual/deviation_count are not
          auto-computed at create - see model docstring)"
        action: "call"
        target: "attribute"
        method: "action_compute_deviation"
        as_user: "base.user_admin"

      - step: "Assert sample_initial and cuer follow aro 5"
        action: "assert"
        target: "attribute"
        asserts:
          # aro = "5" -> sample_initial = sample_5pct
          sample_initial:
            type: "value"
            expected: 59
          # aro = "5" -> cuer = cuer_5pct = _CUER_5PCT[25][k=0] = 11.3
          cuer:
            type: "value"
            expected: 11.3

      - step: "Write aro to 10"
        action: "write"
        target: "attribute"
        values:
          aro: "10"

      - step: "Assert sample_initial and cuer now follow aro 10"
        action: "assert"
        target: "attribute"
        asserts:
          # aro = "10" -> sample_initial = sample_10pct
          sample_initial:
            type: "value"
            expected: 45
          # aro = "10" -> cuer = cuer_10pct = _CUER_10PCT[25][k=0] = 8.8
          cuer:
            type: "value"
            expected: 8.8

  # ------------------------------------------------------------------
  # 8. _compute_sample_actual (worksheet) - normal: max(sample_final) dari 2 attribute
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Compute sample_actual (normal, dari 2 attribute)"
    steps:
      - step: "Create worksheet with 20-item population"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"

      - step: "Create first attribute (sample_final = 15)"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute_1"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Otorisasi"
          eper: 0.0
          tdr: 5
          aro: "5"

      - step: "Create second attribute (sample_final = 12)"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute_2"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Verifikasi"
          eper: 0.0
          tdr: 10
          aro: "5"

      - step: "Assert both attribute sample_final computed as expected"
        action: "assert"
        target: "attribute_1"
        asserts:
          sample_final:
            type: "value"
            expected: 15

      - step: "Assert second attribute sample_final"
        action: "assert"
        target: "attribute_2"
        asserts:
          sample_final:
            type: "value"
            expected: 12

      - step: "Assert worksheet sample_actual = max(sample_final) = 15"
        action: "assert"
        target: "worksheet"
        asserts:
          sample_actual:
            type: "value"
            expected: 15

  # ------------------------------------------------------------------
  # 9. action_compute_deviation - conclusion effective (cuer <= aro)
  # ------------------------------------------------------------------
  - name: "Attribute e3f4a5b - action_compute_deviation, conclusion effective"
    steps:
      - step: "Create worksheet with 20-item population"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"

      - step: "Create attribute with aro 10"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Otorisasi"
          eper: 0.0
          tdr: 5
          aro: "10"
          # 25 filled rows, 0 deviations -> CUER (10% table, n=25, k=0) = 8.8
          sample_data: |
            Seq,Deviation
            1,FALSE
            2,FALSE
            3,FALSE
            4,FALSE
            5,FALSE
            6,FALSE
            7,FALSE
            8,FALSE
            9,FALSE
            10,FALSE
            11,FALSE
            12,FALSE
            13,FALSE
            14,FALSE
            15,FALSE
            16,FALSE
            17,FALSE
            18,FALSE
            19,FALSE
            20,FALSE
            21,FALSE
            22,FALSE
            23,FALSE
            24,FALSE
            25,FALSE

      - step: "Call action_compute_deviation"
        action: "call"
        target: "attribute"
        method: "action_compute_deviation"
        as_user: "base.user_admin"

      - step: "Assert deviation counted as zero and conclusion effective"
        action: "assert"
        target: "attribute"
        asserts:
          sample_actual:
            type: "value"
            expected: 25
          deviation_count:
            type: "value"
            expected: 0
          deviation_rate_sample:
            type: "value"
            expected: 0.0
          # aro = "10" -> cuer = cuer_10pct = _CUER_10PCT[25][k=0] = 8.8
          cuer:
            type: "value"
            expected: 8.8
          conclusion:
            type: "value"
            expected: "effective"

  # ------------------------------------------------------------------
  # 10. action_compute_deviation - conclusion not_effective (cuer > aro)
  # ------------------------------------------------------------------
  - name: "Attribute e3f4a5b - action_compute_deviation, conclusion not_effective"
    steps:
      - step: "Create worksheet with 20-item population"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"

      - step: "Create attribute with aro 5"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Otorisasi"
          eper: 0.0
          tdr: 5
          aro: "5"
          # 25 filled rows, 1 deviation -> CUER (5% table, n=25, k=1) = 17.6
          sample_data: |
            Seq,Deviation
            1,TRUE
            2,FALSE
            3,FALSE
            4,FALSE
            5,FALSE
            6,FALSE
            7,FALSE
            8,FALSE
            9,FALSE
            10,FALSE
            11,FALSE
            12,FALSE
            13,FALSE
            14,FALSE
            15,FALSE
            16,FALSE
            17,FALSE
            18,FALSE
            19,FALSE
            20,FALSE
            21,FALSE
            22,FALSE
            23,FALSE
            24,FALSE
            25,FALSE

      - step: "Call action_compute_deviation"
        action: "call"
        target: "attribute"
        method: "action_compute_deviation"
        as_user: "base.user_admin"

      - step: "Assert one deviation counted and conclusion not_effective"
        action: "assert"
        target: "attribute"
        asserts:
          sample_actual:
            type: "value"
            expected: 25
          deviation_count:
            type: "value"
            expected: 1
          deviation_rate_sample:
            type: "value"
            expected: 4.0
          # aro = "5" -> cuer = cuer_5pct = _CUER_5PCT[25][k=1] = 17.6
          cuer:
            type: "value"
            expected: 17.6
          conclusion:
            type: "value"
            expected: "not_effective"

  # ------------------------------------------------------------------
  # 11. action_compute_deviation - sample_data kosong -> sample_actual 0, conclusion falsy
  # ------------------------------------------------------------------
  - name: "Attribute e3f4a5b - action_compute_deviation, sample_data kosong"
    steps:
      - step: "Create worksheet with 20-item population"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"

      - step: "Create attribute without sample_data"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Otorisasi"
          eper: 0.0
          tdr: 5
          aro: "5"

      - step: "Call action_compute_deviation on empty sample_data"
        action: "call"
        target: "attribute"
        method: "action_compute_deviation"
        as_user: "base.user_admin"

      - step: "Assert sample_actual zero and conclusion falsy"
        action: "assert"
        target: "attribute"
        asserts:
          sample_actual:
            type: "value"
            expected: 0
          deviation_count:
            type: "value"
            expected: 0
          conclusion:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # 12. action_generate_sample - sukses: sample_data kosong sebelum, terisi (+ cascade) sesudah
  #     TIDAK assert isi baris (random.sample) - hanya truthy/falsy dan struktur.
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - action_generate_sample sukses (cascade ke attribute)"
    steps:
      - step: "Create worksheet with 20-item population"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"
          data_mode: "gl"
          general_ledger_id: "EVAL: self.fx_gl.id"
          ref_col_number: 1
          note_col_number: 2

      - step: "Create attribute so sample_actual > 0"
        action: "create"
        model: "general_audit_ws_e3f4a5b.attribute"
        save_as: "attribute"
        as_user: "base.user_admin"
        values:
          worksheet_id: "EVAL: registry['worksheet'].id"
          name: "Otorisasi"
          eper: 0.0
          tdr: 5
          aro: "5"

      - step: "Assert worksheet sample_data is empty before generating"
        action: "assert"
        target: "worksheet"
        asserts:
          sample_data:
            type: "value"
            operator: "is_falsy"

      - step: "Call action_generate_sample"
        action: "call"
        target: "worksheet"
        method: "action_generate_sample"
        as_user: "base.user_admin"

      - step: "Assert worksheet sample_data filled (no assertion on random row content)"
        action: "assert"
        target: "worksheet"
        asserts:
          sample_data:
            type: "value"
            operator: "is_truthy"

      - step: "Assert cascaded attribute sample_data filled"
        action: "assert"
        target: "attribute"
        asserts:
          sample_data:
            type: "value"
            operator: "is_truthy"

  # ------------------------------------------------------------------
  # 13. action_generate_sample - UserError bila raw_data kosong
  #
  # The installed odoo_yaml_test (0.1.0) has no `expect_error:` handler
  # (only `asserts:` after a successful call - see `_action_call` in
  # `odoo_yaml_test/case.py`), so an exception raised by the called method
  # simply propagates and fails the step instead of being treated as
  # expected. This case is covered instead by
  # `test_action_generate_sample_raises_without_raw_data` in
  # `test_general_audit_ws_e3f4a5b.py`, using `assertRaises` directly.
  # ------------------------------------------------------------------

  # ------------------------------------------------------------------
  # 14. onchange_account_type_id - triggered by general_audit_id
  #
  # `general_audit_id` is only Form-editable in state "draft" (states={"draft":
  # [("readonly", False)]}), while `account_type_id` is only Form-editable in
  # state "open" (states={"open": [("readonly", False)]}) - the two conditions
  # never overlap on the same record, so this cannot be driven through
  # `action: form` at all (setting account_type_id on a draft-state Form
  # raises, and even a bypassed value would not survive Form.save() since it
  # never persists readonly fields). This is the same pre-existing limitation
  # already documented and fixed for the sibling `general_audit_ws_b4f7d9c`
  # worksheet in `ssi_general_audit_worksheet_audit_procedure_vouching` - see
  # `test_onchange_general_audit_id_clears_account_type` in
  # `test_general_audit_ws_e3f4a5b.py` for the Python-only equivalent (calls
  # `onchange_account_type_id()` directly instead of through Form).
  # ------------------------------------------------------------------

  # ------------------------------------------------------------------
  # 15. onchange_account_id - triggered by account_type_id
  #
  # The installed odoo_yaml_test (0.1.0) has no `action: form` handler (only
  # create/write/call/assert/ref/search are dispatched - see `_dispatch_step`
  # in `odoo_yaml_test/case.py`), so the onchange trigger is simulated the
  # same way `test_onchange_general_audit_id_clears_account_type` does it in
  # `test_general_audit_ws_e3f4a5b.py`: write the pre-condition value(s) via
  # ORM, then call the `@api.onchange` method directly and assert on the
  # in-memory result.
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Onchange account_type_id mengosongkan account_id"
    steps:
      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "EVAL: self.fx_audit.id"
          type_id: "EVAL: self.fx_ws_type.id"

      - step: "Open worksheet (account_id/account_type_id become editable)"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Set account_id"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
