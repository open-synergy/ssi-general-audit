  # ------------------------------------------------------------------
  # 14. onchange_account_type_id - triggered by general_audit_id
  #
  # `general_audit_id` is only Form-editable in state "draft" (states={"draft":
  # [("readonly", False)]}), while `account_type_id` is only Form-editable in
  # state "open" (states={"open": [("readonly", False)]}) - the two fields are
  # never simultaneously editable through the Form/view layer. To still
  # exercise the onchange itself, `account_type_id` is pre-set with a direct
  # `write` (ORM-level, bypasses the view-only readonly restriction) while the
  # worksheet is still in draft, then `action: form` is used only to touch
  # `general_audit_id` (legitimately editable in draft) and observe the clear.
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Onchange general_audit_id mengosongkan account_type_id"
    steps:
      - step: "Create worksheet in draft"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Pre-set account_type_id directly (bypasses view readonly)"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          account_type_id: "REC: account_type.id"

      - step: "Re-assign general_audit_id via form to trigger the onchange"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {general_audit_id: "REC: audit"}

      # Asserted on the saved record (not inline inside the form `ops:` block):
      # asserting a falsy many2one from within `ops: [..., {assert: ...}]`
      # crashes odoo-yaml-test with `AssertionError: __len__ was not found in
      # the view` (the library's form-field read helper mis-forwards __len__
      # lookups on an empty many2one to the underlying Form's field resolver).
      # Reading the persisted value through a normal top-level `action: assert`
      # avoids that code path entirely and still proves the onchange fired.
      - step: "Assert account_type_id was cleared by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          account_type_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # 15. onchange_account_id - triggered by account_type_id
  # `account_id` and `account_type_id` are both Form-editable in state "open" -
  # open the worksheet first, then exercise both through the same form step.
  # ------------------------------------------------------------------
  - name: "WS e3f4a5b - Onchange account_type_id mengosongkan account_id"
    steps:
      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_e3f4a5b"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet (account_id/account_type_id become editable)"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Set account_id then change account_type_id via form"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {account_id: "REC: account"}
          - set: {account_type_id: "REC: account_type"}

      # See note in the previous scenario: asserted post-save, not inline in `ops:`.
      - step: "Assert account_id was cleared by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          account_id:
            type: "value"
            operator: "is_falsy"

