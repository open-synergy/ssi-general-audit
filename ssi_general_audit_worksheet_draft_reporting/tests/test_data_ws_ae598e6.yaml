      - step: "Assert rows populated before result changes"
        action: "assert"
        target: "worksheet"
        asserts:
          influence_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          control_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Mark the influence discussion line as resolved (not escalated)"
        action: "write"
        target: "bc3e272_influence"
        as_user: "base.user_admin"
