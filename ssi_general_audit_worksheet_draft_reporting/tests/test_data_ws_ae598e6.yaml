      - step: "Assert influence_ids is now empty"
        action: "assert"
        target: "worksheet"
        asserts:
          influence_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

      - step: "Assert control_ids is now empty"
        action: "assert"
