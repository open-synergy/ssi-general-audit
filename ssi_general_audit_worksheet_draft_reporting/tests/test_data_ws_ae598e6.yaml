setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - ae598e6"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - ae598e6"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-AE598E6-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - ae598e6"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - ae598e6"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - ae598e6"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type a0319a2 (Findings That Influence Opinion)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_audit_result.worksheet_type_a0319a2"
      save_as: "ws_type_a0319a2"

    - step: "Get worksheet type d33420f (Control Deficiencies)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_audit_result.worksheet_type_d33420f"
      save_as: "ws_type_d33420f"

    - step: "Get worksheet type bc3e272 (Audit Result Discussion)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_audit_result.worksheet_type_bc3e272"
      save_as: "ws_type_bc3e272"

    - step: "Get worksheet type ae598e6 (Management Letter)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_ae598e6"
      save_as: "ws_type_ae598e6"

scenarios:
  # ------------------------------------------------------------------
  # ae598e6 - Populate via action_open (normal)
  # ------------------------------------------------------------------
  - name: "Worksheet ae598e6 - Populate via action_open (normal)"
    steps:
      - step: "Create worksheet a0319a2 (findings source)"
        action: "create"
        model: "general_audit_ws_a0319a2"
        save_as: "ws_a0319a2"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a0319a2.id"

      - step: "Create finding detail on a0319a2"
        action: "create"
        model: "general_audit_ws_a0319a2.detail"
        save_as: "detail_influence"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: ws_a0319a2.id"
          risk: "major"
          condition: "Cash count discrepancy noted at year end."

      - step: "Create worksheet d33420f (control deficiency source)"
        action: "create"
        model: "general_audit_ws_d33420f"
        save_as: "ws_d33420f"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d33420f.id"

      - step: "Create control deficiency detail on d33420f"
        action: "create"
        model: "general_audit_ws_d33420f.detail"
        save_as: "detail_control"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: ws_d33420f.id"
          risk: "minor"
          condition: "Segregation of duties gap in the disbursement process."

      - step: "Create worksheet bc3e272 (audit result discussion)"
        action: "create"
        model: "general_audit_ws_bc3e272"
        save_as: "ws_bc3e272"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bc3e272.id"

      - step: "Create escalated influence discussion line on bc3e272"
        action: "create"
        model: "general_audit_ws_bc3e272.influence"
        save_as: "bc3e272_influence"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: ws_bc3e272.id"
          detail_id: "REC: detail_influence.id"
          result: "escalated"

      - step: "Create escalated control discussion line on bc3e272"
        action: "create"
        model: "general_audit_ws_bc3e272.control"
        save_as: "bc3e272_control"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: ws_bc3e272.id"
          detail_id: "REC: detail_control.id"
          result: "escalated"

      - step: "Create worksheet ae598e6"
        action: "create"
        model: "general_audit_ws_ae598e6"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_ae598e6.id"

      - step: "Open worksheet ae598e6 (triggers post_open_action populate)"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert influence_ids populated with 1 row"
        action: "assert"
        target: "worksheet"
        asserts:
          influence_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Assert control_ids populated with 1 row"
        action: "assert"
        target: "worksheet"
        asserts:
          control_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Verify the populated influence line and its related fields"
        action: "search"
        model: "general_audit_ws_ae598e6.influence"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "influence_row"
        expect_count: 1

      - step: "Assert influence line related risk/condition"
        action: "assert"
        target: "influence_row"
        asserts:
          influence_id:
            type: "m2o"
            expected: "REC: bc3e272_influence"
          risk:
            type: "value"
            expected: "major"
          condition:
            type: "value"
            expected: "Cash count discrepancy noted at year end."

      - step: "Verify the populated control line and its related fields"
        action: "search"
        model: "general_audit_ws_ae598e6.control"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "control_row"
        expect_count: 1

      - step: "Assert control line related risk/condition"
        action: "assert"
        target: "control_row"
        asserts:
          control_id:
            type: "m2o"
            expected: "REC: bc3e272_control"
          risk:
            type: "value"
            expected: "minor"
          condition:
            type: "value"
            expected: "Segregation of duties gap in the disbursement process."

