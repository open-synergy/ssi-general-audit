setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - Draft Reporting"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - Draft Reporting"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-DRAFTREP-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - Draft Reporting"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - Draft Reporting"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - Draft Reporting"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type b555edd"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_b555edd"
      save_as: "ws_type_b555edd"

    - step: "Get worksheet type e59c663"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_e59c663"
      save_as: "ws_type_e59c663"

    - step: "Get worksheet type de69c2f"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_de69c2f"
      save_as: "ws_type_de69c2f"

    - step: "Get worksheet type ff42fdc"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_ff42fdc"
      save_as: "ws_type_ff42fdc"

    - step: "Get worksheet type bbbdfe7"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_bbbdfe7"
      save_as: "ws_type_bbbdfe7"

    - step: "Get worksheet type ae598e6"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_ae598e6"
      save_as: "ws_type_ae598e6"

    # Official client_account_group codes used by the ff42fdc Posture
    # Report Total/Subtotal formulas (see _TOTAL_TYPE_FORMULA).
    - step: "Get client account group T001 (Current Asset)"
      action: "ref"
      xml_id: "ssi_general_audit.client_account_group_1_885ef902"
      save_as: "group_t001"

    - step: "Get client account group T002 (Non Current Asset)"
      action: "ref"
      xml_id: "ssi_general_audit.client_account_group_2_becd85c2"
      save_as: "group_t002"

    - step: "Get client account group T009 (Main Revenue)"
      action: "ref"
      xml_id: "ssi_general_audit.client_account_group_9_7849ad25"
      save_as: "group_t009"

    - step: "Get client account group T011 (Cost of Revenue)"
      action: "ref"
      xml_id: "ssi_general_audit.client_account_group_11_44410d3c"
      save_as: "group_t011"

    - step: "Get client account group T012 (Operating Expense)"
      action: "ref"
      xml_id: "ssi_general_audit.client_account_group_12_ae0c12b7"
      save_as: "group_t012"

    - step: "Get client account group T015 (Other Comprehensive Income)"
      action: "ref"
      xml_id: "ssi_general_audit.client_account_group_15_315c4d27"
      save_as: "group_t015"

scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_bbbdfe7.item - CRUD
  # ------------------------------------------------------------------
  - name: "Item bbbdfe7 master - Create, write, delete"
    steps:
      - step: "Create option set prerequisite"
        action: "create"
        model: "checklist.option_set"
        save_as: "option_set"
        as_user: "base.user_admin"
        values:
          name: "Test Option Set - bbbdfe7 Item CRUD"
          code: "/"

      - step: "Create item"
        action: "create"
        model: "general_audit_ws_bbbdfe7.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Item Repr A"
          code: "/"
          option_set_id: "REC: option_set.id"

      - step: "Assert item created"
        action: "assert"
        target: "item"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Item Repr A"

      - step: "Write new name"
        action: "write"
        target: "item"
        as_user: "base.user_admin"
        values:
          name: "Item Repr A1"

      - step: "Assert name updated"
        action: "assert"
        target: "item"
        asserts:
          name:
            type: "value"
            expected: "Item Repr A1"

      - step: "Delete item"
        action: "unlink"
        target: "item"
        as_user: "base.user_admin"

      - step: "Verify item deleted"
        action: "search"
        model: "general_audit_ws_bbbdfe7.item"
        domain:
          - ["id", "=", "REC: item.id"]
        save_as: "result"
        expect_count: 0

