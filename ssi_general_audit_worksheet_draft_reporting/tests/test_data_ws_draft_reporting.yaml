            type: "value"
            expected: 15000.0
          adjustment_credit:
            type: "value"
            expected: 45000.0
          # account_2 is credit-normal (type_id.normal_balance = "cr"):
          # 500,000 - 15,000 + 45,000 = 530,000
          audited:
            type: "value"
            expected: 530000.0

      - step: "Load posture a second time without any account change"
        action: "call"
        target: "worksheet"
        method: "action_load_posture"
        as_user: "base.user_admin"

      - step: "Assert still exactly two posture lines (diff-based, no duplicates)"
        action: "search"
        model: "general_audit_ws_ff42fdc.posture"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "postures_after_reload"
        expect_count: 2

