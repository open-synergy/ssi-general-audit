            type: "o2m"
            check: "count"
            expected_count: 0

      - step: "Load posture"
        action: "call"
        target: "worksheet"
        method: "action_load_posture"
        as_user: "base.user_admin"

      - step: "Assert two posture lines were created (one per account group)"
        action: "search"
        model: "general_audit_ws_ff42fdc.posture"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "postures_after_load"
        expect_count: 2

      - step: "Find posture line for group 1"
        action: "search"
        model: "general_audit_ws_ff42fdc.posture"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["group_id", "=", "REC: group_1.id"]
        save_as: "posture_1"
        limit: 1

      - step: "Find posture line for group 2"
        action: "search"
        model: "general_audit_ws_ff42fdc.posture"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["group_id", "=", "REC: group_2.id"]
        save_as: "posture_2"
        limit: 1

      - step: "Assert posture line for group 1 sums account 1's detail"
        action: "assert"
        target: "posture_1"
        asserts:
          unaudited:
            type: "value"
            expected: 1000000.0
          adjustment_debit:
            type: "value"
            expected: 50000.0
          adjustment_credit:
            type: "value"
            expected: 20000.0
          # account_1 is debit-normal (type_id.normal_balance = "dr"):
          # 1,000,000 + 50,000 - 20,000 = 1,030,000
          audited:
            type: "value"
            expected: 1030000.0

      - step: "Assert posture line for group 2 sums account 2's detail"
        action: "assert"
        target: "posture_2"
        asserts:
          unaudited:
            type: "value"
            expected: 500000.0
