  # ------------------------------------------------------------------
  # onchange_parent_type_id - inherited from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet b555edd - Onchange type_id sets parent_type_id"
    steps:
      # type_id is hard-readonly in the shared worksheet mixin form view and
      # only ever takes its default value on a new record, so the onchange
      # only fires once from that default. Save the form and assert on the
      # resulting record, matching the pattern already used by
      # ssi_general_audit_worksheet_physical_check's onchange test.
      - step: "Open new worksheet form with default type_id"
        action: "form"
        model: "general_audit_ws_b555edd"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit"
        save: true

      - step: "Assert default type_id propagated to parent_type_id via onchange"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_b555edd"
          parent_type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_b555edd"
