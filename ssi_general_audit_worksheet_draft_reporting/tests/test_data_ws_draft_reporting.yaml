  # ------------------------------------------------------------------
  # general_audit_ws_ff42fdc - Opinion propagation + workflow to done
  # ------------------------------------------------------------------
  - name: "Worksheet ff42fdc - Opinion propagation and workflow to done"
    steps:
      - step: "Create accountant opinion"
        action: "create"
        model: "accountant.opinion"
        save_as: "opinion"
        as_user: "base.user_admin"
        values:
          name: "Unmodified Opinion - Test"
          code: "/"

      - step: "Create conclusion for ff42fdc worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "Opinion formalised and documented"
          code: "/"
          type_id: "REC: ws_type_ff42fdc.id"

      - step: "Create worksheet ff42fdc"
        action: "create"
        model: "general_audit_ws_ff42fdc"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_ff42fdc.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Write opinion and opinion date on worksheet"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          financial_statement_opinion_id: "REC: opinion.id"
          financial_statement_opinion_date: 2026-03-31

      - step: "Assert opinion fields saved on worksheet"
        action: "assert"
        target: "worksheet"
        asserts:
          financial_statement_opinion_id:
            type: "m2o"
            expected: "REC: opinion"
          financial_statement_opinion_date:
            type: "value"
            expected: 2026-03-31

      # The worksheet fields are related to general_audit.opinion_id /
      # .opinion_date, whose targets are readonly=True at the Python field
      # level, so Odoo never generates the automatic related inverse (see
      # odoo/fields.py Field._setup_related_full). The worksheet therefore
      # declares explicit inverse methods; these asserts guard that the
      # write-through documented on the model really happens.
      - step: "Assert opinion propagated to the general audit"
        action: "assert"
        target: "audit"
        refresh: true
        asserts:
          opinion_id:
            type: "m2o"
            expected: "REC: opinion"
          opinion_date:
            type: "value"
            expected: 2026-03-31

      # Positive (Opini) - compliance_law_opinion_id / .._date and
      # compliance_internal_control_opinion_id / .._date are LOCAL to
      # the worksheet (unlike financial_statement_opinion_id above),
      # so writing them must NOT touch general_audit.opinion_id /
      # .opinion_date at all.
      - step: "Create compliance-with-laws opinion"
        action: "create"
        model: "accountant.opinion"
        save_as: "opinion_compliance_law"
        as_user: "base.user_admin"
        values:
          name: "Compliant Opinion - Laws - Test"
          code: "/"

      - step: "Create compliance-with-internal-control opinion"
        action: "create"
        model: "accountant.opinion"
        save_as: "opinion_compliance_internal_control"
        as_user: "base.user_admin"
        values:
          name: "Compliant Opinion - Internal Control - Test"
          code: "/"

      - step: "Write both compliance opinions on the worksheet"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          compliance_law_opinion_id: "REC: opinion_compliance_law.id"
          compliance_law_opinion_date: 2026-04-05
          compliance_internal_control_opinion_id:
            "REC: opinion_compliance_internal_control.id"
          compliance_internal_control_opinion_date: 2026-04-06

      - step: "Assert both compliance opinions saved on the worksheet"
        action: "assert"
        target: "worksheet"
        asserts:
          compliance_law_opinion_id:
            type: "m2o"
            expected: "REC: opinion_compliance_law"
          compliance_law_opinion_date:
            type: "value"
            expected: 2026-04-05
          compliance_internal_control_opinion_id:
            type: "m2o"
            expected: "REC: opinion_compliance_internal_control"
          compliance_internal_control_opinion_date:
            type: "value"
            expected: 2026-04-06

      - step: "Assert general audit opinion untouched by the compliance opinions"
        action: "assert"
        target: "audit"
        refresh: true
        asserts:
          opinion_id:
            type: "m2o"
            expected: "REC: opinion"
          opinion_date:
            type: "value"
            expected: 2026-03-31

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Opinion formalised and documented in the audit file."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

