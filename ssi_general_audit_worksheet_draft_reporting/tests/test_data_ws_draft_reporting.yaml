        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Write opinion and opinion date on worksheet"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          financial_statement_opinion_id: "REC: opinion.id"
          financial_statement_opinion_date: 2026-03-31

      - step: "Assert opinion fields saved on worksheet"
        action: "assert"
        target: "worksheet"
        asserts:
          financial_statement_opinion_id:
            type: "m2o"
            expected: "REC: opinion"
          financial_statement_opinion_date:
            type: "value"
            expected: 2026-03-31

      # The worksheet fields are related to general_audit.opinion_id /
      # .opinion_date, whose targets are readonly=True at the Python field
      # level, so Odoo never generates the automatic related inverse (see
      # odoo/fields.py Field._setup_related_full). The worksheet therefore
      # declares explicit inverse methods; these asserts guard that the
      # write-through documented on the model really happens.
      - step: "Assert opinion propagated to the general audit"
        action: "assert"
        target: "audit"
        refresh: true
        asserts:
          opinion_id:
            type: "m2o"
            expected: "REC: opinion"
          opinion_date:
            type: "value"
            expected: 2026-03-31

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Opinion formalised and documented in the audit file."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

