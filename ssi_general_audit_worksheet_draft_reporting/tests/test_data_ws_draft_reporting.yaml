      - step: "Assert posture line for T002 sums its detail, including Previous"
        action: "assert"
        target: "posture_t002"
        asserts:
          unaudited:
            type: "value"
            expected: 500000.0
          adjustment_debit:
            type: "value"
            expected: 15000.0
          adjustment_credit:
            type: "value"
            expected: 45000.0
          # T002 is debit-normal: 500,000 + 15,000 - 45,000 = 470,000
          audited:
            type: "value"
            expected: 470000.0
          previous:
            type: "value"
            expected: 400000.0

      - step: "Assert posture line for T009 (revenue, credit-normal)"
        action: "assert"
        target: "posture_t009"
        asserts:
          unaudited:
            type: "value"
            expected: 800000.0
          audited:
            type: "value"
            expected: 800000.0

      - step: "Assert posture line for T011 (cost of revenue)"
        action: "assert"
        target: "posture_t011"
        asserts:
          unaudited:
            type: "value"
            expected: 300000.0
          audited:
            type: "value"
            expected: 300000.0

      - step: "Assert posture line for T012 (operating expense)"
        action: "assert"
        target: "posture_t012"
        asserts:
          unaudited:
            type: "value"
            expected: 100000.0
          audited:
            type: "value"
            expected: 100000.0

      # Positive (Total) - total_asset = T001 + T002 on every column,
      # computed directly from general_audit.detail (not from other
      # Total lines).
      - step: "Assert total_asset sums T001 and T002"
        action: "assert"
        target: "posture_total_asset"
        asserts:
          unaudited:
            type: "value"
            # 1,000,000 + 500,000
            expected: 1500000.0
          adjustment_debit:
            type: "value"
            # 50,000 + 15,000
            expected: 65000.0
          adjustment_credit:
            type: "value"
            # 20,000 + 45,000
            expected: 65000.0
          audited:
            type: "value"
            # 1,030,000 + 470,000
            expected: 1500000.0
          previous:
            type: "value"
            # 900,000 + 400,000
            expected: 1300000.0

      # Positive (Total berantai) - gross_profit = T009 - T011, and
      # operating_profit = gross_profit - T012 (result consistency,
      # not recomputed from scratch).
      - step: "Assert gross_profit and operating_profit chain correctly"
        action: "assert"
        target: "posture_gross_profit"
        asserts:
          unaudited:
            type: "value"
            # 800,000 - 300,000
            expected: 500000.0
          audited:
            type: "value"
            expected: 500000.0

      - step: "Assert operating_profit follows from gross_profit minus T012"
        action: "assert"
        target: "posture_operating_profit"
        asserts:
          unaudited:
            type: "value"
            # 500,000 (gross_profit) - 100,000
            expected: 400000.0
          audited:
            type: "value"
            expected: 400000.0

      # Negatif - T015 has no account registered on the audit, so it
      # gets no Account Group line, but comprehensive_profit still
      # exists and equals profit_after_tax because T015's contribution
      # is 0 (no T010/T013/T014 data either, so profit_after_tax also
      # equals operating_profit here).
      - step: "Assert T015 has no Account Group posture line"
        action: "search"
        model: "general_audit_ws_ff42fdc.posture"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["line_type", "=", "group"]
          - ["group_id", "=", "REC: group_t015.id"]
        save_as: "posture_t015_absent"
        expect_count: 0

      - step: "Assert comprehensive_profit equals profit_after_tax"
        action: "assert"
        target: "posture_comprehensive_profit"
        asserts:
          unaudited:
            type: "value"
            expected: 400000.0
          audited:
            type: "value"
            expected: 400000.0

      - step: "Assert profit_after_tax matches (T015 contributes 0)"
        action: "assert"
        target: "posture_profit_after_tax"
        asserts:
          unaudited:
            type: "value"
            expected: 400000.0
          audited:
            type: "value"
            expected: 400000.0

      - step: "Load posture a second time without any account change"
        action: "call"
        target: "worksheet"
        method: "action_load_posture"
        as_user: "base.user_admin"

      - step: "Assert still exactly 14 posture lines (diff-based, no duplicates)"
        action: "search"
        model: "general_audit_ws_ff42fdc.posture"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "postures_after_reload"
        expect_count: 14

  # ------------------------------------------------------------------
  # general_audit_ws_b555edd - Cancel and restart
  # ------------------------------------------------------------------
  - name: "Worksheet b555edd - Cancel and restart"
    steps:
      - step: "Create worksheet b555edd"
        action: "create"
        model: "general_audit_ws_b555edd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_b555edd.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # onchange_parent_type_id - inherited from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet b555edd - Onchange type_id sets parent_type_id"
    steps:
      # type_id is hard-readonly in the shared worksheet mixin form view and
      # only ever takes its default value on a new record, so the onchange
      # only fires once from that default. Save the form and assert on the
      # resulting record, matching the pattern already used by
      # ssi_general_audit_worksheet_physical_check's onchange test.
      - step: "Open new worksheet form with default type_id"
        action: "form"
        model: "general_audit_ws_b555edd"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit"
        save: true

      - step: "Assert default type_id propagated to parent_type_id via onchange"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_b555edd"
          parent_type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_b555edd"

