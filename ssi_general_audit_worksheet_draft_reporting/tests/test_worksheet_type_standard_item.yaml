setup:
  steps:
    - step: "Get worksheet type BBBDFE7 (Management Representation)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_draft_reporting.worksheet_type_bbbdfe7"
      save_as: "type_bbbdfe7"

    - step: "Get ISA 580 standard audit item"
      action: "ref"
      xml_id: "ssi_general_audit.general_audit_standard_audit_26_75d27bec"
      save_as: "isa_580"

scenarios:
  # ------------------------------------------------------------------
  # Positive - standard_item_ids on BBBDFE7 contains exactly ISA 580
  # ------------------------------------------------------------------
  - name: "Worksheet type BBBDFE7 - standard_item_ids contains exactly ISA 580"
    steps:
      - step: "Assert standard_item_ids on BBBDFE7 is exactly {ISA 580}"
        action: "assert"
        target: "type_bbbdfe7"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: isa_580"

  # ------------------------------------------------------------------
  # Negative - standard_item_ids on BBBDFE7 does not carry other codes
  # (e.g. ISA 315/ISA 240 belonging to other worksheet types)
  # ------------------------------------------------------------------
  - name:
      "Worksheet type BBBDFE7 - standard_item_ids does not leak unrelated audit
      standards"
    steps:
      - step:
          "Search BBBDFE7 where standard_item_ids matches unrelated ISA codes (must be
          empty)"
        action: "search"
        model: "general_audit_worksheet_type"
        domain:
          - ["id", "=", "REC: type_bbbdfe7.id"]
          - ["standard_item_ids.code", "in", ["ISA 315", "ISA 240"]]
        save_as: "leaked_result"
        expect_count: 0
