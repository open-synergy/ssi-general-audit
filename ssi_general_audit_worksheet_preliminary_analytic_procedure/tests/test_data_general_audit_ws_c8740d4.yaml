# Shared fixture: a `general_audit` in state `open`, replayed before every
# scenario (see ssi_general_audit/tests/README_FIXTURE.md for the recipe this
# is copied from).
setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - PAP C8740D4"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - PAP C8740D4"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-PAP-C8740D4"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - PAP C8740D4"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - PAP C8740D4"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - PAP C8740D4"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

scenarios:
  - name: "Create checklist item"
    steps:
      - step: "Create item"
        action: "create"
        model: "general_audit_ws_c8740d4.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Draw a conclusion on the preliminary analytic procedure"
          code: "PAPC1-ITEM-001"
          option_set_id: "ssi_general_audit.checklist_option_set_1"
      - step: "Assert created"
        action: "assert"
        target: "item"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Draw a conclusion on the preliminary analytic procedure"

  - name: "Edit checklist item name"
    steps:
      - step: "Create item"
        action: "create"
        model: "general_audit_ws_c8740d4.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Select the calculation basis period"
          code: "PAPC1-ITEM-002"
          option_set_id: "ssi_general_audit.checklist_option_set_1"
      - step: "Write new name"
        action: "write"
        target: "item"
        as_user: "base.user_admin"
        values:
          name: "Select the calculation basis period (Updated)"
      - step: "Assert name updated"
        action: "assert"
        target: "item"
        asserts:
          name:
            type: "value"
            expected: "Select the calculation basis period (Updated)"

  - name: "Delete checklist item"
    steps:
      - step: "Create item"
        action: "create"
        model: "general_audit_ws_c8740d4.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Item to be deleted"
          code: "PAPC1-ITEM-003"
          option_set_id: "ssi_general_audit.checklist_option_set_1"
      - step: "Delete item"
        action: "unlink"
        target: "item"
        as_user: "base.user_admin"
      - step: "Verify deleted"
        action: "search"
        model: "general_audit_ws_c8740d4.item"
        domain: [["code", "=", "PAPC1-ITEM-003"]]
        save_as: "result"
        expect_count: 0

  - name: "Create worksheet c8740d4 and a checklist line"
    steps:
      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_c8740d4"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "ssi_general_audit_worksheet_preliminary_analytic_procedure.worksheet_type_c8740d4"
      - step: "Assert draft state"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"
      - step: "Create checklist item"
        action: "create"
        model: "general_audit_ws_c8740d4.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Vertical and horizontal analysis has been completed"
          code: "PAPC1-ITEM-004"
          option_set_id: "ssi_general_audit.checklist_option_set_1"
      - step: "Create checklist line on the worksheet"
        action: "create"
        model: "general_audit_ws_c8740d4.checklist"
        save_as: "checklist_line"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          item_id: "REC: item.id"
      - step: "Assert checklist_ids contains the created line"
        action: "assert"
        target: "worksheet"
        asserts:
          checklist_ids:
            type: "o2m"
            check: "contains"
            expected_records:
              - "REC: checklist_line"

  - name: "Create a conclusion line"
    steps:
      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_c8740d4"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "ssi_general_audit_worksheet_preliminary_analytic_procedure.worksheet_type_c8740d4"
      - step: "Create conclusion category"
        action: "create"
        model: "analytic_procedure_conclusion_category"
        save_as: "category"
        as_user: "base.user_admin"
        values:
          name: "Liquidity Position"
          code: "PAPC1-CAT-001"
          sequence: 10
      - step: "Create conclusion line"
        action: "create"
        model: "general_audit_ws_c8740d4.analytic_procedure_conclusion"
        save_as: "conclusion_line"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          category_id: "REC: category.id"
          name: "No significant liquidity risk identified."
      - step: "Assert conclusion_ids contains the line"
        action: "assert"
        target: "worksheet"
        asserts:
          conclusion_ids:
            type: "o2m"
            check: "contains"
            expected_records:
              - "REC: conclusion_line"
      - step: "Assert category_id on the conclusion line"
        action: "assert"
        target: "conclusion_line"
        asserts:
          category_id:
            type: "m2o"
            expected: "REC: category"

  - name: "Workflow draft to done"
    steps:
      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_c8740d4"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "ssi_general_audit_worksheet_preliminary_analytic_procedure.worksheet_type_c8740d4"
      - step: "Assert initial draft state"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"
      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"
      - step: "Invalidate cache after open"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"
      - step: "Assert open state"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create conclusion required before confirm"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name:
            "Preliminary Analytical Procedures do not indicate a risk of material
            misstatement."
          code: "/"
          type_id: "ssi_general_audit_worksheet_preliminary_analytic_procedure.worksheet_type_c8740d4"
      - step: "Fill conclusion fields required by _get_fields_required_before_confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion:
            "No significant risk indicators identified across the preliminary analytic
            procedures."
      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Invalidate cache after confirm"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"
      - step: "Assert confirm state"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"
      - step: "Invalidate cache after approve"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"
      - step: "Assert done state"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Workflow open to cancel to restart"
    steps:
      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_c8740d4"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "ssi_general_audit_worksheet_preliminary_analytic_procedure.worksheet_type_c8740d4"
      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"
      - step: "Invalidate cache after open"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"
      - step: "Assert open state"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "reason"
        as_user: "base.user_admin"
        values:
          name: "Salah input worksheet ringkasan"
          code: "CANCEL-C8740D4"
      - step: "Cancel worksheet via cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"
      - step: "Restart worksheet from cancel"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"
      - step: "Invalidate cache after restart"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"
      - step: "Assert draft state after restart"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"
