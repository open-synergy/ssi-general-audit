setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - D9D2B44"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - D9D2B44"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-D9D2B44-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - D9D2B44"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - D9D2B44"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - D9D2B44"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type d9d2b44"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.worksheet_type_d9d2b44"
      save_as: "ws_type_d9d2b44"

    - step: "Get conclusion for worksheet type d9d2b44 (module master data)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.general_audit_worksheet_conclusion_36_e8b65c56"
      save_as: "conclusion_d9d2b44"

# NOTE: worksheet_type_d9d2b44 has allowed_audit=True and max_number_allowed=2
# (see data/general_audit_worksheet_type_data.xml), so at most TWO
# general_audit_ws_d9d2b44 records may be linked to a given general_audit.
# Every scenario below stays within that limit. "audit" is a brand-new
# general_audit per scenario (setup: is replayed fresh), so the limit never
# accumulates across scenarios.
scenarios:
  # ------------------------------------------------------------------
  # Create - defaults
  # ------------------------------------------------------------------
  - name: "d9d2b44 - Create in draft (defaults)"
    steps:
      - step: "Create worksheet d9d2b44"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Assert worksheet created in draft with default base_amount_source"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          base_amount_source:
            type: "value"
            expected: "extrapolation"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"
          type_id:
            type: "m2o"
            expected: "REC: ws_type_d9d2b44"

  # ------------------------------------------------------------------
  # _compute_base - extrapolation, end_period, other_amount_ok override
  # (chained on the same worksheet, like the proven bb33b94 pattern)
  # ------------------------------------------------------------------
  - name:
      "d9d2b44 - _compute_base (extrapolation, end_period, other_amount_ok override)"
    steps:
      - step: "Create computation item"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - Base Amount"
          code: "/"

      - step: "Create general audit computation with both amounts"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item.id"
          extrapolation_amount: 1000000.0
          home_amount: 800000.0

      - step: "Create worksheet d9d2b44"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Set computation_item_id with base_amount_source=extrapolation"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          computation_item_id: "REC: comp_item.id"
          base_amount_source: "extrapolation"

      - step: "Assert base_computation_amount from extrapolation_amount"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 1000000.0
          general_audit_computation_id:
            type: "m2o"
            expected: "REC: computation"

      - step: "Switch base_amount_source to end_period"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          base_amount_source: "end_period"

      - step: "Assert base_computation_amount from home_amount"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 800000.0

      - step: "Enable other_amount_ok override"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          other_amount_ok: true
          other_amount_source: "Management estimate"
          other_base_amount: 500000.0

      - step: "Assert base_computation_amount overridden by other_base_amount"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 500000.0

  # ------------------------------------------------------------------
  # _compute_base - kosong (no computation_item_id, no override)
  # ------------------------------------------------------------------
  - name: "d9d2b44 - _compute_base (kosong)"
    steps:
      - step: "Create worksheet d9d2b44 without computation_item_id"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert base_computation_amount is zero without a computation item"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 0.0
          general_audit_computation_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # _compute_materiality - normal
  # ------------------------------------------------------------------
  - name: "d9d2b44 - _compute_materiality (normal)"
    steps:
      - step: "Create computation item"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - Materiality Normal"
          code: "/"

      - step: "Create general audit computation"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item.id"
          extrapolation_amount: 1000000.0

      - step: "Create worksheet d9d2b44"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Set base amount and materiality percentages"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          computation_item_id: "REC: comp_item.id"
          base_amount_source: "extrapolation"
          overall_materiality_percentage: 5.0
          performance_materiality_percentage: 50.0
          tolerable_misstatement_percentage: 10.0

      - step: "Assert OM/PM/TM computed per ISA 320 formula"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 1000000.0
          overall_materiality:
            type: "value"
            expected: 50000.0
          performance_materiality:
            type: "value"
            expected: 25000.0
          tolerable_misstatement:
            type: "value"
            expected: 2500.0

  # ------------------------------------------------------------------
  # _compute_materiality - nol (percentages left at default 0.0)
  # ------------------------------------------------------------------
  - name: "d9d2b44 - _compute_materiality (nol - percentase 0)"
    steps:
      - step: "Create computation item"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item - Materiality Zero Percentage"
          code: "/"

      - step: "Create general audit computation"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item.id"
          extrapolation_amount: 1000000.0

      - step: "Create worksheet d9d2b44"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Set base amount only, leave percentages at default 0.0"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          computation_item_id: "REC: comp_item.id"
          base_amount_source: "extrapolation"

      - step: "Assert OM/PM/TM are zero when percentages are zero"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 1000000.0
          overall_materiality:
            type: "value"
            expected: 0.0
          performance_materiality:
            type: "value"
            expected: 0.0
          tolerable_misstatement:
            type: "value"
            expected: 0.0

  # ------------------------------------------------------------------
  # _compute_materiality - nol (base 0, percentages normal)
  # ------------------------------------------------------------------
  - name: "d9d2b44 - _compute_materiality (nol - base 0)"
    steps:
      - step: "Create worksheet d9d2b44 without a computation item"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Set materiality percentages without a base amount"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          overall_materiality_percentage: 5.0
          performance_materiality_percentage: 50.0
          tolerable_misstatement_percentage: 10.0

      - step: "Assert OM/PM/TM are zero when base_computation_amount is zero"
        action: "assert"
        target: "worksheet"
        asserts:
          base_computation_amount:
            type: "value"
            expected: 0.0
          overall_materiality:
            type: "value"
            expected: 0.0
          performance_materiality:
            type: "value"
            expected: 0.0
          tolerable_misstatement:
            type: "value"
            expected: 0.0

  # ------------------------------------------------------------------
  # allowed_computation_item_ids - populated
  # ------------------------------------------------------------------
  - name: "d9d2b44 - allowed_computation_item_ids (populated)"
    steps:
      - step: "Create computation item A"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item_a"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item A - Allowed"
          code: "/"

      - step: "Create computation item B"
        action: "create"
        model: "trial_balance_computation_item"
        save_as: "comp_item_b"
        as_user: "base.user_admin"
        values:
          name: "Test Computation Item B - Allowed"
          code: "/"

      - step: "Create general audit computation A"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation_a"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item_a.id"
          extrapolation_amount: 100.0

      - step: "Create general audit computation B"
        action: "create"
        model: "general_audit.computation"
        save_as: "computation_b"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          computation_item_id: "REC: comp_item_b.id"
          extrapolation_amount: 200.0

      - step: "Create worksheet d9d2b44"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Assert allowed_computation_item_ids contains both computation items"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_computation_item_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: comp_item_a"
              - "REC: comp_item_b"

  # ------------------------------------------------------------------
  # allowed_computation_item_ids - kosong (no computation on the audit)
  # ------------------------------------------------------------------
  - name: "d9d2b44 - allowed_computation_item_ids (kosong)"
    steps:
      - step: "Create worksheet d9d2b44 on an audit without computations"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Assert allowed_computation_item_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_computation_item_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # Guard _10_check_balance_type - duplicate balance type on confirm
  # ------------------------------------------------------------------
  - name: "d9d2b44 - Guard _10_check_balance_type rejects duplicate balance type"
    steps:
      - step: "Create first worksheet d9d2b44 (extrapolation, default)"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet_1"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Create second worksheet d9d2b44 (same audit, same balance type)"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet_2"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Open second worksheet"
        action: "call"
        target: "worksheet_2"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening second worksheet"
        action: "call"
        target: "worksheet_2"
        method: "invalidate_cache"

      - step: "Confirming the second worksheet must be rejected"
        action: "call"
        target: "worksheet_2"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
          message_contains: "already used"

  # ------------------------------------------------------------------
  # Workflow - draft -> open -> confirm -> approve -> done
  # ------------------------------------------------------------------
  - name: "d9d2b44 - Workflow draft to done"
    steps:
      - step: "Create worksheet d9d2b44"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Assert initial state is draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion_d9d2b44.id"
          conclusion: "Materiality has been adequately determined."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # Workflow - cancel and restart
  # ------------------------------------------------------------------
  - name: "d9d2b44 - Cancel and restart"
    steps:
      - step: "Create worksheet d9d2b44"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          other_base_amount: 0.0

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"
