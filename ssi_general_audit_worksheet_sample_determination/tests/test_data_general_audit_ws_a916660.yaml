        as_user: "base.user_admin"

      - step: "Assert sampling_process_data lists the Candidate rows"
        action: "assert"
        target: "worksheet"
        asserts:
          sampling_process_data:
            type: "value"
            operator: "contains"
            expected: "REF003"

      - step: "Choose REF003 (1 chosen, within the cap of 1)"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          sampling_process_data: |
            Index,ref,amount,note,Type,Chose?
            0,REF001,1000,Note 1,Candidate,FALSE
            1,REF002,2000,Note 2,Candidate,FALSE
            2,REF003,3000,Note 3,Candidate,TRUE

