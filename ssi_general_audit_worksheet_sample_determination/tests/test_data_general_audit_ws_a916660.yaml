        as_user: "base.user_admin"

      - step: "Choose REF001 (unfiltered write, all 3 candidates visible)"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          sampling_process_data: |
            Index,ref,amount,note,Type,Chose?
            0,REF001,1000,Note 1,Candidate,TRUE
            1,REF002,2000,Note 2,Candidate,FALSE
            2,REF003,3000,Note 3,Candidate,FALSE

      - step: "Narrow the Sampling Process view to REF002 only"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          sampling_process_filter: "ref = 'REF002'"

      - step: "Assert the filtered view only lists REF002, not REF001/REF003"
        action: "assert"
        target: "worksheet"
        asserts:
          sampling_process_data:
            type: "value"
            operator: "contains"
            expected: "REF002"

      - step: "Choose REF002 too, via the filtered (REF002-only) write"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          sampling_process_data: |
            Index,ref,amount,note,Type,Chose?
            1,REF002,2000,Note 2,Candidate,TRUE

      - step:
          "Assert sampling_data kept REF001 Sample (chosen outside this filtered write)"
        action: "assert"
        target: "worksheet"
        asserts:
          sampling_data:
            type: "value"
            operator: "contains"
            expected: "REF001,1000,Note 1,Sample,TRUE"

      - step: "Assert sampling_data also promoted REF002 to Sample"
        action: "assert"
        target: "worksheet"
        asserts:
          sampling_data:
            type: "value"
            operator: "contains"
            expected: "REF002,2000,Note 2,Sample,TRUE"

