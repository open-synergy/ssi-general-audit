  # ------------------------------------------------------------------
  # 12b. Compute aria_coefficient / arir_coefficient / estimate_misstatement /
  #      standard_deviation_estimate / computed_sample_size (CVS method)
  #
  # PM 10000 x Risk Factor 0.9 = Tolerable Misstatement 9000 (set directly:
  # `onchange_tolerable_misstatement` is UI-only and not exercised by
  # `create`, matching the `action: form` limitation documented at the top
  # of this file -- it is covered separately as a Python escape hatch).
  # Estimate Misstatement = 9000 x 0.9 = 8100. Standard Deviation Estimate
  # = 8100 x 0.1 = 810. ARIA 0.5% -> coefficient 2.58, ARIR 1% -> 2.58.
  # Sample size = ROUNDUP(((810 x (2.58+2.58) x 4) / (10000-8100))^2) = 78,
  # verified against ``SD_akun_CVS_260821.ods`` cell ``Data!S14``.
  # ------------------------------------------------------------------
  - name: "Compute CVS sample size - full parameter chain"
    steps:
      - step: "Create CVS worksheet with performance materiality/risk/ARIA/ARIR"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"
          monetary_col_number: 2
          key_item_count: 0
          method_type: "cvs"
          performance_materiality: 10000.0
          risk_factor: 0.9
          tolerable_misstatement: 9000.0
          aria: "0.5"
          arir: "1"
          estimate_misstatement_ratio: 0.9
          standard_deviation_ratio: 0.1

      - step: "Assert CVS parameter chain and computed_sample_size"
        action: "assert"
        target: "worksheet"
        asserts:
          aria_coefficient:
            type: "value"
            expected: 2.58
          arir_coefficient:
            type: "value"
            expected: 2.58
          estimate_misstatement:
            type: "value"
            expected: 8100.0
          standard_deviation_estimate:
            type: "value"
            expected: 810.0
          computed_sample_size:
            type: "value"
            expected: 78

