  # ------------------------------------------------------------------
  - name: "Sampling Process - promoting a candidate to Sample within cap"
    steps:
      - step: "Create NSS worksheet, sample size capped at 1"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "worksheet"
        as_user: "base.user_admin"
