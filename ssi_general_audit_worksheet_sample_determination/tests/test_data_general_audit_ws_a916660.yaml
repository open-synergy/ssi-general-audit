  # HT/26/000687 (6th revision): a later write to a *filtered*
  # sampling_process_data (sampling_process_filter narrows it to one
  # row) must not lose an earlier choice made outside that filter --
  # edits merge into nss_candidate_pool by Index, untouched rows keep
  # their last saved state.
  - name: "Sampling Process - a filtered write keeps a previously chosen row"
    steps:
      - step: "Create NSS worksheet, sample size capped at 2"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "worksheet"
