setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - Test of Detail"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - Test of Detail"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-B4F8E1A-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - Test of Detail"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - Test of Detail"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - Test of Detail"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type b4f8e1a"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_test_of_detail.worksheet_type_b4f8e1a"
      save_as: "ws_type"

    - step: "Get worksheet type d209914 (General Ledger)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_client_package.worksheet_type_d209914"
      save_as: "ws_type_d209914"

    - step: "Get worksheet type a916660 (Sample Determination)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_sample_determination.worksheet_type_a916660"
      save_as: "ws_type_a916660"

    - step: "Get worksheet type b5e3d9f (Subledger)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_client_package.worksheet_type_b5e3d9f"
      save_as: "ws_type_b5e3d9f"

    - step: "Get worksheet type 6dcda0e (Specific Materiality)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.worksheet_type_6dcda0e"
      save_as: "ws_type_6dcda0e"

    - step: "Get worksheet type bb33b94 (Final Materiality)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_final_materiality.worksheet_type_bb33b94"
      save_as: "ws_type_bb33b94"

    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - B4F8E1A"
        code: "/"

    - step: "Create client account type"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - B4F8E1A"
        code: "/"
        group_id: "REC: account_group.id"
        # No general_audit.standard_detail is created against this
        # account type anywhere in this file, so the crashing default
        # ("result = document.balance") never actually gets evaluated
        # here. Set explicitly anyway, per the repo-wide rule of never
        # leaving client_account_type.python_code at its default.
        python_code: "result = 0.0"

scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_b4f8e1a - Create in draft
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Create in draft"
    steps:
      - step: "Assert general audit is open"
        action: "assert"
        target: "audit"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create worksheet b4f8e1a"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          name:
            type: "value"
            operator: "is_truthy"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"
          type_id:
            type: "m2o"
            expected: "REC: ws_type"

  # ------------------------------------------------------------------
  # general_audit_ws_b4f8e1a - Workflow open assigns sequence name
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Workflow open assigns sequence name"
    steps:
      - step: "Create worksheet b4f8e1a"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open with sequence assigned"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

  # ------------------------------------------------------------------
  # general_audit_ws_b4f8e1a - Workflow confirm to done
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Workflow confirm to done"
    steps:
      - step: "Create worksheet b4f8e1a"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Create conclusion for this worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "Test of detail results are appropriate"
          code: "/"
          type_id: "REC: ws_type.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Test of detail has been reviewed and is adequate."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # general_audit_ws_b4f8e1a - Confirm without conclusion fields is rejected
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Confirm without conclusion fields is rejected"
    steps:
      - step: "Create worksheet b4f8e1a"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Confirm without conclusion_id/conclusion must be rejected"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"

  # ------------------------------------------------------------------
  # general_audit_ws_b4f8e1a - Cancel and restart (from open)
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Cancel and restart"
    steps:
      - step: "Create worksheet b4f8e1a"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # standard_item_ids - inherited compute from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Compute standard_item_ids normal"
    steps:
      - step: "Create standard audit item"
        action: "create"
        model: "general_audit_standard_audit"
        save_as: "std_item"
        values:
          name: "ISA 530 - Audit Sampling"
          code: "/"

      - step: "Create worksheet type carrying the standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_with_item"
        values:
          name: "Ad-hoc Type With Standard Item"
          code: "/"
          model_name: "general_audit_ws_b4f8e1a"
          standard_item_ids:
            - - 6
              - 0
              - - "REC: std_item.id"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_with_item.id"

      - step: "Assert standard_item_ids contains the standard item"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: std_item"

  - name: "Worksheet b4f8e1a - Compute standard_item_ids kosong"
    steps:
      - step: "Create worksheet using the production type without any standard item"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert standard_item_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # allowed_conclusion_ids - inherited compute from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Compute allowed_conclusion_ids normal"
    steps:
      - step: "Create conclusion for the production worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        values:
          name: "Sample is representative of the population"
          code: "/"
          type_id: "REC: ws_type.id"

      - step: "Create worksheet using the production type"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert allowed_conclusion_ids contains the conclusion"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_conclusion_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: conclusion"

  - name: "Worksheet b4f8e1a - Compute allowed_conclusion_ids kosong"
    steps:
      - step: "Create worksheet type without any conclusion"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_no_conclusion"
        values:
          name: "Ad-hoc Type Without Conclusion"
          code: "/"
          model_name: "general_audit_ws_b4f8e1a"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_no_conclusion.id"

      - step: "Assert allowed_conclusion_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_conclusion_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # onchange_parent_type_id - inherited from general_audit_worksheet_mixin
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Onchange type_id sets parent_type_id"
    steps:
      # type_id is hard-readonly in the form view
      # (`<field name="type_id" readonly="1" force_save="1" />` in
      # ssi_general_audit/views/worksheet/general_audit_worksheet_mixin_views.xml),
      # so it can only ever take its default value on a new record -- it is
      # never user-editable. The onchange therefore only fires once, from
      # that default. Asserting directly on the live Form object trips a
      # library/Form interaction bug (`hasattr(form, "__len__")` raises
      # AssertionError instead of returning False), so save the form first
      # and assert on the resulting record instead.
      - step: "Open new worksheet form with default type_id"
        action: "form"
        model: "general_audit_ws_b4f8e1a"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit"
        save: true

      - step: "Assert default type_id propagated to parent_type_id via onchange"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_test_of_detail.worksheet_type_b4f8e1a"
          parent_type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_test_of_detail.worksheet_type_b4f8e1a"

  # ------------------------------------------------------------------
  # _compute_allowed_sample_determination_ids - normal
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Compute allowed_sample_determination_ids (normal)"
    steps:
      - step: "Create General Ledger worksheet to match on"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          title: "GL for allowed_sample_determination_ids"

      - step: "Create Sample Determination worksheet linked to that GL"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sd"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"

      - step: "Create worksheet b4f8e1a linked to the same GL"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"

      - step: "Assert allowed_sample_determination_ids contains the fixture"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_sample_determination_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: sd"

  # ------------------------------------------------------------------
  # _compute_allowed_sample_determination_ids - kosong
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - Compute allowed_sample_determination_ids (kosong)"
    steps:
      - step: "Create worksheet b4f8e1a without any SD fixture for this audit"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert allowed_sample_determination_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_sample_determination_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # sampling_data / population_count - propagated from linked SD
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - sampling_data / population_count propagation"
    steps:
      - step: "Create General Ledger worksheet with 5 population rows"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          raw_data: "Ref,Amount\nR1,1000\nR2,2000\nR3,3000\nR4,4000\nR5,5000\n"
          title: "GL for propagation"

      - step:
          "Create Sample Determination worksheet with sampling data and materiality/risk
          parameters"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sd"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"
          identifier_col_number: 1
          monetary_col_number: 2
          method_type: "cvs"
          performance_materiality: 500000000
          risk_factor: 0.65
          tolerable_misstatement: 325000000
          aria: "5"
          sampling_data:
            "Index,Ref,Amount,Type\n1,R1,1000,Key
            Item\n2,R2,2000,Sample\n3,R3,3000,Sample\n"

      - step: "Create worksheet b4f8e1a referencing the SD"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_source: "sample"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"
          sample_determination_id: "REC: sd.id"

      - step: "Assert sampling_data / population_count / sample_type came from the SD"
        action: "assert"
        target: "worksheet"
        asserts:
          sampling_data:
            type: "value"
            expected:
              "Index,Ref,Amount,Type\n1,R1,1000,Key
              Item\n2,R2,2000,Sample\n3,R3,3000,Sample\n"
          population_count:
            type: "value"
            expected: 5
          sample_type:
            type: "value"
            expected: "cvs"

      - step:
          "Assert materiality/risk parameters mirror the SD (same field values, not
          re-entered)"
        action: "assert"
        target: "worksheet"
        asserts:
          performance_materiality:
            type: "value"
            expected: 500000000.0
          risk_factor:
            type: "value"
            expected: 0.65
          tolerable_misstatement:
            type: "value"
            expected: 325000000.0
          aria:
            type: "value"
            expected: "5"
          # aria_coefficient not asserted here: it round-trips through a
          # plain (non-currency-rounded) Float, so its exact binary
          # representation isn't guaranteed portable across environments
          # (L-04) -- covered with tolerance in the Python precision-chain
          # test instead.

  # ------------------------------------------------------------------
  # action_generate_examination_data - normal
  # ------------------------------------------------------------------
  - name: "Worksheet b4f8e1a - action_generate_examination_data (normal)"
    steps:
      - step: "Create General Ledger worksheet with 5 population rows"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
