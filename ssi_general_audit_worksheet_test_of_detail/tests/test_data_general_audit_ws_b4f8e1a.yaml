  # changing Data Mode resets General Ledger and Sample Determination
  # ------------------------------------------------------------------
  - name:
      "Worksheet b4f8e1a - Onchange data_mode resets General Ledger and Sample
      Determination"
    steps:
      - step: "Create General Ledger worksheet to select initially"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          title: "GL for onchange data_mode"

      - step: "Create Sample Determination worksheet linked to that GL"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sd"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"

      - step:
          "Create worksheet b4f8e1a with Data Mode = GL, General Ledger and Sample
          Determination set"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_source: "sample"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"
          sample_determination_id: "REC: sd.id"

      - step: "Change Data Mode to Subledger via Form"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {data_mode: "subledger"}

      - step: "Assert general_ledger_id was reset by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          general_ledger_id:
            type: "value"
            operator: "is_falsy"

      - step: "Assert sample_determination_id was reset by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          sample_determination_id:
            type: "value"
            operator: "is_falsy"

