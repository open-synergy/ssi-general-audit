        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type.id"

      - step:
          "Create materiality mapping line for the standard detail, with the
          use_specific_materiality override switched on"
        action: "create"
        model: "general_audit_ws_6dcda0e_materiality_mapping"
        save_as: "mapping"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: materiality_ws.id"
          standard_detail_id: "REC: standard_detail.id"
          use_specific_materiality: true
          specific_materiality: 750000000

      - step: "Create worksheet b4f8e1a with Data Source = Population linked to the GL"
        action: "create"
        model: "general_audit_ws_b4f8e1a"
        save_as: "worksheet"
