scenarios:
  # ------------------------------------------------------------------
  # client_account_group
  # ------------------------------------------------------------------
  - name: "client_account_group - Create"
    steps:
      - step: "Create group"
        action: "create"
        model: "client_account_group"
        save_as: "group"
        values:
          name: "Test Account Group"
          code: "/"
      - step: "Assert created"
        action: "assert"
        target: "group"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Account Group"

  - name: "client_account_group - Edit"
    steps:
      - step: "Create group"
        action: "create"
        model: "client_account_group"
        save_as: "group"
        values:
          name: "Test Account Group"
          code: "/"
      - step: "Write new name"
        action: "write"
        target: "group"
        values:
          name: "Updated Account Group"
      - step: "Assert name updated"
        action: "assert"
        target: "group"
        asserts:
          name:
            type: "value"
            expected: "Updated Account Group"

  - name: "client_account_group - Delete"
    steps:
      - step: "Create group"
        action: "create"
        model: "client_account_group"
        save_as: "group"
        values:
          name: "Test Account Group To Delete"
          code: "/"
      - step: "Delete group"
        action: "call"
        target: "group"
        method: "unlink"
      - step: "Verify deleted"
        action: "search"
        model: "client_account_group"
        domain: [["name", "=", "Test Account Group To Delete"]]
        save_as: "result"
        expect_count: 0

