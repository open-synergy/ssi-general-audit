options:
  auto_refresh: true

scenarios:
  - name: "general_audit.detail - adjustment lines are linked after reload"
    steps:
      - step: "Get config parameter model"
        action: "search"
        model: "ir.config_parameter"
        domain: []
        save_as: "config_parameter"
        limit: 1

      - step: "Allow enough CPA licenses for this scenario"
        action: "call"
        target: "config_parameter"
        method: "set_param"
        args:
          - "ssi_general_audit.max_number_of_cpa_license"
          - "100"

      - step: "Create client partner"
        action: "create"
        model: "res.partner"
        save_as: "client"
        as_user: "base.user_admin"
        values:
          name: "Test Client - Adjustment Link"
          is_company: true

      - step: "Create accountant partner"
        action: "create"
        model: "res.partner"
        save_as: "accountant"
        as_user: "base.user_admin"
        values:
          name: "Test Accountant - Adjustment Link"

      - step: "Get CPA license id category"
        action: "ref"
        xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
        save_as: "cpa_category"

      - step: "Grant accountant a CPA license"
        action: "create"
        model: "res.partner.id_number"
        save_as: "cpa_license"
        as_user: "base.user_admin"
        values:
          partner_id: "REC: accountant.id"
          category_id: "REC: cpa_category.id"
          name: "CPA-ADJLINK-0001"

      - step: "Create account type set"
        action: "create"
        model: "client_account_type_set"
        save_as: "account_type_set"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type Set - Adjustment Link"
          code: "/"

      - step: "Create financial accounting standard"
        action: "create"
        model: "accountant.financial_accounting_standard"
        save_as: "standard"
        as_user: "base.user_admin"
        values:
          name: "Test Financial Accounting Standard - Adjustment Link"
          code: "/"

      - step: "Create general audit"
        action: "create"
        model: "general_audit"
        save_as: "audit"
        as_user: "base.user_admin"
        values:
          title: "Test General Audit - Adjustment Link"
          partner_id: "REC: client.id"
          accountant_id: "REC: accountant.id"
          account_type_set_id: "REC: account_type_set.id"
          financial_accounting_standard_id: "REC: standard.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          need_interim: false
          need_previous: false
          num_of_consecutive_audit_firm: 1
          num_of_consecutive_audit_accountant: 1

      - step: "Open general audit"
        action: "call"
        target: "audit"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "group"
        as_user: "base.user_admin"
        values:
          name: "Test Group - Adjustment Link"
          code: "/"
          sequence: 1
          normal_balance: "dr"

      - step: "Create client account type"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Cash - Adjustment Link"
          code: "/"
          group_id: "REC: group.id"
          sequence: 1
          normal_balance: "dr"

      - step: "Create client account"
        action: "create"
        model: "client_account"
        save_as: "account"
        as_user: "base.user_admin"
        values:
          name: "Kas Test - Adjustment Link"
          code: "KASADJLINK"
          partner_id: "REC: client.id"
          type_id: "REC: account_type.id"

      - step: "Create client account mapping"
        action: "create"
        model: "client_account_mapping"
        save_as: "mapping"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"

      - step: "Create mapping detail line"
        action: "create"
        model: "client_account_mapping.detail"
        save_as: "mapping_detail"
        as_user: "base.user_admin"
        values:
          mapping_id: "REC: mapping.id"
          account_id: "REC: account.id"
          type_id: "REC: account_type.id"

      - step: "Create proposed adjustment entry before any audit detail exists"
        action: "create"
        model: "client_adjustment_entry"
        save_as: "entry"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          adjustment_type: "propose"

      - step: "Create adjustment line for the account"
        action: "create"
        model: "client_adjustment_entry.detail"
        save_as: "adjustment_line"
        as_user: "base.user_admin"
        values:
          entry_id: "REC: entry.id"
          account_id: "REC: account.id"
          name: "Adjustment line before audit detail"
          debit: 100.0
          credit: 0.0

      - step: "Assert the line is unlinked while no audit detail exists"
        action: "assert"
        target: "adjustment_line"
        asserts:
          detail_id:
            type: "value"
            operator: "is_falsy"

      - step: "First reload: creates the audit detail"
        action: "call"
        target: "audit"
        method: "action_reload_account"
        as_user: "base.user_admin"

      - step: "Fetch the audit detail just created"
        action: "search"
        model: "general_audit.detail"
        domain: [["general_audit_id", "=", "REC: audit.id"]]
        save_as: "audit_detail"
        limit: 1

      - step: "Assert the line is linked to the new audit detail"
        action: "assert"
        target: "adjustment_line"
        asserts:
          detail_id:
            type: "m2o"
            expected: "REC: audit_detail"

      - step: "Second reload: deletes and recreates the audit detail"
        action: "call"
        target: "audit"
        method: "action_reload_account"
        as_user: "base.user_admin"

      - step: "Fetch the recreated audit detail"
        action: "search"
        model: "general_audit.detail"
        domain: [["general_audit_id", "=", "REC: audit.id"]]
        save_as: "audit_detail_2"
        limit: 1

      - step: "Assert the line is linked again to the recreated detail"
        action: "assert"
        target: "adjustment_line"
        asserts:
          detail_id:
            type: "m2o"
            expected: "REC: audit_detail_2"

      - step: "Assert draft entry does not count in the adjustment totals"
        action: "assert"
        target: "audit_detail_2"
        asserts:
          adjustment_dr:
            type: "value"
            expected: 0.0
          adjustment_cr:
            type: "value"
            expected: 0.0
