options:
  auto_refresh: true

scenarios:
  - name: "general_audit - _reload_account keeps dependent worksheets intact"
    steps:
      - step: "Get config parameter model"
        action: "search"
        model: "ir.config_parameter"
        domain: []
        save_as: "config_parameter"
        limit: 1

      - step: "Allow enough CPA licenses for this scenario"
        action: "call"
        target: "config_parameter"
        method: "set_param"
        args:
          - "ssi_general_audit.max_number_of_cpa_license"
          - "100"

      - step: "Create client partner"
        action: "create"
        model: "res.partner"
        save_as: "client"
        as_user: "base.user_admin"
        values:
          name: "Test Client - Reload Account"
          is_company: true

      - step: "Create accountant partner"
        action: "create"
        model: "res.partner"
        save_as: "accountant"
        as_user: "base.user_admin"
        values:
          name: "Test Accountant - Reload Account"

      - step: "Get CPA license id category"
        action: "ref"
        xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
        save_as: "cpa_category"

      - step: "Grant accountant a CPA license"
        action: "create"
        model: "res.partner.id_number"
        save_as: "cpa_license"
        as_user: "base.user_admin"
        values:
          partner_id: "REC: accountant.id"
          category_id: "REC: cpa_category.id"
          name: "CPA-RELOAD-0001"

      - step: "Create account type set"
        action: "create"
        model: "client_account_type_set"
        save_as: "account_type_set"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type Set - Reload"
          code: "/"

      - step: "Create financial accounting standard"
        action: "create"
        model: "accountant.financial_accounting_standard"
        save_as: "standard"
        as_user: "base.user_admin"
        values:
          name: "Test Financial Accounting Standard - Reload"
          code: "/"

      - step: "Create general audit"
        action: "create"
        model: "general_audit"
        save_as: "audit"
        as_user: "base.user_admin"
        values:
          title: "Test General Audit - Reload Account"
          partner_id: "REC: client.id"
          accountant_id: "REC: accountant.id"
          account_type_set_id: "REC: account_type_set.id"
          financial_accounting_standard_id: "REC: standard.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          need_interim: false
          need_previous: false
          num_of_consecutive_audit_firm: 1
          num_of_consecutive_audit_accountant: 1

      - step: "Open general audit"
        action: "call"
        target: "audit"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "group"
        as_user: "base.user_admin"
        values:
          name: "Test Group - Reload"
          code: "/"
          sequence: 1
          normal_balance: "dr"

      - step: "Create client account type"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Cash - Reload"
          code: "/"
          group_id: "REC: group.id"
          sequence: 1
          normal_balance: "dr"

      - step: "Create client account"
        action: "create"
        model: "client_account"
        save_as: "account"
        as_user: "base.user_admin"
        values:
          name: "Kas Test - Reload"
          code: "KASRELOAD"
          partner_id: "REC: client.id"
          type_id: "REC: account_type.id"

      - step: "Create client account mapping"
        action: "create"
        model: "client_account_mapping"
        save_as: "mapping"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"

      - step: "Create mapping detail line"
        action: "create"
        model: "client_account_mapping.detail"
        save_as: "mapping_detail"
        as_user: "base.user_admin"
        values:
          mapping_id: "REC: mapping.id"
          account_id: "REC: account.id"
          type_id: "REC: account_type.id"

      - step: "First reload: populate general_audit.detail"
        action: "call"
        target: "audit"
        method: "action_reload_account"
        as_user: "base.user_admin"

      - step: "Assert one detail line created"
        action: "assert"
        target: "audit"
        asserts:
          detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Fetch the general_audit.detail line just created"
        action: "search"
        model: "general_audit.detail"
        domain: [["general_audit_id", "=", "REC: audit.id"]]
        save_as: "audit_detail"
        limit: 1

      - step: "Create Lead Schedule - Account worksheet"
        action: "create"
        model: "general_audit_ws_f9f3299"
        save_as: "lead_schedule"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          account_type_id: "REC: account_type.id"

      - step: "Create Lead Schedule detail line referencing the audit detail"
        action: "create"
        model: "general_audit_ws_f9f3299.detail"
        save_as: "lead_schedule_detail"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: lead_schedule.id"
          detail_id: "REC: audit_detail.id"
          account_id: "REC: account.id"

      - step: "Second reload must not fail on the FK from the Lead Schedule detail"
        action: "call"
        target: "audit"
        method: "action_reload_account"
        as_user: "base.user_admin"

      - step: "Assert general_audit.detail still has exactly one line"
        action: "assert"
        target: "audit"
        asserts:
          detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Assert Lead Schedule's own detail was regenerated, not left dangling"
        action: "assert"
        target: "lead_schedule"
        asserts:
          detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
