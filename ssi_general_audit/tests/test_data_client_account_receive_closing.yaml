options:
  auto_refresh: true

scenarios:
  - name: "Only one account per client and type can receive closing"
    steps:
      - step: "Create client one"
        action: "create"
        model: "res.partner"
        save_as: "client"
        values:
          name: "Test Client - Receive Closing"
          is_company: true

      - step: "Create client two"
        action: "create"
        model: "res.partner"
        save_as: "other_client"
        values:
          name: "Test Client - Receive Closing Other"
          is_company: true

      - step: "Create account group"
        action: "create"
        model: "client_account_group"
        save_as: "group"
        as_user: "base.user_admin"
        values:
          name: "Test Group - Receive Closing"
          code: "/"
          sequence: 1
          normal_balance: "cr"

      - step: "Create destination type one"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Retained - Receive Closing"
          code: "/"
          group_id: "REC: group.id"
          sequence: 1
          normal_balance: "cr"

      - step: "Create destination type two, same group"
        action: "create"
        model: "client_account_type"
        save_as: "account_type_two"
        as_user: "base.user_admin"
        values:
          name: "Retained Two - Receive Closing"
          code: "/"
          group_id: "REC: group.id"
          sequence: 2
          normal_balance: "cr"

      - step: "Create source type"
        action: "create"
        model: "client_account_type"
        save_as: "source_type"
        as_user: "base.user_admin"
        values:
          name: "Source - Receive Closing"
          code: "/"
          group_id: "REC: group.id"
          sequence: 3
          normal_balance: "cr"

      - step: "Create type that is not a closing destination"
        action: "create"
        model: "client_account_type"
        save_as: "plain_type"
        as_user: "base.user_admin"
        values:
          name: "Plain - Receive Closing"
          code: "/"
          group_id: "REC: group.id"
          sequence: 4
          normal_balance: "cr"

      - step: "Create closing type with two destinations"
        action: "create"
        model: "general_audit_closing_type"
        save_as: "closing_type"
        as_user: "base.user_admin"
        values:
          name: "Closing Type - Receive Closing"
          code: "/"
          mapping_ids:
            - - 0
              - 0
              - name: "Close to one"
                sequence: 10
                source_type_ids:
                  - - 6
                    - 0
                    - - "REC: source_type.id"
                account_type_id: "REC: account_type.id"
            - - 0
              - 0
              - name: "Close to two"
                sequence: 20
                source_type_ids:
                  - - 6
                    - 0
                    - - "REC: source_type.id"
                account_type_id: "REC: account_type_two.id"

      - step: "Create first account, ticked"
        action: "create"
        model: "client_account"
        save_as: "account_a"
        as_user: "base.user_admin"
        values:
          name: "Account A"
          code: "RC.A"
          partner_id: "REC: client.id"
          type_id: "REC: account_type.id"
          receive_closing: true

      - step: "Create second account, not ticked"
        action: "create"
        model: "client_account"
        save_as: "account_b"
        as_user: "base.user_admin"
        values:
          name: "Account B"
          code: "RC.B"
          partner_id: "REC: client.id"
          type_id: "REC: account_type_two.id"

      - step: "Same group of another client may be ticked"
        action: "create"
        model: "client_account"
        save_as: "account_c"
        as_user: "base.user_admin"
        values:
          name: "Account C"
          code: "RC.C"
          partner_id: "REC: other_client.id"
          type_id: "REC: account_type.id"
          receive_closing: true

      - step: "Ticking a second account of the same client and group is refused"
        action: "write"
        target: "account_b"
        as_user: "base.user_admin"
        values:
          receive_closing: true
        expect_error:
          type: "UserError"
          message_contains: "same client and group"

      - step: "Untick the first account"
        action: "write"
        target: "account_a"
        as_user: "base.user_admin"
        values:
          receive_closing: false

      - step: "Now the second account can be ticked"
        action: "write"
        target: "account_b"
        as_user: "base.user_admin"
        values:
          receive_closing: true

      - step: "Create account of a type that is not a closing destination"
        action: "create"
        model: "client_account"
        save_as: "account_plain"
        as_user: "base.user_admin"
        values:
          name: "Account Plain"
          code: "RC.P"
          partner_id: "REC: client.id"
          type_id: "REC: plain_type.id"

      - step: "Ticking an account whose type receives no closing is refused"
        action: "write"
        target: "account_plain"
        as_user: "base.user_admin"
        values:
          receive_closing: true
        expect_error:
          type: "UserError"
          message_contains: "not the destination"

      - step: "Second account is ticked"
        action: "assert"
        target: "account_b"
        asserts:
          receive_closing:
            type: "value"
            expected: true
