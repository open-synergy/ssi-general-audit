options:
  auto_refresh: true

scenarios:
  - name: "client_adjustment_entry.corrected - only corrected entries are counted"
    steps:
      - step: "Get config parameter model"
        action: "search"
        model: "ir.config_parameter"
        domain: []
        save_as: "config_parameter"
        limit: 1

      - step: "Allow enough CPA licenses for this scenario"
        action: "call"
        target: "config_parameter"
        method: "set_param"
        args:
          - "ssi_general_audit.max_number_of_cpa_license"
          - "100"

      - step: "Create client partner"
        action: "create"
        model: "res.partner"
        save_as: "client"
        as_user: "base.user_admin"
        values:
          name: "Test Client - Corrected Adjustment"
          is_company: true

      - step: "Create accountant partner"
        action: "create"
        model: "res.partner"
        save_as: "accountant"
        as_user: "base.user_admin"
        values:
          name: "Test Accountant - Corrected Adjustment"

      - step: "Get CPA license id category"
        action: "ref"
        xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
        save_as: "cpa_category"

      - step: "Grant accountant a CPA license"
        action: "create"
        model: "res.partner.id_number"
        save_as: "cpa_license"
        as_user: "base.user_admin"
        values:
          partner_id: "REC: accountant.id"
          category_id: "REC: cpa_category.id"
          name: "CPA-CORRECTED-0001"

      - step: "Create account type set"
        action: "create"
        model: "client_account_type_set"
        save_as: "account_type_set"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type Set - Corrected Adjustment"
          code: "/"

      - step: "Create financial accounting standard"
        action: "create"
        model: "accountant.financial_accounting_standard"
        save_as: "standard"
        as_user: "base.user_admin"
        values:
          name: "Test Financial Accounting Standard - Corrected Adjustment"
          code: "/"

      - step: "Create general audit"
        action: "create"
        model: "general_audit"
        save_as: "audit"
        as_user: "base.user_admin"
        values:
          title: "Test General Audit - Corrected Adjustment"
          partner_id: "REC: client.id"
          accountant_id: "REC: accountant.id"
          account_type_set_id: "REC: account_type_set.id"
          financial_accounting_standard_id: "REC: standard.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          need_interim: false
          need_previous: false
          num_of_consecutive_audit_firm: 1
          num_of_consecutive_audit_accountant: 1

      - step: "Open general audit"
        action: "call"
        target: "audit"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "group"
        as_user: "base.user_admin"
        values:
          name: "Test Group - Corrected Adjustment"
          code: "/"
          sequence: 1
          normal_balance: "dr"

      - step: "Create client account type"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Cash - Corrected Adjustment"
          code: "/"
          group_id: "REC: group.id"
          sequence: 1
          normal_balance: "dr"

      - step: "Create first client account"
        action: "create"
        model: "client_account"
        save_as: "account_1"
        as_user: "base.user_admin"
        values:
          name: "Kas Test 1 - Corrected Adjustment"
          code: "KASCORR1"
          partner_id: "REC: client.id"
          type_id: "REC: account_type.id"

      - step: "Create second client account"
        action: "create"
        model: "client_account"
        save_as: "account_2"
        as_user: "base.user_admin"
        values:
          name: "Kas Test 2 - Corrected Adjustment"
          code: "KASCORR2"
          partner_id: "REC: client.id"
          type_id: "REC: account_type.id"

      - step: "Create client account mapping"
        action: "create"
        model: "client_account_mapping"
        save_as: "mapping"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"

      - step: "Create mapping detail line for the first account"
        action: "create"
        model: "client_account_mapping.detail"
        save_as: "mapping_detail_1"
        as_user: "base.user_admin"
        values:
          mapping_id: "REC: mapping.id"
          account_id: "REC: account_1.id"
          type_id: "REC: account_type.id"

      - step: "Create mapping detail line for the second account"
        action: "create"
        model: "client_account_mapping.detail"
        save_as: "mapping_detail_2"
        as_user: "base.user_admin"
        values:
          mapping_id: "REC: mapping.id"
          account_id: "REC: account_2.id"
          type_id: "REC: account_type.id"

      - step: "Reload accounts to create the audit details"
        action: "call"
        target: "audit"
        method: "action_reload_account"
        as_user: "base.user_admin"

      - step: "Fetch the audit detail of the first account"
        action: "search"
        model: "general_audit.detail"
        domain:
          - ["general_audit_id", "=", "REC: audit.id"]
          - ["account_id", "=", "REC: account_1.id"]
        save_as: "audit_detail_1"
        limit: 1

      - step: "Create corrected entry leaving corrected at its default"
        action: "create"
        model: "client_adjustment_entry"
        save_as: "entry_corrected"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          adjustment_type: "propose"

      - step: "Assert corrected defaults to true"
        action: "assert"
        target: "entry_corrected"
        asserts:
          corrected:
            type: "value"
            expected: true

      - step: "Create debit line of the corrected entry"
        action: "create"
        model: "client_adjustment_entry.detail"
        save_as: "line_corrected_dr"
        as_user: "base.user_admin"
        values:
          entry_id: "REC: entry_corrected.id"
          account_id: "REC: account_1.id"
          name: "Corrected debit"
          debit: 100.0
          credit: 0.0

      - step: "Create credit line of the corrected entry"
        action: "create"
        model: "client_adjustment_entry.detail"
        save_as: "line_corrected_cr"
        as_user: "base.user_admin"
        values:
          entry_id: "REC: entry_corrected.id"
          account_id: "REC: account_2.id"
          name: "Corrected credit"
          debit: 0.0
          credit: 100.0

      - step: "Create uncorrected entry"
        action: "create"
        model: "client_adjustment_entry"
        save_as: "entry_uncorrected"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          adjustment_type: "propose"
          corrected: false

      - step: "Create debit line of the uncorrected entry"
        action: "create"
        model: "client_adjustment_entry.detail"
        save_as: "line_uncorrected_dr"
        as_user: "base.user_admin"
        values:
          entry_id: "REC: entry_uncorrected.id"
          account_id: "REC: account_1.id"
          name: "Uncorrected debit"
          debit: 40.0
          credit: 0.0

      - step: "Create credit line of the uncorrected entry"
        action: "create"
        model: "client_adjustment_entry.detail"
        save_as: "line_uncorrected_cr"
        as_user: "base.user_admin"
        values:
          entry_id: "REC: entry_uncorrected.id"
          account_id: "REC: account_2.id"
          name: "Uncorrected credit"
          debit: 0.0
          credit: 40.0

      - step: "Mark the corrected entry as done"
        action: "write"
        target: "entry_corrected"
        as_user: "base.user_admin"
        values:
          state: "done"

      - step: "Mark the uncorrected entry as done"
        action: "write"
        target: "entry_uncorrected"
        as_user: "base.user_admin"
        values:
          state: "done"

      - step: "Assert the audit detail counts only the corrected entry"
        action: "assert"
        target: "audit_detail_1"
        asserts:
          adjustment_dr:
            type: "value"
            expected: 100.0
          adjustment_cr:
            type: "value"
            expected: 0.0

      - step: "Assert the stored account adjustment counts only the corrected entry"
        action: "assert"
        target: "audit_detail_1"
        asserts:
          adjustment_debit:
            type: "value"
            expected: 100.0
          adjustment_credit:
            type: "value"
            expected: 0.0

      - step: "Assert the audit detail links only the corrected entry"
        action: "assert"
        target: "audit_detail_1"
        asserts:
          adjustment_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: entry_corrected"

      - step: "Search the adjustment summary view of the audit"
        action: "search"
        model: "general_audit.account_adjustment"
        domain:
          - ["general_audit_id", "=", "REC: audit.id"]
          - ["account_id", "=", "REC: account_1.id"]
        save_as: "account_adjustment"
        limit: 1

      - step: "Assert the account adjustment view excludes the uncorrected entry"
        action: "assert"
        target: "account_adjustment"
        asserts:
          debit:
            type: "value"
            expected: 100.0
