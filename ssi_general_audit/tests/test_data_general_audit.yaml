            type: "value"
            expected: "open"

      - step: "Cancel general audit"
        action: "call"
        target: "audit"
        method: "action_cancel"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart general audit"
        action: "call"
        target: "audit"
        method: "action_restart"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "draft"
