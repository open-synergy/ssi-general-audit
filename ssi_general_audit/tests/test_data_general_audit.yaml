        save_as: "worksheet"
        values:
          general_audit_id: "EVAL: registry['audit'].id"
          type_id: "EVAL: registry['type'].id"

      - step: "Assert standard_item_ids mirrors the worksheet type"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "contains"
            expected_records: "EVAL: [registry['std_item'].id]"

