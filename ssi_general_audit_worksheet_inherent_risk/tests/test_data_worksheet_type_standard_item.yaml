scenarios:
  # ------------------------------------------------------------------
  # Installed data - worksheet_type_bfb6dae.standard_item_ids
  # ------------------------------------------------------------------
  - name: "Worksheet type BFB6DAE (Inherent Risk) - standard_item_ids installed data"
    steps:
      - step: "Get worksheet type BFB6DAE"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_inherent_risk.worksheet_type_bfb6dae"
        save_as: "type_bfb6dae"

      - step: "Assert standard_item_ids is exactly ISA 240, ISA 315"
        action: "assert"
        target: "type_bfb6dae"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_5_0f238e08"
              - "ssi_general_audit.general_audit_standard_audit_11_81c669bd"

      - step:
          "Verify unrelated audit standards (ISA 200, ISA 210) are not linked to BFB6DAE"
        action: "search"
        model: "general_audit_worksheet_type"
        domain:
          [
            ["id", "=", "REC: type_bfb6dae.id"],
            ["standard_item_ids.code", "in", ["ISA 200", "ISA 210"]],
          ]
        save_as: "unrelated_standard_link_bfb6dae"
        expect_count: 0

