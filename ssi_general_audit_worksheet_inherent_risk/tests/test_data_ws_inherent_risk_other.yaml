        values:
          name: "Test Checklist Item Custom - IR Other"
          code: "IR-OTHER-ITEM-01"
          sequence: 25
          option_set_id: "REC: option_set.id"

      - step: "Assert custom code and sequence"
        action: "assert"
        target: "item"
        asserts:
          code:
            type: "value"
            expected: "IR-OTHER-ITEM-01"
          sequence:
            type: "value"
            expected: 25

      - step: "Write new sequence"
        action: "write"
        target: "item"
        as_user: "base.user_admin"
        values:
          sequence: 35

      - step: "Assert sequence updated"
        action: "assert"
        target: "item"
        asserts:
          sequence:
            type: "value"
            expected: 35

      - step: "Delete checklist item"
        action: "unlink"
        target: "item"
        as_user: "base.user_admin"

      - step: "Verify checklist item deleted"
        action: "search"
        model: "general_audit_ws_bfb6dae.item"
        domain:
          - ["id", "=", "REC: item.id"]
        save_as: "result"
        expect_count: 0

  # ------------------------------------------------------------------
  # bfb6dae - Create and populate checklist from master items
  # ------------------------------------------------------------------
  - name: "Worksheet bfb6dae - Create and populate checklist"
    steps:
      - step: "Count master checklist items currently available"
        action: "search"
        model: "general_audit_ws_bfb6dae.item"
        domain: []
        save_as: "master_items"

      - step: "Create worksheet bfb6dae"
        action: "create"
        model: "general_audit_ws_bfb6dae"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bfb6dae.id"

      - step: "Assert checklist_ids empty right after create"
        action: "assert"
        target: "worksheet"
        asserts:
          checklist_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

      - step: "Populate checklist from master items"
        action: "call"
        target: "worksheet"
        method: "action_populate_checklist"
        as_user: "base.user_admin"

      - step: "Assert checklist_ids count matches master item count"
        action: "assert"
        target: "worksheet"
        refresh: true
        asserts:
          checklist_ids:
            type: "o2m"
            check: "count"
            expected_count: "EVAL: len(registry['master_items'])"

      - step: "Populate checklist a second time (idempotent)"
        action: "call"
        target: "worksheet"
        method: "action_populate_checklist"
        as_user: "base.user_admin"

      - step: "Assert checklist_ids count is unchanged (no duplicates)"
        action: "assert"
        target: "worksheet"
        refresh: true
        asserts:
          checklist_ids:
            type: "o2m"
            check: "count"
            expected_count: "EVAL: len(registry['master_items'])"

  # ------------------------------------------------------------------
  # bfb6dae - Workflow draft to done
  # ------------------------------------------------------------------
  - name: "Worksheet bfb6dae - Workflow confirm to done"
    steps:
      - step: "Create worksheet bfb6dae"
        action: "create"
        model: "general_audit_ws_bfb6dae"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bfb6dae.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Populate checklist"
        action: "call"
        target: "worksheet"
        method: "action_populate_checklist"
        as_user: "base.user_admin"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion_bfb6dae.id"
          conclusion: "Inherent risk checklist reviewed and adequately answered."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # bfb6dae - Cancel and restart
