  # ------------------------------------------------------------------
  # onchange type_id -> parent_type_id (general_audit_worksheet_mixin.onchange_parent_type_id)
  # ------------------------------------------------------------------
  - name: "a418d89 - Onchange type_id sets parent_type_id"
    steps:
      # type_id is hard-readonly (readonly="1" force_save="1") in the shared
      # worksheet mixin form view and only ever takes its default value on a
      # new record, so the onchange only fires once from that default. It
      # cannot be re-assigned via Form.set() since the view marks it readonly
      # regardless of state. Save the form and assert on the resulting record,
      # matching the proven pattern already used by
      # ssi_general_audit_worksheet_final_materiality / _draft_reporting.
      - step: "Open new worksheet form with default type_id"
        action: "form"
        model: "general_audit_ws_a418d89"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit"
        save: true

      - step: "Assert default type_id propagated to parent_type_id via onchange"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_inherent_risk.worksheet_type_a418d89"
          parent_type_id:
            type: "m2o"
            expected_xml_id: "ssi_general_audit_worksheet_inherent_risk.worksheet_type_a418d89"
