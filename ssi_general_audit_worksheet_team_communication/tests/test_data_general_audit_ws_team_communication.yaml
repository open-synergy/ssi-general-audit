  # general_audit_ws_437fc8f - Create and workflow draft to done
  # ------------------------------------------------------------------
  - name: "WS 437fc8f - Create and workflow draft to done"
    steps:
      - step: "Create worksheet 437fc8f"
        action: "create"
        model: "general_audit_ws_437fc8f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_437fc8f.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          name:
            type: "value"
            operator: "is_truthy"

      - step: "Open worksheet"
