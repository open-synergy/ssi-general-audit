      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # general_audit_ws_437fc8f - action_populate_checklist
  #
  # Uses scoped-domain assertions (worksheet_id + specific item_id), NOT
  # total counts: this module ships production seed data
  # (data/master/general_audit_ws_437fc8f_item.xml, 8 records) that
  # action_populate_checklist's unfiltered Item.search([...]) also picks
  # up, so a total row-count assertion (e.g. "= number of items created
  # here") would be fragile / coupled to that seed data.
  # ------------------------------------------------------------------
  - name: "WS 437fc8f - action_populate_checklist"
    steps:
      - step: "Create option set for the custom items"
        action: "create"
        model: "checklist.option_set"
        save_as: "option_set"
        as_user: "base.user_admin"
        values:
          name: "Test Option Set - 437fc8f Populate"
          code: "/"

      - step: "Create custom checklist item 1"
        action: "create"
        model: "general_audit_ws_437fc8f.item"
        save_as: "item_1"
        as_user: "base.user_admin"
        values:
          name: "Custom checklist item 1 - 437fc8f Populate"
          communication_type: "understanding"
          option_set_id: "REC: option_set.id"

      - step: "Create custom checklist item 2"
        action: "create"
        model: "general_audit_ws_437fc8f.item"
        save_as: "item_2"
        as_user: "base.user_admin"
