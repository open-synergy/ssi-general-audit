          name: "Custom checklist item 2 - 437fc8f Populate"
          communication_type: "consultation"
          option_set_id: "REC: option_set.id"

      - step: "Create worksheet 437fc8f"
        action: "create"
        model: "general_audit_ws_437fc8f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_437fc8f.id"

      - step: "Verify no checklist line for item 1 before populate"
        action: "search"
        model: "general_audit_ws_437fc8f.checklist"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["item_id", "=", "REC: item_1.id"]
        save_as: "checklist_1_before"
        expect_count: 0

      - step: "Verify no checklist line for item 2 before populate"
        action: "search"
        model: "general_audit_ws_437fc8f.checklist"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["item_id", "=", "REC: item_2.id"]
        save_as: "checklist_2_before"
        expect_count: 0

      - step: "Call action_populate_checklist the first time"
        action: "call"
        target: "worksheet"
        method: "action_populate_checklist"
        as_user: "base.user_admin"

      - step: "Verify checklist line for item 1 was populated"
        action: "search"
        model: "general_audit_ws_437fc8f.checklist"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["item_id", "=", "REC: item_1.id"]
        save_as: "checklist_1_after"
        expect_count: 1

      - step: "Verify checklist line for item 2 was populated"
        action: "search"
        model: "general_audit_ws_437fc8f.checklist"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["item_id", "=", "REC: item_2.id"]
        save_as: "checklist_2_after"
        expect_count: 1

      - step: "Call action_populate_checklist a second time"
        action: "call"
        target: "worksheet"
        method: "action_populate_checklist"
        as_user: "base.user_admin"

      - step: "Verify checklist line for item 1 was not duplicated"
        action: "search"
        model: "general_audit_ws_437fc8f.checklist"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["item_id", "=", "REC: item_1.id"]
        save_as: "checklist_1_idempotent"
        expect_count: 1

      - step: "Verify checklist line for item 2 was not duplicated"
        action: "search"
        model: "general_audit_ws_437fc8f.checklist"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["item_id", "=", "REC: item_2.id"]
        save_as: "checklist_2_idempotent"
        expect_count: 1

