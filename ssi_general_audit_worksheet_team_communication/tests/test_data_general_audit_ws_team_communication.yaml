setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - Team Communication"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - Team Communication"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-TEAMCOMM-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - Team Communication"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - Team Communication"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - Team Communication"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type 437fc8f"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_team_communication.worksheet_type_437fc8f"
      save_as: "ws_type_437fc8f"

    - step: "Get worksheet type b1f820c"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_team_communication.worksheet_type_b1f820c"
      save_as: "ws_type_b1f820c"

    - step: "Get seeded conclusion for 437fc8f (adequate)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_team_communication.general_audit_worksheet_conclusion_24_b40739f5"
      save_as: "conclusion_437fc8f"

    - step: "Get seeded conclusion for b1f820c (adequate)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_team_communication.general_audit_worksheet_conclusion_120_e9bc0d9f"
      save_as: "conclusion_b1f820c"

scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_437fc8f.item - CRUD
  # ------------------------------------------------------------------
  - name: "Item 437fc8f - Create, write, delete"
    steps:
      - step: "Create option set for the item"
        action: "create"
        model: "checklist.option_set"
        save_as: "option_set"
        as_user: "base.user_admin"
        values:
          name: "Yes/No - Team Communication 437fc8f Item CRUD"
          code: "/"

      - step: "Create checklist item"
        action: "create"
        model: "general_audit_ws_437fc8f.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Test Checklist Item - 437fc8f CRUD"
          communication_type: "understanding"
          option_set_id: "REC: option_set.id"

      - step: "Assert item created"
        action: "assert"
        target: "item"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Checklist Item - 437fc8f CRUD"

      - step: "Write new name"
        action: "write"
        target: "item"
        as_user: "base.user_admin"
        values:
          name: "Updated Checklist Item - 437fc8f CRUD"

      - step: "Assert name updated"
        action: "assert"
        target: "item"
        asserts:
          name:
            type: "value"
            expected: "Updated Checklist Item - 437fc8f CRUD"

      - step: "Delete item"
        action: "unlink"
        target: "item"
        as_user: "base.user_admin"

      - step: "Verify item deleted"
        action: "search"
        model: "general_audit_ws_437fc8f.item"
        domain:
          - ["id", "=", "REC: item.id"]
        save_as: "result"
        expect_count: 0

