  # ------------------------------------------------------------------
  # standard_item_ids - inherited compute from general_audit_worksheet_mixin
  #
  # Behaviour is identical for both worksheet models in this module (the
  # compute lives on the abstract mixin, is not overridden by either
  # concrete model); tested once against general_audit_ws_437fc8f.
  # ------------------------------------------------------------------
  - name: "WS 437fc8f - Compute standard_item_ids normal"
    steps:
      - step: "Create standard audit item"
        action: "create"
        model: "general_audit_standard_audit"
        save_as: "std_item"
        as_user: "base.user_admin"
        values:
          name: "ISA 315 - Team Discussion"
          code: "/"

      - step: "Create worksheet type carrying the standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_with_item"
        as_user: "base.user_admin"
        values:
          name: "Ad-hoc Type With Standard Item - Team Communication"
          code: "/"
          model_name: "general_audit_ws_437fc8f"
          standard_item_ids:
            - - 6
              - 0
              - - "REC: std_item.id"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_437fc8f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_with_item.id"

      - step: "Assert standard_item_ids contains the standard item"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: std_item"

  - name: "WS 437fc8f - Compute standard_item_ids kosong"
    steps:
      - step: "Create worksheet type without any standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_no_item"
        as_user: "base.user_admin"
        values:
          name: "Ad-hoc Type Without Standard Item - Team Communication"
          code: "/"
          model_name: "general_audit_ws_437fc8f"

      - step: "Create worksheet using that type"
        action: "create"
        model: "general_audit_ws_437fc8f"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_no_item.id"

      - step: "Assert standard_item_ids is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

