scenarios:
  # ------------------------------------------------------------------
  # Installed data - worksheet_type_ab19fd4.standard_item_ids
  # ------------------------------------------------------------------
  - name:
      "Worksheet type AB19FD4 (Audit Result Formulation) - standard_item_ids installed
      data"
    steps:
      - step: "Get worksheet type AB19FD4"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_audit_result.worksheet_type_ab19fd4"
        save_as: "type_ab19fd4"

      - step: "Assert standard_item_ids is exactly ISA 700, ISA 705, ISA 706"
        action: "assert"
        target: "type_ab19fd4"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_30_baa66728"
              - "ssi_general_audit.general_audit_standard_audit_32_7a114bca"
              - "ssi_general_audit.general_audit_standard_audit_33_e41f3db4"

      - step:
          "Verify unrelated audit standards (ISA 315, ISA 240) are not linked to AB19FD4"
        action: "search"
        model: "general_audit_worksheet_type"
        domain:
          [
            ["id", "=", "REC: type_ab19fd4.id"],
            ["standard_item_ids.code", "in", ["ISA 315", "ISA 240"]],
          ]
        save_as: "unrelated_standard_link_ab19fd4"
        expect_count: 0

