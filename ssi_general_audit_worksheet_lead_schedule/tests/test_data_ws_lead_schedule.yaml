  # ==================================================================
  # allowed_employee_ids - e51bb1c only
  # ==================================================================
  - name: "e51bb1c - Compute allowed_employee_ids (normal)"
    steps:
      # general_audit_ws_b9d8a5c belongs to
      # ssi_general_audit_worksheet_acceptance_continuance, which is NOT a
      # declared dependency of ssi_general_audit_worksheet_lead_schedule.
      # This repo's CI installs and tests all of its modules together in one
      # process/database (see ssi_general_audit/tests/README_FIXTURE.md), so
      # the model and its xml_id are present at test time even though the
      # production _compute_allowed_employee_ids code
      # (general_audit_ws_e51bb1c.py) reaches for
      # self.env["general_audit_ws_b9d8a5c"] unconditionally -- an implicit,
      # undeclared soft dependency worth flagging separately.
      - step: "Get worksheet type b9d8a5c"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_acceptance_continuance.worksheet_type_b9d8a5c"
        save_as: "ws_type_b9d8a5c"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Test Team Member - Lead Schedule"

      - step: "Create worksheet b9d8a5c (team roster fixture)"
        action: "create"
        model: "general_audit_ws_b9d8a5c"
        save_as: "ws_b9d8a5c"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_b9d8a5c.id"

      - step: "Select the employee as part of the team"
        action: "create"
        model: "general_audit_ws_b9d8a5c.summary"
        save_as: "summary"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: ws_b9d8a5c.id"
          employee_id: "REC: employee.id"
          select_team: "yes"

      - step: "Create worksheet e51bb1c"
        action: "create"
        model: "general_audit_ws_e51bb1c"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_e51bb1c.id"

      - step: "Assert allowed_employee_ids contains the selected team member"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_employee_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: employee"

  - name: "e51bb1c - Compute allowed_employee_ids (kosong)"
