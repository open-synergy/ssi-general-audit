          debit: 1200000.0

      - step: "Home trial balance line for account B (credit 1,000,000)"
        action: "create"
        model: "client_trial_balance.detail"
        save_as: "tb_home_detail_b"
        as_user: "base.user_admin"
        values:
          trial_balance_id: "REC: tb_home.id"
          account_id: "REC: account_b.id"
          credit: 1000000.0

      - step: "Create interim trial balance"
        action: "create"
        model: "client_trial_balance"
        save_as: "tb_interim"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          trial_balance_type: "interim"

      - step: "Interim trial balance line for account A (debit 900,000)"
        action: "create"
        model: "client_trial_balance.detail"
        save_as: "tb_interim_detail_a"
        as_user: "base.user_admin"
        values:
          trial_balance_id: "REC: tb_interim.id"
          account_id: "REC: account_a.id"
          debit: 900000.0

      - step: "Create previous trial balance"
        action: "create"
        model: "client_trial_balance"
        save_as: "tb_previous"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          trial_balance_type: "previous"

      - step:
          "Previous trial balance line for account A only (debit 800,000) - account B
          intentionally has no previous line, so its previous_balance stays 0.0"
        action: "create"
        model: "client_trial_balance.detail"
        save_as: "tb_previous_detail_a"
        as_user: "base.user_admin"
        values:
          trial_balance_id: "REC: tb_previous.id"
          account_id: "REC: account_a.id"
          debit: 800000.0

      - step: "Create worksheet f9f3299"
        action: "create"
        model: "general_audit_ws_f9f3299"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9f3299.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Restrict worksheet to account type A, balance_type end_period"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          account_type_id: "REC: account_type_a.id"
          balance_type: "end_period"

      - step: "Reload account"
        action: "call"
        target: "worksheet"
        method: "action_reload_account"
        as_user: "base.user_admin"

      - step: "Find worksheet detail for account A"
        action: "search"
        model: "general_audit_ws_f9f3299.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["account_id", "=", "REC: account_a.id"]
        save_as: "ws_detail_a"
        limit: 1

      - step:
          "Assert current_balance/adjusted_balance/diff at end_period (debit account)"
        action: "assert"
        target: "ws_detail_a"
        asserts:
          current_balance:
            type: "value"
            expected: 1200000.0
          # No adjustment entries -> adjusted_balance = current_balance
          adjusted_balance:
            type: "value"
            expected: 1200000.0
          previous_balance:
            type: "value"
            expected: 800000.0
          # diff = (adjusted_balance - previous_balance) / abs(previous_balance)
          # = (1,200,000 - 800,000) / 800,000 = 0.5
          diff:
            type: "value"
            expected: 0.5

      - step: "Switch balance_type to interim"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          balance_type: "interim"

      - step: "Invalidate cache on worksheet detail A after switching balance_type"
        action: "call"
        target: "ws_detail_a"
        method: "invalidate_cache"

      - step: "Assert current_balance/adjusted_balance/diff at interim"
        action: "assert"
        target: "ws_detail_a"
        asserts:
          current_balance:
            type: "value"
            expected: 900000.0
          adjusted_balance:
            type: "value"
            expected: 900000.0
          # diff = (900,000 - 800,000) / 800,000 = 0.125
          diff:
            type: "value"
            expected: 0.125

      - step: "Switch worksheet to account type B, balance_type end_period"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          account_type_id: "REC: account_type_b.id"
          balance_type: "end_period"

      - step: "Reload account (switches detail_ids to account type B)"
        action: "call"
        target: "worksheet"
        method: "action_reload_account"
        as_user: "base.user_admin"

      - step: "Find worksheet detail for account B"
        action: "search"
        model: "general_audit_ws_f9f3299.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["account_id", "=", "REC: account_b.id"]
        save_as: "ws_detail_b"
        limit: 1

      - step: "Assert current_balance/adjusted_balance (credit account)"
        action: "assert"
        target: "ws_detail_b"
        asserts:
          current_balance:
            type: "value"
            expected: 1000000.0
          # normal_balance = credit, no adjustments -> adjusted = current
          adjusted_balance:
            type: "value"
            expected: 1000000.0

      - step:
          "Assert diff is guarded to 0.0 when previous_balance is 0 (division by zero
          guard)"
        action: "assert"
        target: "ws_detail_b"
        asserts:
          previous_balance:
            type: "value"
            expected: 0.0
          diff:
            type: "value"
            expected: 0.0

