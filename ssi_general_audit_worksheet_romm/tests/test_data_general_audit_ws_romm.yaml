setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - ROMM"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - ROMM"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-ROMM-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - ROMM"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - ROMM"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - ROMM"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type d66d87a"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_romm.worksheet_type_d66d87a"
      save_as: "ws_type_d66d87a"

    - step: "Get worksheet type a418d89 (Account Level Inherent Risk)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_inherent_risk.worksheet_type_a418d89"
      save_as: "ws_type_a418d89"

    - step: "Get worksheet type c165170"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_romm.worksheet_type_c165170"
      save_as: "ws_type_c165170"

    - step: "Get worksheet type de417a6"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_romm.worksheet_type_de417a6"
      save_as: "ws_type_de417a6"

    - step: "Get worksheet type c0e0eec (Fraud Factor Analysis)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_c0e0eec"
      save_as: "ws_type_c0e0eec"

    - step: "Get worksheet type f6a227 (Understanding FS Preparation)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_f6a227"
      save_as: "ws_type_f6a227"

    - step: "Get worksheet type bdcdfc5 (Business Environment)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_bdcdfc5"
      save_as: "ws_type_bdcdfc5"

    - step: "Get worksheet type b59b886 (Control Risk - Entity Level)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_control_risk.worksheet_type_b59b886"
      save_as: "ws_type_b59b886"

scenarios:
  # ------------------------------------------------------------------
  # d66d87a - Create
  # ------------------------------------------------------------------
  - name: "WS d66d87a - Create"
    steps:
      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # d66d87a - Workflow draft to done
  # ------------------------------------------------------------------
  - name: "WS d66d87a - Workflow draft to done"
    steps:
      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create conclusion for d66d87a worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "Account level ROMM has been assessed"
          code: "/"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Account and assertion level ROMM reviewed and documented."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # d66d87a - action_load_detail (initial empty, populate, idempotent,
  # scoped to general_audit_id)
  #
  # Also proves the BL-0176 fix: _load_detail() now filters
  # ``general_audit.standard_detail.search()`` by this worksheet's own
  # ``general_audit_id``, so a standard detail that belongs to a
  # *different* general_audit engagement (``audit_other`` below) is
  # never loaded into this worksheet -- before the fix, the unscoped
  # ``search([])`` would have pulled it in too, expecting 3 lines
  # instead of 2.
  # ------------------------------------------------------------------
  - name: "WS d66d87a - action_load_detail (initial, populate, idempotent, scoped)"
    steps:
      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Verify no detail lines before loading"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "details_before"
        expect_count: 0

      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "account_group"
        as_user: "base.user_admin"
        values:
          name: "Test Account Group - ROMM Load Detail"
          code: "/"

      - step: "Create client account type 1"
        action: "create"
        model: "client_account_type"
        save_as: "account_type_1"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type 1 - ROMM Load Detail"
          code: "/"
          group_id: "REC: account_group.id"
          # general_audit.standard_detail has no "balance" field, unlike
          # client_trial_balance.standard_detail which the field's own
          # default python_code ("result = document.balance") is written
          # for. Use a safe no-op instead to avoid an unrelated crash in
          # general_audit.standard_detail._compute_extrapolation_balance.
          python_code: "result = 0.0"

      - step: "Create client account type 2"
        action: "create"
        model: "client_account_type"
        save_as: "account_type_2"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type 2 - ROMM Load Detail"
          code: "/"
          group_id: "REC: account_group.id"
          python_code: "result = 0.0"

      - step: "Create standard detail 1 for the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail_1"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type_1.id"

      - step: "Create standard detail 2 for the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail_2"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type_2.id"

      - step: "Create a second, unrelated general audit engagement"
        action: "create"
        model: "general_audit"
        save_as: "audit_other"
        as_user: "base.user_admin"
        values:
          title: "Test General Audit - ROMM (Other Engagement)"
          partner_id: "REC: client.id"
          accountant_id: "REC: accountant.id"
          account_type_set_id: "REC: account_type_set.id"
          financial_accounting_standard_id: "REC: standard.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          need_interim: false
          need_previous: false
          num_of_consecutive_audit_firm: 1
          num_of_consecutive_audit_accountant: 1

      - step: "Open the other general audit"
        action: "call"
        target: "audit_other"
        method: "action_open"
        as_user: "base.user_admin"

      - step:
          "Create a standard detail for the other engagement (reuses account_type_1)"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail_other"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit_other.id"
          type_id: "REC: account_type_1.id"

      - step: "Call action_load_detail the first time"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step:
          "Verify 2 detail lines were populated (not 3 -- other engagement excluded)"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "details_after"
        expect_count: 2

      - step: "Verify detail line for standard_detail_1 was loaded"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail_1.id"]
        save_as: "detail_line_1"
        expect_count: 1

      - step: "Verify detail line for standard_detail_2 was loaded"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail_2.id"]
        save_as: "detail_line_2"
        expect_count: 1

      - step:
          "Verify the other engagement's standard detail was NOT loaded into this
          worksheet"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail_other.id"]
        save_as: "detail_line_other"
        expect_count: 0

      - step: "Call action_load_detail a second time"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Verify detail line count stayed at 2, not duplicated"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "details_idempotent"
        expect_count: 2

  # ------------------------------------------------------------------
  # d66d87a - action_load_detail also resyncs inherent_risk from a418d89
  #
  # Reproduces the drift found in production: a418d89.detail already holds
  # a computed inherent_risk ("high"), but standard_detail.inherent_risk
  # ends up blank because the inverse propagation never ran for that line
  # (e.g. data loaded outside the normal form/compute flow). Simulated
  # here by writing the standard detail back to blank directly after the
  # normal a418d89 flow already set it correctly. action_load_detail on
  # the ROMM worksheet must repair it before rebuilding its own lines.
  # ------------------------------------------------------------------
  - name: "WS d66d87a - action_load_detail resyncs inherent_risk from a418d89"
    steps:
      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "account_group"
        as_user: "base.user_admin"
        values:
          name: "Test Account Group - ROMM Resync"
          code: "/"

      - step: "Create client account type"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type - ROMM Resync"
          code: "/"
          group_id: "REC: account_group.id"
          python_code: "result = 0.0"

      - step: "Create standard detail for the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type.id"

      - step: "Create worksheet a418d89 (Account Level Inherent Risk)"
        action: "create"
        model: "general_audit_ws_a418d89"
        save_as: "ws_inherent_risk"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a418d89.id"

      - step: "Create a418d89 detail line assessing high inherent risk"
        action: "create"
        model: "general_audit_ws_a418d89.detail"
        save_as: "inherent_risk_detail"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: ws_inherent_risk.id"
          standard_detail_id: "REC: standard_detail.id"
          likelihood_risk_occuring: "high"
          impact_of_risk: "high"

      - step:
          "Read inherent_risk on the new line -- stored compute fields are computed
          lazily on first access, so this forces _compute_risk() (and its internal
          _inverse_to_standard_detail() write) to actually run before the next step
          checks standard_detail"
        action: "assert"
        target: "inherent_risk_detail"
        asserts:
          inherent_risk:
            type: "value"
            expected: "high"

      - step: "Assert the normal flow already propagated inherent_risk"
        action: "assert"
        target: "standard_detail"
        asserts:
          inherent_risk:
            type: "value"
            expected: "high"

      - step: "Simulate the drift: blank out the standard detail directly"
        action: "write"
        target: "standard_detail"
        as_user: "base.user_admin"
        values:
          inherent_risk: false

      - step: "Confirm the drift is in place before the fix runs"
        action: "assert"
        target: "standard_detail"
        asserts:
          inherent_risk:
            type: "value"
            operator: "is_falsy"

      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Call action_load_detail to populate and repair inherent_risk"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Assert the standard detail was repaired"
        action: "assert"
        target: "standard_detail"
        asserts:
          inherent_risk:
            type: "value"
            expected: "high"

      - step: "Search the ROMM detail line for the repaired standard detail"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail.id"]
        save_as: "romm_detail_line"
        expect_count: 1

      - step: "Assert the ROMM detail line's inherent_risk mirror reflects the fix"
        action: "assert"
        target: "romm_detail_line"
        asserts:
          inherent_risk:
            type: "value"
            expected: "high"

  # ------------------------------------------------------------------
  # d66d87a - action_load_detail must not reset ROMM's own input fields
  #
  # planned_response_* are related+store+readonly=False fields whose ONLY
  # writer is this worksheet itself (unlike inherent_risk, which is
  # sourced from a418d89). A stray ``default=False`` on the
  # planned_response_* field definitions used to make Odoo treat them as
  # explicitly provided on every ``Detail.create()`` call inside
  # _load_detail() -- silently overwriting the value already stored on
  # standard_detail instead of letting the related-field compute read it
  # back. That forced auditors to redo their planned-response ticks every
  # time someone clicked "Load Detail".
  #
  # romm used to be asserted here too (as a related+readonly=False field
  # with no such default), but it is now a full compute (Fase 3b - Matrix
  # A/B via general_audit_romm_scoring_config) and can no longer be set by
  # a manual write() here at all. Its own recompute-on-reload behavior is
  # covered by test_general_audit_ws_d66d87a_romm_compute.py
  # (test_romm_recomputes_on_load_detail_after_ir_change).
  # ------------------------------------------------------------------
  - name: "WS d66d87a - action_load_detail preserves romm/planned_response_*"
    steps:
      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "account_group"
        as_user: "base.user_admin"
        values:
          name: "Test Account Group - ROMM Preserve"
          code: "/"

      - step: "Create client account type"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type - ROMM Preserve"
          code: "/"
          group_id: "REC: account_group.id"
          python_code: "result = 0.0"

      - step: "Create standard detail for the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type.id"

      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Call action_load_detail the first time"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Search the ROMM detail line for the standard detail"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail.id"]
        save_as: "romm_detail_line"
        expect_count: 1

      - step: "Auditor fills in planned response on the line"
        action: "write"
        target: "romm_detail_line"
        as_user: "base.user_admin"
        values:
          planned_response_toc: true
          planned_response_analytic_procedure: true
          planned_response_tod: true
          planned_response_interim: true
          planned_response_ye: true

      - step: "Call action_load_detail a second time (reload)"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Search the ROMM detail line again after reload"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail.id"]
        save_as: "romm_detail_line_after_reload"
        expect_count: 1

      - step: "Assert all planned_response_* flags survived the reload"
        action: "assert"
        target: "romm_detail_line_after_reload"
        asserts:
          planned_response_toc:
            type: "value"
            expected: true
          planned_response_analytic_procedure:
            type: "value"
            expected: true
          planned_response_tod:
            type: "value"
            expected: true
          planned_response_interim:
            type: "value"
            expected: true
          planned_response_ye:
            type: "value"
            expected: true

  # ------------------------------------------------------------------
  # d66d87a.detail - pr_assersion_type_ids must actually be writable
  #
  # ``related`` fields default to ``readonly=True`` in Odoo core
  # (odoo/fields.py: "if attrs.get('related'): attrs['readonly'] =
  # attrs.get('readonly', True)") UNLESS ``readonly=False`` is explicitly
  # passed -- providing a custom ``inverse=`` does NOT clear that default
  # (that shortcut only applies to plain ``compute=`` fields, a different
  # code path). ``pr_assersion_type_ids`` had ``related=`` + a custom
  # ``inverse=`` but no ``readonly=False``, so it was silently readonly at
  # the model level the whole time -- edits looked fine in the UI but were
  # dropped on save. Fixed by adding ``readonly=False`` (which also makes
  # Odoo wire its own equivalent built-in inverse, so the now-redundant
  # custom ``_inverse_to_standard_detail`` method was removed).
  # ------------------------------------------------------------------
  - name: "WS d66d87a.detail - pr_assersion_type_ids is writable and survives reload"
    steps:
      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "account_group"
        as_user: "base.user_admin"
        values:
