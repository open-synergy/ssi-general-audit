setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - ROMM"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - ROMM"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-ROMM-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - ROMM"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - ROMM"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - ROMM"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type d66d87a"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_romm.worksheet_type_d66d87a"
      save_as: "ws_type_d66d87a"

    - step: "Get worksheet type c165170"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_romm.worksheet_type_c165170"
      save_as: "ws_type_c165170"

    - step: "Get worksheet type de417a6"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_romm.worksheet_type_de417a6"
      save_as: "ws_type_de417a6"

    - step: "Get worksheet type c0e0eec (Fraud Factor Analysis)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_c0e0eec"
      save_as: "ws_type_c0e0eec"

    - step: "Get worksheet type f6a227 (Understanding FS Preparation)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_f6a227"
      save_as: "ws_type_f6a227"

    - step: "Get worksheet type bdcdfc5 (Business Environment)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_bdcdfc5"
      save_as: "ws_type_bdcdfc5"

    - step: "Get worksheet type b59b886 (Control Risk - Entity Level)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_control_risk.worksheet_type_b59b886"
      save_as: "ws_type_b59b886"

scenarios:
  # ------------------------------------------------------------------
  # d66d87a - Create
  # ------------------------------------------------------------------
  - name: "WS d66d87a - Create"
    steps:
      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # d66d87a - Workflow draft to done
  # ------------------------------------------------------------------
  - name: "WS d66d87a - Workflow draft to done"
    steps:
      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create conclusion for d66d87a worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "Account level ROMM has been assessed"
          code: "/"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Account and assertion level ROMM reviewed and documented."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # d66d87a - action_load_detail (initial empty, populate, idempotent)
  #
  # Combined into a single scenario on purpose: general_audit_ws_d66d87a
  # ._load_detail() calls ``general_audit.standard_detail.search([])``
  # with NO ``general_audit_id`` filter (a pre-existing production
  # behaviour, out of scope for this test item -- see BL-0166 notes), so
  # every ``general_audit.standard_detail`` created anywhere in this YAML
  # file's shared transaction is visible to every call of
  # ``action_load_detail``. Keeping "initial empty" / "populate" /
  # "idempotent" as one scenario (instead of three) guarantees this is
  # the only place in the whole file that creates
  # ``general_audit.standard_detail`` records, so the expected counts
  # below are not polluted by any other scenario.
  # ------------------------------------------------------------------
  - name: "WS d66d87a - action_load_detail (initial, populate, idempotent)"
    steps:
      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Verify no detail lines before loading"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "details_before"
        expect_count: 0

      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "account_group"
        as_user: "base.user_admin"
        values:
          name: "Test Account Group - ROMM Load Detail"
          code: "/"

      - step: "Create client account type 1"
        action: "create"
        model: "client_account_type"
        save_as: "account_type_1"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type 1 - ROMM Load Detail"
          code: "/"
          group_id: "REC: account_group.id"
          # general_audit.standard_detail has no "balance" field, unlike
          # client_trial_balance.standard_detail which the field's own
          # default python_code ("result = document.balance") is written
          # for. Use a safe no-op instead to avoid an unrelated crash in
          # general_audit.standard_detail._compute_extrapolation_balance.
          python_code: "result = 0.0"

      - step: "Create client account type 2"
        action: "create"
        model: "client_account_type"
        save_as: "account_type_2"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type 2 - ROMM Load Detail"
          code: "/"
          group_id: "REC: account_group.id"
          python_code: "result = 0.0"

      - step: "Create standard detail 1 for the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail_1"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type_1.id"

      - step: "Create standard detail 2 for the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail_2"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type_2.id"

      - step: "Call action_load_detail the first time"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Verify 2 detail lines were populated"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "details_after"
        expect_count: 2

      - step: "Call action_load_detail a second time"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Verify detail line count stayed at 2, not duplicated"
        action: "search"
        model: "general_audit_ws_d66d87a.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "details_idempotent"
        expect_count: 2

  # ------------------------------------------------------------------
  # d66d87a.detail - sync back to general_audit.standard_detail
  #
  # Creates the detail line directly (action: create) instead of calling
  # action_load_detail, so this scenario's assertions never depend on
  # what ``general_audit.standard_detail.search([])`` happens to see
  # elsewhere in this file.
  # ------------------------------------------------------------------
  - name: "WS d66d87a.detail - Write syncs back to standard_detail"
    steps:
      - step: "Create worksheet d66d87a"
        action: "create"
        model: "general_audit_ws_d66d87a"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d66d87a.id"

      - step: "Create client account group"
        action: "create"
        model: "client_account_group"
        save_as: "account_group"
        as_user: "base.user_admin"
        values:
          name: "Test Account Group - ROMM Sync"
          code: "/"

      - step: "Create client account type"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type - ROMM Sync"
          code: "/"
          group_id: "REC: account_group.id"
          python_code: "result = 0.0"

      - step: "Create standard detail for the audit"
        action: "create"
        model: "general_audit.standard_detail"
        save_as: "standard_detail"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: account_type.id"

      - step: "Create worksheet detail line directly"
        action: "create"
        model: "general_audit_ws_d66d87a.detail"
        save_as: "detail_line"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          standard_detail_id: "REC: standard_detail.id"

      - step: "Write ROMM assessment fields on the worksheet detail line"
        action: "write"
        target: "detail_line"
        as_user: "base.user_admin"
        values:
          romm: "high"
          planned_response_toc: true
          planned_response_tod: true

      - step: "Assert the standard detail reflects the written values"
        action: "assert"
        target: "standard_detail"
        asserts:
          romm:
            type: "value"
            expected: "high"
          planned_response_toc:
            type: "value"
            expected: true
          planned_response_tod:
            type: "value"
            expected: true

  # ------------------------------------------------------------------
  # c165170 - Create and workflow draft to done
  # ------------------------------------------------------------------
  - name: "WS c165170 - Create and workflow draft to done"
    steps:
      - step: "Create linked worksheet c0e0eec (Fraud Factor Analysis)"
