  - name: "Seed - Create on a seed with a server action is refused"
    steps:
      - step: "Find the seeded template"
        action: "search"
        model: "general_audit_import_template"
        domain: [["code", "=", "POPULATION"]]
        save_as: "template"
        limit: 1
        expect_count: 1

      - step: "Create on a seed that has a server action is refused"
        action: "call"
        target: "template"
        method: "action_create_server_action"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Server action already exists"
