scenarios:
  - name: "Seed - financial_statement_disclosure template"
    steps:
      - step: "Get the target model"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_review.model_general_audit_ws_a025441"
        save_as: "target_model"

      - step: "Get the seeded template"
        action: "ref"
        xml_id: "ssi_general_audit_import_template_worksheet.general_audit_import_template_financial_statement_disclosure"
        save_as: "template"

      - step: "Assert target model, header flag, and column count"
        action: "assert"
        target: "template"
        asserts:
          name:
            type: "value"
            expected: "Financial Statement Disclosure - Detail"
          model_id:
            type: "m2o"
            expected: "REC: target_model"
          has_header:
            type: "value"
            expected: true
          delimiter:
            type: "value"
            expected: ","
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 4
          server_action_id:
            type: "value"
            operator: "is_truthy"
          server_action_id.binding_model_id:
            type: "m2o"
            expected: "REC: target_model"
          server_action_id.model_id:
            type: "m2o"
            expected: "REC: target_model"
          server_action_id.binding_type:
            type: "value"
            expected: "action"
          server_action_id.state:
            type: "value"
            expected: "code"

