scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_a033cc6.item - Master CRUD
  # ------------------------------------------------------------------
  - name: "Item master - Create"
    steps:
      - step: "Create item master"
        action: "create"
        model: "general_audit_ws_a033cc6.item"
        save_as: "item"
        values:
          name: "TB Check Footing"
          code: "TB-90"
          sequence: 10
          option_set_id: "REF: ssi_general_audit.checklist_option_set_2"
      - step: "Assert item created"
        action: "assert"
        target: "item"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "TB Check Footing"
          code:
            type: "value"
            expected: "TB-90"

  - name: "Item master - Default code is /"
    steps:
      - step: "Create item master without code"
        action: "create"
        model: "general_audit_ws_a033cc6.item"
        save_as: "item"
        values:
          name: "TB Check No Code"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_2"
      - step: "Assert code defaults to /"
        action: "assert"
        target: "item"
        asserts:
          code:
            type: "value"
            expected: "/"

  - name: "Item master - Edit"
    steps:
      - step: "Create item master"
        action: "create"
        model: "general_audit_ws_a033cc6.item"
        save_as: "item"
        values:
          name: "TB Check Footing"
          code: "TB-91"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_2"
      - step: "Write new name"
        action: "write"
        target: "item"
        values:
          name: "TB Check Footing (rev)"
      - step: "Assert name updated"
        action: "assert"
        target: "item"
        asserts:
          name:
            type: "value"
            expected: "TB Check Footing (rev)"

  - name: "Item master - Delete"
    steps:
      - step: "Create item master"
        action: "create"
        model: "general_audit_ws_a033cc6.item"
        save_as: "item"
        values:
          name: "TB Check To Delete"
          code: "TB-92"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_2"
      - step: "Delete item master"
        action: "unlink"
        target: "item"
      - step: "Verify item deleted"
        action: "search"
        model: "general_audit_ws_a033cc6.item"
        domain: [["code", "=", "TB-92"]]
        save_as: "result"
        expect_count: 0

  # ------------------------------------------------------------------
  # general_audit_ws_a033cc6 - Create in draft
  # ------------------------------------------------------------------
  - name: "Worksheet a033cc6 - Create in draft"
    steps:
      - step: "Get config parameter model"
        action: "search"
        model: "ir.config_parameter"
        domain: []
        save_as: "config_parameter"
        limit: 1

      - step: "Allow enough CPA licenses for this scenario"
        action: "call"
        target: "config_parameter"
        method: "set_param"
        args:
          - "ssi_general_audit.max_number_of_cpa_license"
          - "100"

      - step: "Create client partner"
        action: "create"
        model: "res.partner"
        save_as: "client"
        as_user: "base.user_admin"
        values:
          name: "Test Audit Client"
          is_company: true

      - step: "Create accountant partner"
        action: "create"
        model: "res.partner"
        save_as: "accountant"
        as_user: "base.user_admin"
        values:
          name: "Test Audit Accountant"

      - step: "Get CPA license id category"
        action: "ref"
        xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
        save_as: "cpa_category"

      - step: "Grant accountant a CPA license"
        action: "create"
        model: "res.partner.id_number"
        save_as: "cpa_license"
        as_user: "base.user_admin"
        values:
          partner_id: "EVAL: registry['accountant'].id"
          category_id: "EVAL: registry['cpa_category'].id"
          name: "CPA-TB-0001"

      - step: "Create account type set"
        action: "create"
        model: "client_account_type_set"
        save_as: "account_type_set"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type Set"
          code: "/"

      - step: "Create financial accounting standard"
        action: "create"
        model: "accountant.financial_accounting_standard"
        save_as: "standard"
        as_user: "base.user_admin"
        values:
          name: "Test Financial Accounting Standard"
          code: "/"

      - step: "Create general audit"
        action: "create"
        model: "general_audit"
        save_as: "audit"
        as_user: "base.user_admin"
        values:
          title: "Test General Audit - TB Create"
          partner_id: "EVAL: registry['client'].id"
          accountant_id: "EVAL: registry['accountant'].id"
          account_type_set_id: "EVAL: registry['account_type_set'].id"
          financial_accounting_standard_id: "EVAL: registry['standard'].id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          need_interim: false
          need_previous: false
          num_of_consecutive_audit_firm: 1
          num_of_consecutive_audit_accountant: 1

      - step: "Open general audit"
        action: "call"
        target: "audit"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening general audit"
        action: "call"
        target: "audit"
        method: "invalidate_cache"

      - step: "Assert general audit open"
        action: "assert"
        target: "audit"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create worksheet a033cc6"
        action: "create"
        model: "general_audit_ws_a033cc6"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id:
            "REF: ssi_general_audit_worksheet_trial_balance.worksheet_type_a033cc6"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"

