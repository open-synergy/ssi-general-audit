  # ------------------------------------------------------------------
  # onchange_link_1 / onchange_link_2 - triggered by general_audit_id
  #
  # Unlike some sibling worksheets, `link_1`/`link_2` on this model carry no
  # `readonly`/`states` restriction of their own, and `general_audit_id` is
  # editable (readonly=False) while state == "draft" -- the default state of
  # a brand-new Form record. There is no readonly conflict here, so both
  # onchange methods are exercised directly through the Form API via
  # `action: form`, per the odoo-yaml-test DSL.
  # ------------------------------------------------------------------
  - name: "Worksheet cbbbaf4 - Onchange general_audit_id sets link_1 and link_2"
    steps:
      - step: "Open a new form and set general_audit_id"
        action: "form"
        model: "general_audit_ws_cbbbaf4"
        save_as: "onchange_worksheet"
        as_user: "base.user_admin"
        save: true
        values:
          general_audit_id: "REC: audit"

      - step: "Assert link_1 was set by onchange_link_1"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          link_1:
            type: "m2o"
            expected: "REC: ws_806c4e1"

      - step: "Assert link_2 was set by onchange_link_2"
        action: "assert"
        target: "onchange_worksheet"
        asserts:
          link_2:
            type: "m2o"
            expected: "REC: ws_b9d8a5c"

  # ------------------------------------------------------------------
  # onchange_total_manhour_allocation - triggered by allocation_total_hour_id
  #
  # `allocation_total_hour_id` and `total_manhour_allocation` share the same
  # readonly gate (both editable only while state == "open"), so there is no
  # readonly conflict -- open the worksheet first, then drive the Form.
  # ------------------------------------------------------------------
  - name:
      "Worksheet cbbbaf4 - Onchange allocation_total_hour_id sets
      total_manhour_allocation"
    steps:
      # The five milestone dates AND allocation_template_id all become
      # `required=True` (not just editable) once state == "open"
      # (`states={"open": [("readonly", False), ("required", True)]}`).
      # Since the worksheet is opened below and the Form step further down
      # calls `save()`, they must already be filled in here -- otherwise
      # `Form.save()` raises "<field> is a required field" even though this
      # scenario isn't about those fields.
      - step: "Create worksheet cbbbaf4 with the required-on-open fields already set"
        action: "create"
        model: "general_audit_ws_cbbbaf4"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          engagement_date: 2024-08-01
          risk_assessment_date: 2024-08-05
          fieldwork_date: 2024-08-08
          pullout_date: 2024-08-12
          reporting_date: 2024-08-14
          allocation_template_id: "REC: template.id"

      - step: "Open worksheet (allocation_total_hour_id becomes editable)"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Set allocation_total_hour_id via Form"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        values:
          allocation_total_hour_id: "REC: allocation_total_hour"

      - step: "Assert total_manhour_allocation was set from allocation_total_hour_id"
        action: "assert"
        target: "worksheet"
        asserts:
          total_manhour_allocation:
            type: "value"
            expected: 100.0
