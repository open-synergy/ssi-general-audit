  # ------------------------------------------------------------------
  # action_refresh_competency_team - normal
  #
  # NOTE: `_prepare_competency_data` calls `Upgrade.search([])` with NO
  # domain at all, so it always also picks up the 6 production
  # `general_audit_competency_upgrade` records shipped by this module's own
  # `data/master/general_audit_competency_upgrade.xml` (and any created by
  # other installed modules). Asserting an exact/total count here would
  # therefore be coupled to unrelated data files. Instead this scenario
  # creates its own competency_item + upgrade fixture and asserts with
  # `check: "contains"`, which only proves our own fixture is included --
  # regardless of how many other upgrade records exist in the database.
  # ------------------------------------------------------------------
  - name: "Action refresh competency team - normal"
    steps:
      - step: "Create a competency item specific to this scenario"
        action: "create"
        model: "general_audit_ws_b9d8a5c.competency_item"
        save_as: "competency_item"
        as_user: "base.user_admin"
        values:
          name: "Test Competency Item - Refresh Normal"
          code: "/"

      - step: "Create a competency upgrade needing that item"
        action: "create"
        model: "general_audit_competency_upgrade"
        save_as: "upgrade"
        as_user: "base.user_admin"
        values:
          name: "Test Competency Upgrade - Refresh Normal"
          code: "/"
          sequence: 10
          compentency_item_id: "REC: competency_item.id"

      - step: "Create worksheet cbbbaf4 with link_2 pointing at the summary fixture"
        action: "create"
        model: "general_audit_ws_cbbbaf4"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          link_2: "REC: ws_b9d8a5c.id"

      - step:
          "Create a competency analysis for employee 1 that does NOT cover the
          scenario's item"
        action: "create"
        model: "general_audit_ws_b9d8a5c.competency"
        save_as: "competency_analysis_1"
        as_user: "base.user_admin"
        values:
