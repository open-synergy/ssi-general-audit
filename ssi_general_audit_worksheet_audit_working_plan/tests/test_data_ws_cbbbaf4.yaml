          employee_id: "REC: employee_1.id"

      - step: "Call action_refresh_competency_team"
        action: "call"
        target: "worksheet"
        method: "action_refresh_competency_team"
        as_user: "base.user_admin"

      - step: "Verify two team_competency rows were created (one per summary row)"
        action: "search"
        model: "general_audit_ws_cbbbaf4.team_competency"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "rows"
        expect_count: 2

      - step: "Get the row created for employee 1"
        action: "search"
        model: "general_audit_ws_cbbbaf4.team_competency"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["team_id", "=", "REC: employee_1.id"]
        save_as: "row_emp1"
        limit: 1
        expect_count: 1

      - step: "Assert employee 1's row lists the scenario's upgrade as still needed"
        action: "assert"
        target: "row_emp1"
        asserts:
          competency_upgrade_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: upgrade"

      - step: "Get the row created for employee 2 (no competency analysis at all)"
        action: "search"
        model: "general_audit_ws_cbbbaf4.team_competency"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["team_id", "=", "REC: employee_2.id"]
        save_as: "row_emp2"
        limit: 1
        expect_count: 1

      - step:
          "Assert employee 2's row has no upgrade needed (no matching competency
          analysis at all -> _prepare_competency_data short-circuits to an empty list)"
        action: "assert"
        target: "row_emp2"
        asserts:
          competency_upgrade_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

