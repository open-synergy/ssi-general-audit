      # ---- LINK 6: general_audit_ws_437fc8f (team communication pre-engagement) ----
      - step: "Create worksheet 437fc8f (link_6)"
        action: "create"
        model: "general_audit_ws_437fc8f"
        save_as: "ws_437fc8f"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_437fc8f.id"
          review: "Team communication pre-engagement review note."
          communication_planning_date: 2026-02-01
