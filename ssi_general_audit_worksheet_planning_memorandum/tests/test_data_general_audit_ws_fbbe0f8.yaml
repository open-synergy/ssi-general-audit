        method: "action_open"
        as_user: "base.user_admin"

      # ---- LINK 5: general_audit_ws_c16abd7 (inherent risk - FS level) ----
      - step: "Create worksheet c16abd7 (link_5)"
        action: "create"
        model: "general_audit_ws_c16abd7"
        save_as: "ws_c16abd7"
        as_user: "base.user_admin"
        values:
