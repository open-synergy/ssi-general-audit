          communication_reporting_date: 2026-02-10

      - step: "Open worksheet 437fc8f"
        action: "call"
        target: "ws_437fc8f"
        method: "action_open"
        as_user: "base.user_admin"

      # ---- LINK 7: general_audit_ws_ae11f7e (main business activity process) ----
      - step: "Create worksheet ae11f7e (link_7)"
        action: "create"
        model: "general_audit_ws_ae11f7e"
        save_as: "ws_ae11f7e"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_ae11f7e.id"
          previous_audit_information_ids:
            - - 0
              - 0
              - name: "Prior year audit noted no material misstatements."
                related_account_type_ids: [[6, 0, ["REC: account_type.id"]]]
          other_provided_service_ids:
            - - 0
              - 0
              - name: "Tax advisory service"
                partner_id: "REC: client.id"
                related_account_type_ids: [[6, 0, ["REC: account_type.id"]]]
          previous_audit_evidence_ids:
            - - 0
              - 0
              - evidence_id: "REC: evidence.id"
