setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - fbbe0f8"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - fbbe0f8"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-FBBE0F8-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - fbbe0f8"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - fbbe0f8"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - fbbe0f8"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Get worksheet type fbbe0f8"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_planning_memorandum.worksheet_type_fbbe0f8"
      save_as: "ws_type_fbbe0f8"

    - step: "Get worksheet type bdcdfc5"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_bdcdfc5"
      save_as: "ws_type_bdcdfc5"

    - step: "Get worksheet type a604795"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_a604795"
      save_as: "ws_type_a604795"

    - step: "Get worksheet type ae11f7e"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_understanding_entity.worksheet_type_ae11f7e"
      save_as: "ws_type_ae11f7e"

    - step: "Get worksheet type d9d2b44"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.worksheet_type_d9d2b44"
      save_as: "ws_type_d9d2b44"

    - step: "Get worksheet type 6dcda0e"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.worksheet_type_6dcda0e"
      save_as: "ws_type_6dcda0e"

    - step: "Get worksheet type c16abd7"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_inherent_risk.worksheet_type_c16abd7"
      save_as: "ws_type_c16abd7"

    - step: "Get worksheet type 437fc8f"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_team_communication.worksheet_type_437fc8f"
      save_as: "ws_type_437fc8f"

    - step: "Get worksheet type b59b886"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_control_risk.worksheet_type_b59b886"
      save_as: "ws_type_b59b886"

    - step: "Get worksheet type eabdaad"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_control_risk.worksheet_type_eabdaad"
      save_as: "ws_type_eabdaad"

    - step: "Get worksheet type ba9b2f0"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_control_risk.worksheet_type_ba9b2f0"
      save_as: "ws_type_ba9b2f0"

    - step: "Get worksheet type b9d8a5c"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_acceptance_continuance.worksheet_type_b9d8a5c"
      save_as: "ws_type_b9d8a5c"

    - step: "Get worksheet type ae48e68"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_external_communication.worksheet_type_ae48e68"
      save_as: "ws_type_ae48e68"

    - step: "Get worksheet type cbbbaf4"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_audit_working_plan.worksheet_type_cbbbaf4"
      save_as: "ws_type_cbbbaf4"

    - step: "Get business environment - Industry Trends"
      action: "ref"
      xml_id: "ssi_general_audit.general_audit_business_environment_1_297034dd"
      save_as: "be_industry"

    - step: "Get business environment - Amendments to Accounting Standards"
      action: "ref"
      xml_id: "ssi_general_audit.general_audit_business_environment_3_bd6c9b55"
      save_as: "be_amendment"

    - step: "Get business environment - Regulatory Changes"
      action: "ref"
      xml_id: "ssi_general_audit.general_audit_business_environment_4_aaeebb37"
      save_as: "be_regulatory"

    - step: "Get business environment - Technological Developments (IT)"
      action: "ref"
      xml_id: "ssi_general_audit.general_audit_business_environment_5_ffea3e57"
      save_as: "be_it"

scenarios:
  # ------------------------------------------------------------------
  # Empty condition - no upstream worksheets at all
  # ------------------------------------------------------------------
  - name: "Create fbbe0f8 without upstream worksheets - links and computed fields empty"
    steps:
      - step: "Create worksheet fbbe0f8 with no upstream worksheets"
        action: "create"
        model: "general_audit_ws_fbbe0f8"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fbbe0f8.id"

      - step: "Assert all 13 links and derived compute fields are empty"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          link_1_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          link_2_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          link_3_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          link_4_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          link_5_id:
            type: "value"
            operator: "is_falsy"
          link_6_id:
            type: "value"
            operator: "is_falsy"
          link_7_id:
            type: "value"
            operator: "is_falsy"
          link_8_id:
            type: "value"
            operator: "is_falsy"
          link_9_id:
            type: "value"
            operator: "is_falsy"
          link_10_id:
            type: "value"
            operator: "is_falsy"
          link_11_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          link_12_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          link_13_id:
            type: "value"
            operator: "is_falsy"
          overall_materiality:
            type: "value"
            expected: 0.0
          performance_materiality:
            type: "value"
            expected: 0.0
          tolerable_misstatement:
            type: "value"
            expected: 0.0
          specific_materiality_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          unannounced_audit_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          assigned_team_member_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          volume_transaction_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          cycle_level_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          significant_acc_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          previous_auditor_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          other_provided_service_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          previous_audit_evidence_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          other_evidence_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          assignment_team_ids:
            type: "m2m"
            check: "count"
            expected_count: 0
          it_review:
            type: "value"
            operator: "is_falsy"
          industry_review:
            type: "value"
            operator: "is_falsy"
          amendment_review:
            type: "value"
            operator: "is_falsy"
          regulatory_review:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # Normal condition - all 13 upstream worksheets present, plus full
  # workflow (open -> confirm -> approve -> done), since confirm on
  # fbbe0f8 requires all 13 links to be filled already.
  # ------------------------------------------------------------------
  - name: "Compute link_1..link_13 (normal) with derived fields and full workflow"
    steps:
      # ---- shared minimal master data used by several upstream worksheets ----
      - step: "Create shared client account group"
        action: "create"
        model: "client_account_group"
        save_as: "account_group"
        as_user: "base.user_admin"
        values:
          name: "Test Account Group - fbbe0f8 Normal"
          code: "/"

      - step: "Create shared client account type"
        action: "create"
        model: "client_account_type"
        save_as: "account_type"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type - fbbe0f8 Normal"
          code: "/"
          group_id: "REC: account_group.id"

      - step: "Create shared employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Test Employee - fbbe0f8 Normal"

      - step: "Create shared class of transaction"
        action: "create"
        model: "general_audit_class_transaction"
        save_as: "class_transaction"
        as_user: "base.user_admin"
        values:
          name: "Test Class Transaction - fbbe0f8 Normal"
          code: "/"

      - step: "Create shared audit evidence type"
        action: "create"
        model: "general_audit_evidence"
        save_as: "evidence"
        as_user: "base.user_admin"
        values:
          name: "Test Evidence - fbbe0f8 Normal"

      - step: "Create shared client business process (business cycle)"
        action: "create"
        model: "client_business_process"
        save_as: "business_cycle"
        as_user: "base.user_admin"
        values:
          name: "Test Business Cycle - fbbe0f8 Normal"
          code: "/"

      # ---- LINK 1: 4x general_audit_ws_bdcdfc5, one per business environment ----
      - step:
          "Create worksheet bdcdfc5 for IT environment (link_1, it_detail_ids/it_review)"
        action: "create"
        model: "general_audit_ws_bdcdfc5"
        save_as: "ws_bdcdfc5_it"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bdcdfc5.id"
          business_environment_id: "REC: be_it.id"
          review: "IT review note."
          detail_ids:
            - - 0
              - 0
              - understanding_result: "IT environment understanding result."
                impact_to_financial_report: "Impact on financial report from IT."
                related_account_type_ids: [[6, 0, ["REC: account_type.id"]]]

      - step: "Open worksheet bdcdfc5 (IT)"
        action: "call"
        target: "ws_bdcdfc5_it"
        method: "action_open"
        as_user: "base.user_admin"

      - step:
          "Create worksheet bdcdfc5 for Industry environment (link_1, industry_review)"
        action: "create"
        model: "general_audit_ws_bdcdfc5"
        save_as: "ws_bdcdfc5_industry"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bdcdfc5.id"
          business_environment_id: "REC: be_industry.id"
          review: "Industry review note."

      - step: "Open worksheet bdcdfc5 (Industry)"
        action: "call"
        target: "ws_bdcdfc5_industry"
        method: "action_open"
        as_user: "base.user_admin"

      - step:
          "Create worksheet bdcdfc5 for Amendment environment (link_1, amendment_review)"
        action: "create"
        model: "general_audit_ws_bdcdfc5"
        save_as: "ws_bdcdfc5_amendment"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bdcdfc5.id"
          business_environment_id: "REC: be_amendment.id"
          review: "Amendment review note."

      - step: "Open worksheet bdcdfc5 (Amendment)"
        action: "call"
        target: "ws_bdcdfc5_amendment"
        method: "action_open"
        as_user: "base.user_admin"

      - step:
          "Create worksheet bdcdfc5 for Regulatory environment (link_1,
          regulatory_review)"
        action: "create"
        model: "general_audit_ws_bdcdfc5"
        save_as: "ws_bdcdfc5_regulatory"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_bdcdfc5.id"
          business_environment_id: "REC: be_regulatory.id"
          review: "Regulatory review note."

      - step: "Open worksheet bdcdfc5 (Regulatory)"
        action: "call"
        target: "ws_bdcdfc5_regulatory"
        method: "action_open"
        as_user: "base.user_admin"

      # ---- LINK 2: general_audit_ws_a604795 (business cycle summaries) ----
      - step: "Create worksheet a604795 (link_2)"
        action: "create"
        model: "general_audit_ws_a604795"
        save_as: "ws_a604795"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a604795.id"
          estimated_transaction_volume: 5000
          assigned_team_member_ids: [[6, 0, ["REC: employee.id"]]]
          detail_ids:
            - - 0
              - 0
              - class_transaction_id: "REC: class_transaction.id"
                related_account_type_ids: [[6, 0, ["REC: account_type.id"]]]
                need_unannounced_audit: true

      - step: "Open worksheet a604795"
        action: "call"
        target: "ws_a604795"
        method: "action_open"
        as_user: "base.user_admin"

      # ---- LINK 3: general_audit_ws_d9d2b44 (materiality computation) ----
      - step: "Create worksheet d9d2b44 (link_3, materiality)"
        action: "create"
        model: "general_audit_ws_d9d2b44"
        save_as: "ws_d9d2b44"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d9d2b44.id"
          base_amount_source: "extrapolation"
          other_amount_ok: true
          other_base_amount: 1000000.0
          overall_materiality_percentage: 5.0
          performance_materiality_percentage: 50.0
          tolerable_misstatement_percentage: 10.0

      - step: "Open worksheet d9d2b44"
        action: "call"
        target: "ws_d9d2b44"
        method: "action_open"
        as_user: "base.user_admin"

      # ---- LINK 4: general_audit_ws_6dcda0e (specific materiality) ----
