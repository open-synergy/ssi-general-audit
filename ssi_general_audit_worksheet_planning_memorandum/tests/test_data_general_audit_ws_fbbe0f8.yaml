        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_ae48e68.id"
          mgmt_communication_planning_date: 2026-03-01
          mgmt_communication_date: 2026-03-05
          mgmt_communication_reporting_date: 2026-03-10
          tcwg_communication_planning_date: 2026-03-02
          tcwg_communication_date: 2026-03-06
          tcwg_communication_reporting_date: 2026-03-11
          ia_communication_planning_date: 2026-03-03
          ia_communication_date: 2026-03-07
          ia_communication_reporting_date: 2026-03-12

      - step: "Open worksheet ae48e68"
        action: "call"
        target: "ws_ae48e68"
        method: "action_open"
        as_user: "base.user_admin"

      # ---- LINK 11: general_audit_ws_eabdaad (control risk - cycle level) ----
      - step: "Create worksheet eabdaad (link_11)"
        action: "create"
        model: "general_audit_ws_eabdaad"
