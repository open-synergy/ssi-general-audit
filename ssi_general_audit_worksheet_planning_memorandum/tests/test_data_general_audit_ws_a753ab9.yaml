setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - a753ab9"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - a753ab9"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-A753AB9-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - a753ab9"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - a753ab9"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - a753ab9"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type a753ab9"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_planning_memorandum.worksheet_type_a753ab9"
      save_as: "ws_type_a753ab9"

scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_a753ab9.item - CRUD
  # ------------------------------------------------------------------
  - name: "Create checklist item a753ab9"
    steps:
      - step: "Create checklist item"
        action: "create"
        model: "general_audit_ws_a753ab9.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Test Checklist Item - Create"
          checklist_type: "characteristic"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_1"

      - step: "Assert checklist item created"
        action: "assert"
        target: "item"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Checklist Item - Create"
          checklist_type:
            type: "value"
            expected: "characteristic"
          code:
            type: "value"
            expected: "/"

  - name: "Edit checklist item a753ab9 name"
    steps:
      - step: "Create checklist item"
        action: "create"
        model: "general_audit_ws_a753ab9.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Test Checklist Item - Before Edit"
          checklist_type: "reporting"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_1"

      - step: "Write new name"
        action: "write"
        target: "item"
        as_user: "base.user_admin"
        values:
          name: "Test Checklist Item - After Edit"

      - step: "Assert name updated"
        action: "assert"
        target: "item"
        asserts:
          name:
            type: "value"
            expected: "Test Checklist Item - After Edit"

  - name: "Delete checklist item a753ab9"
    steps:
      - step: "Create checklist item"
        action: "create"
        model: "general_audit_ws_a753ab9.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Test Checklist Item - To Delete"
          checklist_type: "important"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_1"

      - step: "Delete checklist item"
        action: "unlink"
        target: "item"
        as_user: "base.user_admin"

      - step: "Verify checklist item deleted (filtered by its own id)"
        action: "search"
        model: "general_audit_ws_a753ab9.item"
        domain: [["id", "=", "REC: item.id"]]
        save_as: "deleted_result"
        expect_count: 0

  # ------------------------------------------------------------------
  # general_audit_ws_a753ab9 - worksheet
  # ------------------------------------------------------------------
  - name: "Create worksheet a753ab9"
    steps:
      - step: "Create worksheet a753ab9"
        action: "create"
        model: "general_audit_ws_a753ab9"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a753ab9.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"

  - name: "Checklist line reflects item checklist_type"
    steps:
      - step: "Create checklist item"
        action: "create"
        model: "general_audit_ws_a753ab9.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Test Checklist Item - For Line"
          checklist_type: "significant"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_1"

      - step: "Create worksheet a753ab9"
        action: "create"
        model: "general_audit_ws_a753ab9"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a753ab9.id"

      - step: "Create checklist line"
        action: "create"
        model: "general_audit_ws_a753ab9.checklist"
        save_as: "checklist_line"
        as_user: "base.user_admin"
        values:
          worksheet_id: "REC: worksheet.id"
          item_id: "REC: item.id"

      - step: "Assert checklist line checklist_type matches item's checklist_type"
        action: "assert"
        target: "checklist_line"
        asserts:
          checklist_type:
            type: "value"
            expected: "significant"
          item_id.checklist_type:
            type: "value"
            expected: "significant"

  # ------------------------------------------------------------------
  # Workflow
  # ------------------------------------------------------------------
  - name: "Workflow a753ab9 - draft to done"
    steps:
      - step: "Create conclusion for a753ab9 worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "Audit Planning Memorandum reviewed and adequate"
          code: "/"
          type_id: "REC: ws_type_a753ab9.id"

      - step: "Create worksheet a753ab9"
        action: "create"
        model: "general_audit_ws_a753ab9"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a753ab9.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Planning memorandum checklist reviewed and adequate."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Workflow a753ab9 - cancel and restart"
    steps:
      - step: "Create worksheet a753ab9"
        action: "create"
        model: "general_audit_ws_a753ab9"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a753ab9.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"
