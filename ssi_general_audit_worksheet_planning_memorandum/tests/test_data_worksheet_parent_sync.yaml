options:
  auto_refresh: true

setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - a753ab9"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - a753ab9"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-PSYNC-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - a753ab9"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - a753ab9"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - psync"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Get worksheet type a753ab9"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_planning_memorandum.worksheet_type_a753ab9"
      save_as: "ws_type_a753ab9"

scenarios:
  - name: "parent worksheet follows the shared fields of the child"
    steps:
      - step: "Create worksheet"
        action: "create"
        model: "general_audit_ws_a753ab9"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a753ab9.id"

      - step: "Assert the parent starts in draft with the same type"
        action: "assert"
        target: "worksheet"
        asserts:
          worksheet_id.state:
            type: "value"
            expected: "draft"
          worksheet_id.parent_type_id:
            type: "m2o"
            expected: "REC: ws_type_a753ab9"

      - step: "Set the reviewer on the child"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          reviewer_id: "REF: base.user_admin"

      - step: "Assert the parent got the same reviewer"
        action: "assert"
        target: "worksheet"
        asserts:
          worksheet_id.reviewer_id:
            type: "m2o"
            expected: "REF: base.user_admin"

      - step: "Open the worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Assert the parent state follows the child"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"
          worksheet_id.state:
            type: "value"
            expected: "open"
