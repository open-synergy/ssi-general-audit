setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - fc75636"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - fc75636"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-FC75636-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - fc75636"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "fas"
      as_user: "base.user_admin"
      values:
        name: "Test FAS - fc75636"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - fc75636"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: fas.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      refresh: true
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type fc75636"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_review.worksheet_type_fc75636"
      save_as: "ws_type_fc75636"

    - step: "Get worksheet type a8c54f3"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_final_report.worksheet_type_a8c54f3"
      save_as: "ws_type_a8c54f3"

    - step: "Create accountant opinion"
      action: "create"
      model: "accountant.opinion"
      save_as: "opinion"
      as_user: "base.user_admin"
      values:
        name: "Unqualified Opinion - fc75636"
        code: "/"

scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_fc75636 - Create
  # ------------------------------------------------------------------
  - name: "Create worksheet fc75636"
    steps:
      - step: "Create worksheet fc75636"
        action: "create"
        model: "general_audit_ws_fc75636"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fc75636.id"

      - step: "Assert worksheet created in draft, links empty"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          audit_final_memorandum_id:
            type: "value"
            operator: "is_falsy"
          proposed_audit_opinion_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # audit_final_memorandum_id / proposed_audit_opinion_id - positive:
  # action_reload_links finds the matching Audit Final Memorandum
  # (a8c54f3) sibling of the same General Audit, once it is Open, and
  # mirrors its proposed_audit_opinion_id.
  # ------------------------------------------------------------------
  - name: "Reload Links fc75636 - finds matching a8c54f3 sibling"
    steps:
      - step: "Create worksheet fc75636, before the sibling exists"
        action: "create"
        model: "general_audit_ws_fc75636"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fc75636.id"

      - step: "Open worksheet fc75636"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create worksheet a8c54f3 with proposed_audit_opinion_id"
        action: "create"
        model: "general_audit_ws_a8c54f3"
        save_as: "memorandum"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a8c54f3.id"
          proposed_audit_opinion_id: "REC: opinion.id"

      - step: "Open worksheet a8c54f3"
        action: "call"
        target: "memorandum"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Reload links on worksheet fc75636"
        action: "call"
        target: "worksheet"
        method: "action_reload_links"
        as_user: "base.user_admin"

      - step: "Assert audit_final_memorandum_id and proposed_audit_opinion_id"
        action: "assert"
        target: "worksheet"
        refresh: true
        asserts:
          audit_final_memorandum_id:
            type: "m2o"
            expected: "REC: memorandum"
          proposed_audit_opinion_id:
            type: "m2o"
            expected: "REC: opinion"

  # ------------------------------------------------------------------
  # audit_final_memorandum_id - negative: no matching a8c54f3 sibling
  # of the same General Audit -- reload leaves it empty, no error.
  # ------------------------------------------------------------------
  - name: "Reload Links fc75636 - no sibling, stays empty without error"
    steps:
      - step: "Create worksheet fc75636 with no a8c54f3 sibling"
        action: "create"
        model: "general_audit_ws_fc75636"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fc75636.id"

      - step: "Open worksheet fc75636"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Reload links on worksheet fc75636 (no sibling exists)"
        action: "call"
        target: "worksheet"
        method: "action_reload_links"
        as_user: "base.user_admin"

      - step: "Assert audit_final_memorandum_id stays empty"
        action: "assert"
        target: "worksheet"
        refresh: true
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          audit_final_memorandum_id:
            type: "value"
            operator: "is_falsy"
          proposed_audit_opinion_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # Draft Audit Opinion - positive: worksheet is Open, the nine narrative
  # Html fields can be filled (including simple HTML markup such as
  # <b>/<ul>) and keep their value after save.
  # ------------------------------------------------------------------
  - name: "Draft Audit Opinion fc75636 - fields are saved when open"
    steps:
      - step: "Create worksheet fc75636"
        action: "create"
        model: "general_audit_ws_fc75636"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fc75636.id"

      - step: "Open worksheet fc75636"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Fill in the nine Draft Audit Opinion fields"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          draft_opinion: "<p>Custom opinion narrative with <b>bold emphasis</b>.</p>"
          draft_basis_for_opinion: "<p>Custom basis for opinion narrative.</p>"
          draft_key_audit_matters: >-
            <p>Custom key audit matters:</p><ul><li>Matter one</li> <li>Matter
            two</li></ul>
          draft_other_information: "<p>Custom other information narrative.</p>"
          draft_responsibilities_of_management:
            "<p>Custom responsibilities of management narrative.</p>"
          draft_auditor_responsibilities:
            "<p>Custom auditor's responsibilities narrative.</p>"
          draft_other_legal_regulatory:
            "<p>Custom other legal and regulatory narrative.</p>"
          draft_emphasis_of_matter: "<p>Custom emphasis of matter narrative.</p>"
          draft_other_matter: "<p>Custom other matter narrative.</p>"

      - step: "Assert the nine Draft Audit Opinion fields keep their value"
        action: "assert"
        target: "worksheet"
        refresh: true
        asserts:
          draft_opinion:
            type: "value"
            operator: "contains"
            expected: "bold emphasis"
          draft_basis_for_opinion:
            type: "value"
            operator: "contains"
            expected: "Custom basis for opinion narrative"
          draft_key_audit_matters:
            type: "value"
            operator: "contains"
            expected: "Matter one"
          draft_other_information:
            type: "value"
            operator: "contains"
            expected: "Custom other information narrative"
          draft_responsibilities_of_management:
            type: "value"
            operator: "contains"
            expected: "Custom responsibilities of management narrative"
          draft_auditor_responsibilities:
            type: "value"
            operator: "contains"
            expected: "Custom auditor's responsibilities narrative"
          draft_other_legal_regulatory:
            type: "value"
            operator: "contains"
            expected: "Custom other legal and regulatory narrative"
          draft_emphasis_of_matter:
            type: "value"
            operator: "contains"
            expected: "Custom emphasis of matter narrative"
          draft_other_matter:
            type: "value"
            operator: "contains"
            expected: "Custom other matter narrative"

      - step: "Assert draft_opinion keeps the <b> markup"
        action: "assert"
        target: "worksheet"
        asserts:
          draft_opinion:
            type: "value"
            operator: "contains"
            expected: "<b>"

      - step: "Assert draft_key_audit_matters keeps the <ul>/<li> markup"
        action: "assert"
        target: "worksheet"
        asserts:
          draft_key_audit_matters:
            type: "value"
            operator: "contains"
            expected: "<li>Matter one</li>"

  # ------------------------------------------------------------------
  # Draft Audit Opinion - defaults: draft_opinion, draft_basis_for_opinion,
  # draft_responsibilities_of_management and draft_auditor_responsibilities
  # carry a generic template as default; the other five fields (situational
  # sections) have no default.
  # ------------------------------------------------------------------
  - name: "Draft Audit Opinion fc75636 - default values on a new worksheet"
    steps:
      - step: "Create worksheet fc75636, no Draft Audit Opinion values given"
        action: "create"
        model: "general_audit_ws_fc75636"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_fc75636.id"

      - step: "Assert the four templated fields carry a default value"
        action: "assert"
        target: "worksheet"
        asserts:
          draft_opinion:
            type: "value"
            operator: "contains"
            expected: "Kami telah mengaudit laporan keuangan"
          draft_basis_for_opinion:
            type: "value"
            operator: "contains"
            expected: "Kami melaksanakan audit kami berdasarkan Standar Audit"
          draft_responsibilities_of_management:
            type: "value"
            operator: "contains"
            expected: "Manajemen bertanggung jawab atas penyusunan"
          draft_auditor_responsibilities:
            type: "value"
            operator: "contains"
            expected: "Tujuan kami adalah untuk memeroleh keyakinan memadai"

      - step: "Assert the five situational fields have no default"
        action: "assert"
        target: "worksheet"
        asserts:
          draft_key_audit_matters:
            type: "value"
            operator: "is_falsy"
          draft_other_information:
            type: "value"
            operator: "is_falsy"
          draft_other_legal_regulatory:
            type: "value"
            operator: "is_falsy"
          draft_emphasis_of_matter:
            type: "value"
            operator: "is_falsy"
          draft_other_matter:
            type: "value"
            operator: "is_falsy"
