options:
  auto_refresh: true

setup:
  steps:
    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - a8c54f3 Links 42-47"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - a8c54f3 Links 42-47"

    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-A8C54F3LINKS4247-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - a8c54f3 Links 42-47"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - a8c54f3 Links 42-47"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - a8c54f3 Links 42-47"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type a8c54f3"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_final_report.worksheet_type_a8c54f3"
      save_as: "ws_type_a8c54f3"

    - step: "Get worksheet type be62e79"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_review.worksheet_type_be62e79"
      save_as: "ws_type_be62e79"

scenarios:
  # Positive: link_42 (Financial Statement Disclosure Review, be62e79)
  # resolves once its source worksheet is open, and link_42_conclusion
  # mirrors the source worksheet's own conclusion, after
  # action_reload_links is called on a8c54f3.
  - name: "action_reload_links resolves link_42 from open be62e79 worksheet"
    steps:
      - step: "Create worksheet be62e79"
        action: "create"
        model: "general_audit_ws_be62e79"
        save_as: "ws_be62e79"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_be62e79.id"

      - step: "Open worksheet be62e79"
        action: "call"
        target: "ws_be62e79"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create conclusion for worksheet type be62e79"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion_be62e79"
        as_user: "base.user_admin"
        values:
          name: "Disclosure review complete (link_42 test)"
          code: "/"
          type_id: "REC: ws_type_be62e79.id"

      - step: "Fill conclusion on ws_be62e79"
        action: "write"
        target: "ws_be62e79"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion_be62e79.id"
          conclusion: "Disclosures agree to the audited financial statements."

      - step: "Create worksheet a8c54f3 on the same general audit"
        action: "create"
        model: "general_audit_ws_a8c54f3"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a8c54f3.id"

      - step: "Call action_reload_links on a8c54f3"
        action: "call"
        target: "worksheet"
        method: "action_reload_links"
        as_user: "base.user_admin"

      - step: "Assert link_42_id resolved and link_42_state is open"
        action: "assert"
        target: "worksheet"
        asserts:
          link_42_id:
            type: "m2o"
            expected: "REC: ws_be62e79"
          link_42_state:
            type: "value"
            expected: "open"

      - step: "Assert link_42_conclusion mirrors ws_be62e79 conclusion"
        action: "assert"
        target: "worksheet"
        asserts:
          link_42_conclusion:
            type: "value"
            expected: "Disclosures agree to the audited financial statements."

  # Negative: without a Proposed Audit Opinion worksheet (fc75636,
  # link_47) for this general audit, link_47_id must stay empty rather
  # than raise.
  - name: "link_47 stays empty without a fc75636 worksheet"
    steps:
      - step: "Create worksheet a8c54f3 with no fc75636 sibling"
        action: "create"
        model: "general_audit_ws_a8c54f3"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a8c54f3.id"

      - step: "Assert link_47_id is empty"
        action: "assert"
        target: "worksheet"
        asserts:
          link_47_id:
            type: "value"
            operator: "is_falsy"
