scenarios:
  # ------------------------------------------------------------------
  # Installed data - worksheet_type_bcc0d76.standard_item_ids
  # ------------------------------------------------------------------
  - name: "Worksheet type BCC0D76 (Audit Quality) - standard_item_ids installed data"
    steps:
      - step: "Get worksheet type BCC0D76"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_review.worksheet_type_bcc0d76"
        save_as: "type_bcc0d76"

      - step: "Assert standard_item_ids is exactly ISA 220"
        action: "assert"
        target: "type_bcc0d76"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_3_f4f0eb9d"

      - step:
          "Verify unrelated audit standards (ISA 315, ISA 240) are not linked to BCC0D76"
        action: "search"
        model: "general_audit_worksheet_type"
        domain:
          [
            ["id", "=", "REC: type_bcc0d76.id"],
            ["standard_item_ids.code", "in", ["ISA 315", "ISA 240"]],
          ]
        save_as: "unrelated_standard_link_bcc0d76"
        expect_count: 0

