setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - a025441"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - a025441"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-A025441-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - a025441"
        code: "/"

    - step: "Create financial accounting standard FAS-A"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "fas_a"
      as_user: "base.user_admin"
      values:
        name: "Test FAS-A"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - a025441"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: fas_a.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type a025441"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_review.worksheet_type_a025441"
      save_as: "ws_type_a025441"

scenarios:
  # ------------------------------------------------------------------
  # general_audit_ws_a025441.item / .checklist -- purged models
  #
  # GitHub issue #326: general_audit_ws_a025441 no longer inherits
  # mixin.checklist, and its item master / checklist value models are
  # removed from the code entirely (replaced by the raw_data CSV
  # field, following the General Ledger/Subledger pattern). Prove
  # neither model is registered anymore.
  # ------------------------------------------------------------------
  - name: "Purged models are no longer registered (a025441)"
    steps:
      - step: "Search ir.model for the purged item/checklist models"
        action: "search"
        model: "ir.model"
        domain:
          [
            [
              "model",
              "in",
              ["general_audit_ws_a025441.item", "general_audit_ws_a025441.checklist"],
            ],
          ]
        save_as: "purged_models"
        expect_count: 0

  # ------------------------------------------------------------------
  # general_audit_ws_a025441 - Create
  # ------------------------------------------------------------------
  - name: "Create worksheet a025441"
    steps:
      - step: "Create worksheet a025441"
        action: "create"
        model: "general_audit_ws_a025441"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a025441.id"

      - step: "Assert worksheet created in draft"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          raw_data:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # raw_data / conclusion_id / conclusion -- fillable while Open
  # (conclusion_id/conclusion are inherited generically from
  # general_audit_worksheet; not declared on general_audit_ws_a025441)
  # ------------------------------------------------------------------
  - name: "Fill raw_data, conclusion_id and conclusion while Open (a025441)"
    steps:
      - step: "Create worksheet a025441"
        action: "create"
        model: "general_audit_ws_a025441"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a025441.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Create conclusion master for a025441 worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion_master_fill"
        as_user: "base.user_admin"
        values:
          name: "Financial statement disclosures completed"
          code: "/"
          type_id: "REC: ws_type_a025441.id"

      - step: "Fill the disclosure checklist CSV, conclusion_id and conclusion"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          raw_data:
            "Item,Standard,Note,Status\nPSAK 1 - Basis of preparation,PSAK 1,Disclosed
            in Note 2,Yes\n"
          conclusion_id: "REC: conclusion_master_fill.id"
          conclusion: "All disclosure items reviewed and documented."

      - step: "Assert the three fields were saved"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            operator: "contains"
            expected: "PSAK 1 - Basis of preparation"
          conclusion_id:
            type: "m2o"
            expected: "REC: conclusion_master_fill"
          conclusion:
            type: "value"
            expected: "All disclosure items reviewed and documented."

  # ------------------------------------------------------------------
  # raw_data - readonly locked outside "open" state
  # ------------------------------------------------------------------
  - name: "Worksheet a025441 - raw_data readonly outside open"
    steps:
      - step: "Create worksheet, still in draft"
        action: "create"
        model: "general_audit_ws_a025441"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a025441.id"

      - step: "Setting raw_data via Form must be rejected in draft"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: false
        ops:
          - set: {raw_data: "Item,Standard,Note,Status\nPSAK 1,PSAK 1,Note,Yes\n"}
        expect_error:
          type: "AssertionError"
          message_contains: "readonly"

  # ------------------------------------------------------------------
  # Workflow
  # ------------------------------------------------------------------
  - name: "Workflow a025441 - draft to done"
    steps:
      - step: "Create worksheet a025441"
        action: "create"
        model: "general_audit_ws_a025441"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a025441.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Fill the disclosure checklist before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          raw_data: "Item,Standard,Note,Status\nPSAK 1,PSAK 1,Note 2,Yes\n"

      - step: "Create conclusion for a025441 worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion_master"
        as_user: "base.user_admin"
        values:
          name: "Financial statement disclosures reviewed"
          code: "/"
          type_id: "REC: ws_type_a025441.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion_master.id"
          conclusion: "All disclosure items reviewed and documented."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Workflow a025441 - cancel and restart"
    steps:
      - step: "Create worksheet a025441"
        action: "create"
        model: "general_audit_ws_a025441"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a025441.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # Onchange type_id -> parent_type_id (general_audit_worksheet_mixin
  # .onchange_parent_type_id). type_id is "readonly=1 force_save=1" on
  # the form view inherited from general_audit_worksheet_mixin_views.xml,
  # so Form cannot set it explicitly mid-form -- it can only observe its
  # default value (from _default_type_id/_type_xml_id). general_audit_id
  # is set only because it is required to save; the onchange under test
  # fires from type_id's own default when the form is first opened, so
  # the assertion is made on the saved record rather than inline on the
  # (unsaved) Form.
  # ------------------------------------------------------------------
  - name: "Onchange type_id sets parent_type_id (a025441)"
    steps:
      - step: "Open a new worksheet form and save with the default type_id"
        action: "form"
        model: "general_audit_ws_a025441"
        save_as: "record"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit"
        save: true

      - step: "Assert parent_type_id follows type_id via onchange_parent_type_id"
        action: "assert"
        target: "record"
        asserts:
          type_id:
            type: "m2o"
            expected: "REC: ws_type_a025441"
          parent_type_id:
            type: "m2o"
            expected: "REC: ws_type_a025441"
