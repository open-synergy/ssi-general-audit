  # ------------------------------------------------------------------
  # Onchange general_audit_id clears account_type_id / ws_e51bb1c_id
  # ------------------------------------------------------------------
  - name:
      "WS-AA899BAF - Onchange general_audit_id mengosongkan account_type_id dan
      ws_e51bb1c_id"
    steps:
      - step: >-
          Create worksheet with account_type_id and ws_e51bb1c_id already filled -- via
          direct ORM create(), NOT via Form. See the identical note in
          test_data_ws_de3244b.yaml: account_type_id/ws_e51bb1c_id are only
          Form-editable in state "open", general_audit_id only in state "draft" -- those
          windows never overlap, so seeding via create() first and editing an EXISTING
          record afterwards is the only way to exercise this onchange.
        action: "create"
        model: "general_audit_ws_aa899baf"
        save_as: "ws_onchange"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_type_id: "REC: account_type.id"
          ws_e51bb1c_id: "REC: ws_e51bb1c.id"

      - step: "Sanity check - both fields are non-empty before the onchange fires"
        action: "assert"
        target: "ws_onchange"
        asserts:
          account_type_id:
            type: "m2o"
            expected: "REC: account_type"
          ws_e51bb1c_id:
            type: "m2o"
            expected: "REC: ws_e51bb1c"

      - step:
          "Edit via Form and change general_audit_id (still draft, so it is editable
          there)"
        action: "form"
        target: "ws_onchange"
        as_user: "base.user_admin"
        save: false
        ops:
          - set: {general_audit_id: "REC: audit2"}
          - assert:
              account_type_id:
                type: "value"
                operator: "is_falsy"
              ws_e51bb1c_id:
                type: "value"
                operator: "is_falsy"

  # ------------------------------------------------------------------
  # variable - Onchange data_mode clears general_ledger_id / subledger_id
  # ------------------------------------------------------------------
  - name:
      "WS-AA899BAF.variable - Onchange data_mode mengosongkan general_ledger_id dan
      subledger_id"
    steps:
      - step: "Create worksheet aa899baf for the variable onchange"
        action: "create"
        model: "general_audit_ws_aa899baf"
        save_as: "ws"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Create general ledger data source"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id:
            "REF: ssi_general_audit_worksheet_client_package.worksheet_type_d209914"
          title: "GL - Onchange"

      - step: "Create subledger data source"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "sl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id:
            "REF: ssi_general_audit_worksheet_client_package.worksheet_type_b5e3d9f"
          title: "SL - Onchange"

      - step:
          "Open a new variable form, set both sources, then flip data_mode to trigger
          the onchange"
        action: "form"
        model: "general_audit_ws_aa899baf.variable"
        save: false
        ops:
          - set: {worksheet_id: "REC: ws"}
          - set: {data_mode: "gl"}
          - set: {general_ledger_id: "REC: gl"}
          - set: {subledger_id: "REC: sl"}
          - assert:
              general_ledger_id:
                type: "value"
                operator: "is_truthy"
              subledger_id:
                type: "value"
                operator: "is_truthy"
          - set: {data_mode: "subledger"}
          - assert:
              general_ledger_id:
                type: "value"
                operator: "is_falsy"
              subledger_id:
                type: "value"
                operator: "is_falsy"
