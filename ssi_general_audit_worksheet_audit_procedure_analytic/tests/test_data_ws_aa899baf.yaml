        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_gl.id"

      # Asserting directly on the live (unsaved) Form object trips a
      # library/Form interaction bug (`hasattr(form, "__len__")` raises
      # AssertionError instead of returning False), so save the form
      # first and assert on the resulting record instead. name and
      # value_col_number (no default) are filled so the save succeeds.
      - step: "Set data_mode to gl with general_ledger_id, then switch to subledger"
        action: "form"
        model: "general_audit_ws_aa899baf.variable"
        save_as: "onchange_variable"
        as_user: "base.user_admin"
        ops:
          - set:
              worksheet_id: "REC: worksheet"
          - set:
              name: "Onchange Test Variable"
          - set:
              value_col_number: 1
          - set:
              data_mode: "gl"
          - set:
              general_ledger_id: "REC: ws_gl"
          - set:
              data_mode: "subledger"
        save: true

      - step: "Assert general_ledger_id was cleared by the onchange"
        action: "assert"
        target: "onchange_variable"
        asserts:
          general_ledger_id:
            type: "value"
            operator: "is_falsy"

