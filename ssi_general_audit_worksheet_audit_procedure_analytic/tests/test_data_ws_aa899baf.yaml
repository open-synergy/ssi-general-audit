  # ------------------------------------------------------------------
  # Workflow draft -> open -> confirm -> done
  # ------------------------------------------------------------------
  - name: "WS-AA899BAF - Workflow draft to done"
    steps:
      - step: "Create worksheet aa899baf"
        action: "create"
        model: "general_audit_ws_aa899baf"
        save_as: "ws"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "ws"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "ws"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "ws"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create conclusion for this worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "No exception noted"
          code: "/"
          type_id: "REC: ws_type.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "ws"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Plausible relationship analysis raised no exception."

      - step: "Confirm worksheet"
        action: "call"
        target: "ws"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "ws"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "ws"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "ws"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "ws"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "ws"
        asserts:
          state:
            type: "value"
            expected: "done"

