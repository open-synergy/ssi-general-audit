  # ------------------------------------------------------------------
  # Onchange general_audit_id clears account_type_id / ws_e51bb1c_id
  # ------------------------------------------------------------------
  - name:
      "Worksheet aa899baf - Onchange general_audit_id clears account_type_id and
      ws_e51bb1c_id"
    steps:
      - step: "Create worksheet aa899baf"
        action: "create"
        model: "general_audit_ws_aa899baf"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Seed account_type_id and ws_e51bb1c_id directly (bypassing UI readonly)"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          account_type_id: "REC: account_type.id"
          ws_e51bb1c_id: "REC: ws_e51bb1c.id"

      # NOTE ON TEST METHOD: this onchange cannot be exercised through
      # `action: form` (the documented way to test onchange) at all.
      # account_type_id / ws_e51bb1c_id are only NOT readonly while
      # state == "open"; general_audit_id is only NOT readonly while
      # state == "draft" -- the two conditions never overlap on the same
      # record. Confirmed empirically: driving this via `action: form`
      # (set general_audit_id in a draft-state Form, then save) leaves
      # account_type_id/ws_e51bb1c_id unchanged in the saved record,
      # because Form.save() explicitly "does not save readonly fields"
      # (see the docstring of Form.save in odoo/tests/common.py) -- the
      # onchange's in-memory clearing is silently discarded on save
      # whenever general_audit_id is actually editable. This means the
      # onchange can never have an observable effect through the real
      # UI/Form flow -- see the final report for this production finding.
      # The methods are called directly here instead, to at least verify
      # their own body does what it claims.
      - step: "Call onchange_account_type_id directly"
        action: "call"
        target: "worksheet"
        method: "onchange_account_type_id"
        as_user: "base.user_admin"

      - step: "Call onchange_ws_e51bb1c_id directly"
        action: "call"
        target: "worksheet"
        method: "onchange_ws_e51bb1c_id"
        as_user: "base.user_admin"

      - step: "Assert account_type_id and ws_e51bb1c_id were cleared"
        action: "assert"
        target: "worksheet"
        asserts:
          account_type_id:
            type: "value"
            operator: "is_falsy"
          ws_e51bb1c_id:
            type: "value"
            operator: "is_falsy"

