scenarios:
  # ------------------------------------------------------------------
  # Installed data - worksheet_type_ae48e68.standard_item_ids
  # ------------------------------------------------------------------
  - name:
      "Worksheet type AE48E68 (External Communication) - standard_item_ids installed
      data"
    steps:
      - step: "Get worksheet type AE48E68"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_external_communication.worksheet_type_ae48e68"
        save_as: "type_ae48e68"

      - step: "Assert standard_item_ids is exactly ISA 240, ISA 260, ISA 265, ISA 450"
        action: "assert"
        target: "type_ae48e68"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_5_0f238e08"
              - "ssi_general_audit.general_audit_standard_audit_7_6a0ce80e"
              - "ssi_general_audit.general_audit_standard_audit_8_7b4a749d"
              - "ssi_general_audit.general_audit_standard_audit_15_591f4528"

      - step:
          "Verify unrelated audit standards (ISA 300, ISA 610) are not linked to AE48E68"
        action: "search"
        model: "general_audit_worksheet_type"
        domain:
          [
            ["id", "=", "REC: type_ae48e68.id"],
            ["standard_item_ids.code", "in", ["ISA 300", "ISA 610"]],
          ]
        save_as: "unrelated_standard_link_ae48e68"
        expect_count: 0

