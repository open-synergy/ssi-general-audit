  - name: "Worksheet cda3a68 - cascade delete of detail on unlink"
    steps:
      - step: "Create category for cascade test"
        action: "create"
        model: "general_audit_ws_cda3a68.category"
        save_as: "category"
        values:
          name: "Cascade Test Category"
          code: "/"

      - step: "Create factor E"
        action: "create"
        model: "general_audit_ws_cda3a68.factor"
        save_as: "factor_e"
        values:
          name: "Cascade Test Factor E"
          category_id: "REC: category.id"
          sequence: 10

      - step: "Create worksheet cda3a68"
        action: "create"
        model: "general_audit_ws_cda3a68"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

