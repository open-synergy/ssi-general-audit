        target: "worksheet"
        as_user: "base.user_admin"
        values:
          control_deficiency_identified: "yes"
          significant_deficiency_identified: "no"

      - step: "Assert deficiency field values"
        action: "assert"
        target: "worksheet"
        asserts:
          control_deficiency_identified:
            type: "value"
            expected: "yes"
          significant_deficiency_identified:
            type: "value"
            expected: "no"

  # ------------------------------------------------------------------
  # b59b886 - Workflow confirm to done
  # ------------------------------------------------------------------
  - name: "Worksheet b59b886 - Workflow confirm to done"
    steps:
      - step: "Create conclusion for b59b886 worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "Entity level control risk is adequate"
          code: "/"
          type_id: "REC: ws_type_b59b886.id"

      - step: "Create worksheet b59b886"
        action: "create"
        model: "general_audit_ws_b59b886"
        save_as: "worksheet"
        as_user: "base.user_admin"
