      - step: "Create key internal control"
        action: "create"
        model: "general_audit_key_internal_control"
        save_as: "key_control"
        as_user: "base.user_admin"
        values:
          name: "Test Key Internal Control"
          code: "/"
          sequence: 10
          business_cycle_ids: [[6, 0, ["REC: business_cycle.id"]]]
          control_activity_id: "REC: activity.id"
          assersion_type_ids: [[6, 0, ["REC: assersion_type.id"]]]

      - step: "Assert key internal control created"
        action: "assert"
        target: "key_control"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          control_activity_id:
            type: "m2o"
            expected: "REC: activity"
          business_cycle_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: business_cycle"
          assersion_type_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: assersion_type"

      - step: "Assert inherited reverse m2m on client_business_process"
        action: "assert"
        target: "business_cycle"
        refresh: true
        asserts:
          key_internal_control_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: key_control"

      - step: "Write new sequence"
        action: "write"
        target: "key_control"
        as_user: "base.user_admin"
        values:
          sequence: 20

      - step: "Assert sequence updated"
        action: "assert"
