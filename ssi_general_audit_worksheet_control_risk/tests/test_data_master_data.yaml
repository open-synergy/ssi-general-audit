scenarios:
  # ------------------------------------------------------------------
  # general_audit_general_control_category - CRUD
  # ------------------------------------------------------------------
  - name: "General Control Category - Create, write, delete"
    steps:
      - step: "Create general control category"
        action: "create"
        model: "general_audit_general_control_category"
        save_as: "category"
        as_user: "base.user_admin"
        values:
          name: "Test General Control Category"
          code: "/"
          sequence: 10

      - step: "Assert general control category created"
        action: "assert"
        target: "category"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test General Control Category"

      - step: "Write new name"
        action: "write"
        target: "category"
        as_user: "base.user_admin"
        values:
          name: "Updated General Control Category"

      - step: "Assert name updated"
        action: "assert"
        target: "category"
        asserts:
          name:
            type: "value"
            expected: "Updated General Control Category"

      - step: "Delete general control category"
        action: "unlink"
        target: "category"
        as_user: "base.user_admin"

      - step: "Verify general control category deleted"
        action: "search"
        model: "general_audit_general_control_category"
        domain:
          - ["id", "=", "REC: category.id"]
        save_as: "result"
        expect_count: 0

