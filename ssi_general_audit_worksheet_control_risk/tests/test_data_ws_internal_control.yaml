      - step: "Fetch the detail line not relying on the control (result should be high)"
        action: "search"
        model: "general_audit_ws_ba9b2f0.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["rely_on_control", "=", "no"]
        save_as: "detail_high"
