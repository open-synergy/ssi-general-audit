      - step: "Create worksheet ba9b2f0 with the unmatched account type"
        action: "create"
        model: "general_audit_ws_ba9b2f0"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
