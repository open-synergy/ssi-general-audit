  # ------------------------------------------------------------------
  # ba9b2f0 - Compute standard_detail_id (kosong)
  # ------------------------------------------------------------------
  - name: "Worksheet ba9b2f0 - Compute standard_detail_id (kosong)"
    steps:
      - step: "Create a second account type with no matching standard_detail"
