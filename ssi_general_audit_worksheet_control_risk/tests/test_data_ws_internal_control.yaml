setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - Internal Control"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - Internal Control"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-INTCTRL-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - Internal Control"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - Internal Control"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - Internal Control"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2024-01-01
        date_end: 2024-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type eabdaad"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_control_risk.worksheet_type_eabdaad"
      save_as: "ws_type_eabdaad"

    - step: "Get worksheet type ba9b2f0"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_control_risk.worksheet_type_ba9b2f0"
      save_as: "ws_type_ba9b2f0"

    - step: "Create control activity"
      action: "create"
      model: "general_audit_control_activity"
      save_as: "activity"
      as_user: "base.user_admin"
      values:
        name: "Test Control Activity - Internal Control"
        code: "/"

    - step: "Create assersion type"
      action: "create"
      model: "general_audit_assersion_type"
      save_as: "assersion_type"
      as_user: "base.user_admin"
      values:
        name: "Test Assersion Type - Internal Control"
        code: "/"

    - step: "Create business cycle"
      action: "create"
      model: "client_business_process"
      save_as: "business_cycle"
      as_user: "base.user_admin"
      values:
        name: "Test Business Cycle - Internal Control"
        code: "/"

    - step: "Create account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - Internal Control"
        code: "/"

    - step: "Create account type (used with standard_detail, so use a safe python_code)"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - Internal Control"
        code: "/"
        group_id: "REC: account_group.id"
        python_code: "result = 0.0"

    - step: "Create standard detail matching the account type for this audit"
      action: "create"
      model: "general_audit.standard_detail"
      save_as: "standard_detail"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: account_type.id"

    - step: "Create business cycle key internal control"
      action: "create"
      model: "general_audit_key_internal_control"
      save_as: "key_internal_control"
      as_user: "base.user_admin"
      values:
        name: "Test Key Internal Control - Internal Control"
        code: "/"
        business_cycle_ids: [[6, 0, ["REC: business_cycle.id"]]]
        control_activity_id: "REC: activity.id"
        assersion_type_ids: [[6, 0, ["REC: assersion_type.id"]]]

    - step: "Create significant account key internal control"
      action: "create"
      model: "general_audit_account_key_internal_control"
      save_as: "account_key_internal_control"
      as_user: "base.user_admin"
      values:
        name: "Test Account Key Internal Control - Internal Control"
        code: "/"
        account_type_ids: [[6, 0, ["REC: account_type.id"]]]
        control_activity_id: "REC: activity.id"
        assersion_type_id_ids: [[6, 0, ["REC: assersion_type.id"]]]

scenarios:
  # ------------------------------------------------------------------
  # eabdaad - Create with detail_ids inline (O2M) + compute result
  # (normal) & standard_detail_ids (normal)
  # ------------------------------------------------------------------
  - name:
      "Worksheet eabdaad - Create with inline details + compute
      result/standard_detail_ids (normal)"
    steps:
      - step: "Create worksheet eabdaad with 2 inline detail lines"
        action: "create"
        model: "general_audit_ws_eabdaad"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_eabdaad.id"
          business_cycle_id: "REC: business_cycle.id"
          detail_ids:
            - - 0
              - 0
              - key_internal_control_id: "REC: key_internal_control.id"
                name: "Monthly reconciliation review"
                frequency: "Monthly"
                related_account_type_ids: [[6, 0, ["REC: account_type.id"]]]
                rely_on_control: "yes"
                toc_analysis: "effective"
                risk_identification_ids:
                  - - 0
                    - 0
                    - name: "Risk of unreconciled balances"
                what_can_go_wrong_ids:
                  - - 0
                    - 0
                    - name: "Reconciliation not performed timely"
            - - 0
              - 0
              - key_internal_control_id: "REC: key_internal_control.id"
                name: "Segregation of duties review"
                frequency: "Weekly"
                related_account_type_ids: [[6, 0, ["REC: account_type.id"]]]
                rely_on_control: "no"
                toc_analysis: "not_effective"

      - step: "Assert 2 detail lines were created"
        action: "assert"
        target: "worksheet"
        asserts:
          detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Fetch the detail line relying on the control (result should be low)"
        action: "search"
        model: "general_audit_ws_eabdaad.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["rely_on_control", "=", "yes"]
        save_as: "detail_low"
        limit: 1
        expect_count: 1

      - step: "Assert result is low and standard_detail_ids matches the fixture"
        action: "assert"
        target: "detail_low"
        asserts:
          result:
            type: "value"
            expected: "low"
          standard_detail_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: standard_detail"

      - step: "Fetch the detail line not relying on the control (result should be high)"
        action: "search"
        model: "general_audit_ws_eabdaad.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["rely_on_control", "=", "no"]
        save_as: "detail_high"
        limit: 1
        expect_count: 1

      - step: "Assert result is high"
        action: "assert"
        target: "detail_high"
        asserts:
          result:
            type: "value"
            expected: "high"

  # ------------------------------------------------------------------
  # eabdaad - Compute standard_detail_ids (kosong)
  # ------------------------------------------------------------------
  - name: "Worksheet eabdaad - Compute standard_detail_ids (kosong)"
    steps:
      - step: "Create a second account type with no matching standard_detail"
        action: "create"
        model: "client_account_type"
        save_as: "account_type_no_std"
        as_user: "base.user_admin"
        values:
          name: "Test Account Type No Standard Detail - eabdaad"
          code: "/"
          group_id: "REC: account_group.id"

      - step:
          "Create worksheet eabdaad with a detail referencing the unmatched account type"
        action: "create"
        model: "general_audit_ws_eabdaad"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_eabdaad.id"
          business_cycle_id: "REC: business_cycle.id"
          detail_ids:
            - - 0
              - 0
              - key_internal_control_id: "REC: key_internal_control.id"
                name: "Control with no matching standard detail"
                frequency: "Monthly"
                related_account_type_ids: [[6, 0, ["REC: account_type_no_std.id"]]]
                rely_on_control: "no"
                toc_analysis: "na"

      - step: "Fetch the detail line"
        action: "search"
        model: "general_audit_ws_eabdaad.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "detail"
        limit: 1
        expect_count: 1

      - step: "Assert standard_detail_ids is empty"
        action: "assert"
        target: "detail"
        asserts:
          standard_detail_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # ba9b2f0 - Create with detail_ids inline (O2M) + compute result
  # (normal) & standard_detail_id (normal)
  # ------------------------------------------------------------------
  - name:
      "Worksheet ba9b2f0 - Create with inline details + compute
      result/standard_detail_id (normal)"
    steps:
      - step: "Create worksheet ba9b2f0 with 2 inline detail lines"
        action: "create"
