          detail_ids:
            - - 0
              - 0
              - key_internal_control_id: "REC: account_key_internal_control.id"
                name: "Revenue cut-off control review"
                frequency: "Monthly"
                rely_on_control: "yes"
                toc_analysis: "effective"
                risk_identification_ids:
                  - - 0
                    - 0
                    - name: "Risk of revenue cut-off error"
                what_can_go_wrong_ids:
