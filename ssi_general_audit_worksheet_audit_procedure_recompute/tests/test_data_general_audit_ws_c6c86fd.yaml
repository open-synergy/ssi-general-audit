            operator: "is_truthy"

      - step: "Switch data_mode away from subledger via Form"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {data_mode: "gl"}

      - step: "Assert subledger_id was cleared by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          subledger_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # Onchange data_source clears sample_determination_id set while
  # data_source was population
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Onchange data_source clears sample_determination_id"
    steps:
      - step: "Create GL available to this general_audit"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_onchange_sd"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"

      - step: "Create Sample Determination worksheet matching that GL"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sd_onchange"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl_onchange_sd.id"

      - step: "Create worksheet c6c86fd"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet (data_mode/sample_determination_id become editable)"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step:
          "Set data_mode=gl + general_ledger_id (data_source stays the default
          population), pick sample_determination_id, then switch data_source to sample"
        action: "form"
        target: "worksheet"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {data_mode: "gl"}
          - set: {general_ledger_id: "REC: gl_onchange_sd"}
          - set: {sample_determination_id: "REC: sd_onchange"}
          - set: {data_source: "sample"}

      - step: "Assert sample_determination_id was cleared by the onchange"
        action: "assert"
        target: "worksheet"
        asserts:
          sample_determination_id:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # _compute_allowed_sample_determination_ids - scoped by
  # general_ledger_id/subledger_id (not general_audit_id, and NOT
  # account_id/account_type_id -- general_audit_ws_a916660 has no
  # account-scoping fields to filter on)
  # ------------------------------------------------------------------
  - name:
      "Worksheet c6c86fd - allowed_sample_determination_ids includes only the matching
      general_ledger_id (positive)"
    steps:
      - step: "Create GL that the worksheet and the Sample Determination share"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_scope_match"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"

      - step: "Create Sample Determination worksheet sourced from that GL"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sd_scope_match"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl_scope_match.id"

      - step: "Create worksheet c6c86fd pointing at the same GL"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl_scope_match.id"

      - step:
          "Assert allowed_sample_determination_ids contains exactly the matching-GL
          Sample Determination"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_sample_determination_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: sd_scope_match"

  # ------------------------------------------------------------------
  # allowed_sample_determination_ids excludes a Sample Determination
  # whose general_ledger_id differs from the one selected here (negative)
  # ------------------------------------------------------------------
  - name:
      "Worksheet c6c86fd - allowed_sample_determination_ids kosong (general_ledger_id
      berbeda)"
    steps:
      - step: "Create GL A (selected on this worksheet)"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_a"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          title: "GL A"

      - step: "Create GL B (used by the Sample Determination instead)"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_b"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          title: "GL B"

      - step: "Create Sample Determination worksheet sourced from GL B"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sd_other_gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl_b.id"

      - step: "Create worksheet c6c86fd pointing at GL A instead"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl_a.id"

      - step:
          "Assert allowed_sample_determination_ids excludes the Sample Determination
          sourced from GL B -- this is the domain
          ([('id','in',allowed_sample_determination_ids)]) that the form view uses to
          restrict the picker; the odoo.tests.common.Form API does not itself enforce
          m2o domains (only readonly/type), so the restriction is verified at its actual
          source: the computed field"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_sample_determination_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # Delete in draft
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Delete in draft"
    steps:
      - step: "Create worksheet c6c86fd"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Delete the worksheet"
        action: "unlink"
        target: "worksheet"

      - step: "Verify worksheet deleted"
        action: "search"
        model: "general_audit_ws_c6c86fd"
        domain:
          - ["id", "=", "REC: worksheet.id"]
        save_as: "result"
        expect_count: 0
