setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - C6C86FD"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - C6C86FD"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-C6C86FD-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - C6C86FD"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - C6C86FD"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - C6C86FD"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Get worksheet type c6c86fd"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_audit_procedure_recompute.worksheet_type_c6c86fd"
      save_as: "ws_type"

    - step: "Get worksheet type e51bb1c"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_lead_schedule.worksheet_type_e51bb1c"
      save_as: "ws_type_e51bb1c"

    - step: "Get worksheet type d209914 (General Ledger)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_client_package.worksheet_type_d209914"
      save_as: "ws_type_d209914"

    - step: "Get worksheet type b5e3d9f (Subledger)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_client_package.worksheet_type_b5e3d9f"
      save_as: "ws_type_b5e3d9f"

    - step: "Get worksheet type a916660 (Sample Determination)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_sample_determination.worksheet_type_a916660"
      save_as: "ws_type_a916660"

    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - C6C86FD"
        code: "/"

    - step: "Create client account type"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - C6C86FD"
        code: "/"
        group_id: "REC: account_group.id"
        # general_audit.standard_detail (created below to feed
        # general_audit.account_type_ids) has no "balance" field, unlike
        # client_trial_balance.standard_detail which the field's own
        # default python_code ("result = document.balance") is written
        # for. Use a safe no-op instead to avoid an unrelated crash in
        # general_audit.standard_detail._compute_extrapolation_balance.
        python_code: "result = 0.0"

    - step: "Create a second client account type (for onchange re-trigger)"
      action: "create"
      model: "client_account_type"
      save_as: "account_type_2"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type 2 - C6C86FD"
        code: "/"
        group_id: "REC: account_group.id"
        # Same safe no-op as "account_type" above -- avoids the same
        # general_audit.standard_detail._compute_extrapolation_balance crash.
        python_code: "result = 0.0"

    - step: "Add account_type to the audit's standard detail (feeds account_type_ids)"
      action: "create"
      model: "general_audit.standard_detail"
      save_as: "standard_detail"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: account_type.id"

    - step: "Add account_type_2 to the audit's standard detail as well"
      action: "create"
      model: "general_audit.standard_detail"
      save_as: "standard_detail_2"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: account_type_2.id"

    - step: "Create a client account"
      action: "create"
      model: "client_account"
      save_as: "account"
      as_user: "base.user_admin"
      values:
        name: "Test Client Account - C6C86FD"
        code: "/"
        partner_id: "REC: client.id"
        type_id: "REC: account_type.id"

    - step: "Add the client account to the audit's detail (feeds account_ids)"
      action: "create"
      model: "general_audit.detail"
      save_as: "audit_detail"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        account_id: "REC: account.id"

    - step: "Create assertion type"
      action: "create"
      model: "general_audit_assersion_type"
      save_as: "assertion_type"
      as_user: "base.user_admin"
      values:
        name: "Existence"
        code: "/"

    - step: "Create audit procedure category (performed)"
      action: "create"
      model: "general_audit_audit_procedure_category"
      save_as: "category_performed"
      as_user: "base.user_admin"
      values:
        name: "Recompute - Performed Category"
        code: "/"
        account_type_id: "REC: account_type.id"
        assertion_type_ids:
          - - 6
            - 0
            - - "REC: assertion_type.id"

    - step: "Create WS-E51BB1C worksheet (Key Audit Procedures)"
      action: "create"
      model: "general_audit_ws_e51bb1c"
      save_as: "ws_e51bb1c"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: ws_type_e51bb1c.id"

    - step: "Create WS-E51BB1C detail with status performed"
      action: "create"
      model: "general_audit_ws_e51bb1c.detail"
      save_as: "detail_performed"
      as_user: "base.user_admin"
      values:
        worksheet_id: "REC: ws_e51bb1c.id"
        audit_procedure_category_id: "REC: category_performed.id"
        assertion_type_ids:
          - - 6
            - 0
            - - "REC: assertion_type.id"
        status: "performed"

    - step: "Create conclusion for c6c86fd worksheet type"
      action: "create"
      model: "general_audit_worksheet_conclusion"
      save_as: "conclusion"
      as_user: "base.user_admin"
      values:
        name: "No exception noted"
        code: "/"
        type_id: "REC: ws_type.id"

scenarios:
  # ------------------------------------------------------------------
  # Worksheet type c6c86fd - sequence aligned with AURA_SWR (BL-0320)
  # ------------------------------------------------------------------
  - name: "Worksheet type c6c86fd - sequence aligned with AURA_SWR"
    steps:
      - step: "Assert worksheet type sequence matches AURA_SWR reference"
        action: "assert"
        target: "ws_type"
        asserts:
          sequence:
            type: "value"
            expected: 475

  # ------------------------------------------------------------------
  # general_audit_ws_c6c86fd - Create in draft
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Create in draft"
    steps:
      - step: "Create worksheet c6c86fd"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          tolerable_amount: 0.0

      - step: "Assert worksheet created in draft with default separators"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          thousand_separator:
            type: "value"
            expected: ","
          decimal_separator:
            type: "value"
            expected: "."
          general_audit_id:
            type: "m2o"
            expected: "REC: audit"
          type_id:
            type: "m2o"
            expected: "REC: ws_type"

  # ------------------------------------------------------------------
  # Workflow draft -> open -> confirm -> done
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Workflow confirm to done"
    steps:
      - step: "Create worksheet c6c86fd"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
          conclusion: "Recomputation raised no exception."

      - step: "Confirm worksheet"
        action: "call"
        target: "worksheet"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirming worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet confirmed"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve worksheet"
        action: "call"
        target: "worksheet"
        method: "action_approve_approval"
        as_user: "base.user_admin"

      - step: "Invalidate cache after approving worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet done"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "done"

  # ------------------------------------------------------------------
  # Cancel and restart
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Cancel and restart"
    steps:
      - step: "Create worksheet c6c86fd"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Cancel worksheet"
        action: "call"
        target: "worksheet"
        method: "action_cancel"
        as_user: "base.user_admin"

      - step: "Invalidate cache after cancelling worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet cancelled"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart worksheet"
        action: "call"
        target: "worksheet"
        method: "action_restart"
        as_user: "base.user_admin"

      - step: "Invalidate cache after restarting worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet back to draft"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "draft"

  # ------------------------------------------------------------------
  # _compute_raw_data / _compute_raw_data_title - data_mode = gl
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Compute raw_data (data_mode = gl)"
    steps:
      - step: "Create General Ledger worksheet with raw data"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          raw_data: "Ref,Base,Rate\nR1,1000,10\nR2,2000,10\n"
          title: "GL Kas"

      - step: "Create worksheet c6c86fd pointing at the GL"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl.id"

      - step: "Assert raw_data / raw_data_title come from the GL"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            expected: "Ref,Base,Rate\nR1,1000,10\nR2,2000,10\n"
          raw_data_title:
            type: "value"
            expected: "GL Kas"

  # ------------------------------------------------------------------
  # _compute_raw_data / _compute_raw_data_title - data_mode = subledger
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Compute raw_data (data_mode = subledger)"
    steps:
      - step: "Create Subledger worksheet with raw data"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "sl"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_b5e3d9f.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          raw_data: "Ref,Amount\nR1,500\nR2,700\n"
          title: "Subledger AR"

      - step: "Create worksheet c6c86fd pointing at the Subledger"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "subledger"
          subledger_id: "REC: sl.id"

      - step: "Assert raw_data / raw_data_title come from the Subledger"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            expected: "Ref,Amount\nR1,500\nR2,700\n"
          raw_data_title:
            type: "value"
            expected: "Subledger AR"

  # ------------------------------------------------------------------
  # _compute_raw_data / _compute_raw_data_title - data_source = sample
  # (data_mode = gl, sample_determination_id matches the same GL)
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Compute raw_data (data_source = sample)"
    steps:
      - step: "Create a General Ledger to back the Sample Determination worksheet"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_for_sd"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"
          raw_data: "Ref,Amount\nR1,1000\nR2,2000\n"

      - step: "Create Sample Determination worksheet sourced from that GL"
        action: "create"
        model: "general_audit_ws_a916660"
        save_as: "sample_determination"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_a916660.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl_for_sd.id"

      - step:
          "Create worksheet c6c86fd with data_mode=gl (same GL as the Sample
          Determination) and data_source=sample sourced from it"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          data_mode: "gl"
          general_ledger_id: "REC: gl_for_sd.id"
          data_source: "sample"
          sample_determination_id: "REC: sample_determination.id"

      - step: "Assert raw_data / raw_data_title come from the Sample Determination"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            expected: "Ref,Amount\nR1,1000\nR2,2000\n"
          raw_data_title:
            type: "value"
            expected: "Test General Audit - C6C86FD"

  # ------------------------------------------------------------------
  # _compute_raw_data / _compute_raw_data_title - empty
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Compute raw_data (kosong)"
    steps:
      - step: "Create worksheet c6c86fd without data_mode"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Assert raw_data / raw_data_title are empty"
        action: "assert"
        target: "worksheet"
        asserts:
          raw_data:
            type: "value"
            operator: "is_falsy"
          raw_data_title:
            type: "value"
            operator: "is_falsy"

  # ------------------------------------------------------------------
  # _compute_allowed_general_ledger_ids - standard_account branch
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Compute allowed_general_ledger_ids (standard_account)"
    steps:
      - step: "Create GL in standard_account mode"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_standard"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"

      - step: "Create GL in account mode"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_account"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "account"
          account_id: "REC: account.id"

      - step: "Create worksheet c6c86fd with account_type_id only (no account_id)"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_type_id: "REC: account_type.id"

      - step: "Assert allowed_general_ledger_ids contains only the standard_account GL"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_general_ledger_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: gl_standard"

  # ------------------------------------------------------------------
  # _compute_allowed_general_ledger_ids - account branch
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Compute allowed_general_ledger_ids (account)"
    steps:
      - step: "Create GL in standard_account mode"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_standard"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"

      - step: "Create GL in account mode"
        action: "create"
        model: "general_audit_ws_d209914"
        save_as: "gl_account"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_d209914.id"
          account_mode: "account"
          account_id: "REC: account.id"

      - step:
          "Create worksheet c6c86fd with account_id (overrides account_type_id branch)"
        action: "create"
        model: "general_audit_ws_c6c86fd"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"
          account_id: "REC: account.id"

      - step:
          "Assert allowed_general_ledger_ids contains only the account-mode GL
          (standard_account GL excluded)"
        action: "assert"
        target: "worksheet"
        asserts:
          allowed_general_ledger_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: gl_account"

  # ------------------------------------------------------------------
  # _compute_allowed_subledger_ids - standard_account branch
  # ------------------------------------------------------------------
  - name: "Worksheet c6c86fd - Compute allowed_subledger_ids (standard_account)"
    steps:
      - step: "Create Subledger in standard_account mode"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "sl_standard"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_b5e3d9f.id"
          account_mode: "standard_account"
          account_type_id: "REC: account_type.id"

      - step: "Create Subledger in account mode"
        action: "create"
        model: "general_audit_ws_b5e3d9f"
        save_as: "sl_account"
