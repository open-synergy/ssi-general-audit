  # ------------------------------------------------------------------
  # Compute standard_item_ids - normal and empty (mixin behaviour,
  # represented via general_audit_ws_a8c54f3 - identical across the
  # three worksheet models since it comes from the shared mixin)
  # ------------------------------------------------------------------
  - name: "Compute standard_item_ids - normal and empty"
    steps:
      - step: "Create audit standard item"
        action: "create"
        model: "general_audit_standard_audit"
        save_as: "standard_item"
        as_user: "base.user_admin"
        values:
          name: "ISA 700 - Forming an Opinion"
          code: "/"

      - step: "Create worksheet type with standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_with_item"
        as_user: "base.user_admin"
        values:
          name: "Final Report - Custom Type With Standard Item"
          code: "/"
          model_name: "general_audit_ws_a8c54f3"
          standard_item_ids: [[6, 0, ["REC: standard_item.id"]]]

      - step: "Create worksheet type without standard item"
        action: "create"
        model: "general_audit_worksheet_type"
        save_as: "type_without_item"
        as_user: "base.user_admin"
        values:
          name: "Final Report - Custom Type Without Standard Item"
          code: "/"
          model_name: "general_audit_ws_a8c54f3"

      - step: "Create worksheet using type with standard item"
        action: "create"
        model: "general_audit_ws_a8c54f3"
        save_as: "worksheet_with_item"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_with_item.id"

      - step: "Assert standard_item_ids computed with the linked item"
        action: "assert"
        target: "worksheet_with_item"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: standard_item"

      - step: "Create worksheet using type without standard item"
        action: "create"
        model: "general_audit_ws_a8c54f3"
        save_as: "worksheet_without_item"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: type_without_item.id"

      - step: "Assert standard_item_ids computed empty"
        action: "assert"
        target: "worksheet_without_item"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # Compute allowed_conclusion_ids - normal and empty (mixin behaviour,
  # represented via general_audit_ws_a8c54f3)
  # ------------------------------------------------------------------
  - name: "Compute allowed_conclusion_ids - normal and empty"
