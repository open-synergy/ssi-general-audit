setup:
  steps:
    - step: "Get config parameter model"
      action: "search"
      model: "ir.config_parameter"
      domain: []
      save_as: "config_parameter"
      limit: 1

    - step: "Allow enough CPA licenses for this scenario"
      action: "call"
      target: "config_parameter"
      method: "set_param"
      args:
        - "ssi_general_audit.max_number_of_cpa_license"
        - "100"

    - step: "Create client partner"
      action: "create"
      model: "res.partner"
      save_as: "client"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Client - F9A2C3D"
        is_company: true

    - step: "Create accountant partner"
      action: "create"
      model: "res.partner"
      save_as: "accountant"
      as_user: "base.user_admin"
      values:
        name: "Test Audit Accountant - F9A2C3D"

    - step: "Get CPA license id category"
      action: "ref"
      xml_id: "ssi_partner_identification_cpa_license.partner_identification_accountant_cpa_license"
      save_as: "cpa_category"

    - step: "Grant accountant a CPA license"
      action: "create"
      model: "res.partner.id_number"
      save_as: "cpa_license"
      as_user: "base.user_admin"
      values:
        partner_id: "REC: accountant.id"
        category_id: "REC: cpa_category.id"
        name: "CPA-F9A2C3D-0001"

    - step: "Create account type set"
      action: "create"
      model: "client_account_type_set"
      save_as: "account_type_set"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type Set - F9A2C3D"
        code: "/"

    - step: "Create financial accounting standard"
      action: "create"
      model: "accountant.financial_accounting_standard"
      save_as: "standard"
      as_user: "base.user_admin"
      values:
        name: "Test Financial Accounting Standard - F9A2C3D"
        code: "/"

    - step: "Create general audit"
      action: "create"
      model: "general_audit"
      save_as: "audit"
      as_user: "base.user_admin"
      values:
        title: "Test General Audit - F9A2C3D"
        partner_id: "REC: client.id"
        accountant_id: "REC: accountant.id"
        account_type_set_id: "REC: account_type_set.id"
        financial_accounting_standard_id: "REC: standard.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        need_interim: false
        need_previous: false
        num_of_consecutive_audit_firm: 1
        num_of_consecutive_audit_accountant: 1

    - step: "Open general audit"
      action: "call"
      target: "audit"
      method: "action_open"
      as_user: "base.user_admin"

    - step: "Invalidate cache after opening general audit"
      action: "call"
      target: "audit"
      method: "invalidate_cache"

    - step: "Assert general audit open"
      action: "assert"
      target: "audit"
      asserts:
        state:
          type: "value"
          expected: "open"

    - step: "Get worksheet type f9a2c3d"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_test_planning.worksheet_type_f9a2c3d"
      save_as: "ws_type_f9a2c3d"

    - step: "Get worksheet type d9d2b44 (Preliminary Materiality)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.worksheet_type_d9d2b44"
      save_as: "ws_type_d9d2b44"

    - step: "Get worksheet type 6dcda0e (Specific Materiality)"
      action: "ref"
      xml_id: "ssi_general_audit_worksheet_preliminary_materiality.worksheet_type_6dcda0e"
      save_as: "ws_type_6dcda0e"

    - step: "Create client account group"
      action: "create"
      model: "client_account_group"
      save_as: "account_group"
      as_user: "base.user_admin"
      values:
        name: "Test Account Group - F9A2C3D"
        code: "/"

    - step: "Create client account type (debit-normal)"
      action: "create"
      model: "client_account_type"
      save_as: "account_type"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type - F9A2C3D"
        code: "/"
        group_id: "REC: account_group.id"
        normal_balance: "dr"
        # general_audit.standard_detail has no "balance" field, unlike
        # client_trial_balance.standard_detail which the field's own
        # default python_code ("result = document.balance") is written
        # for. Use a safe no-op instead to avoid an unrelated crash in
        # general_audit.standard_detail._compute_extrapolation_balance.
        python_code: "result = 0.0"

    - step: "Create client account for the header trial balance line"
      action: "create"
      model: "client_account"
      save_as: "account_main"
      as_user: "base.user_admin"
      values:
        name: "Test Client Account Main - F9A2C3D"
        code: "ACC-MAIN-F9A2C3D"
        partner_id: "REC: client.id"
        type_id: "REC: account_type.id"

    - step: "Create standard detail for the audit"
      action: "create"
      model: "general_audit.standard_detail"
      save_as: "standard_detail"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: account_type.id"

    - step: "Create home trial balance"
      action: "create"
      model: "client_trial_balance"
      save_as: "tb_home"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        trial_balance_type: "home"

    - step: "Home trial balance line for the main account (debit 10,000.0)"
      action: "create"
      model: "client_trial_balance.detail"
      save_as: "tb_detail_main"
      as_user: "base.user_admin"
      values:
        trial_balance_id: "REC: tb_home.id"
        account_id: "REC: account_main.id"
        debit: 10000.0

    - step:
        "Roll up the home trial balance line into the standard detail's type aggregate"
      action: "create"
      model: "client_trial_balance.standard_detail"
      save_as: "tb_standard_detail"
      as_user: "base.user_admin"
      values:
        trial_balance_id: "REC: tb_home.id"
        standard_detail_id: "REC: standard_detail.id"

    - step:
        "Invalidate cache so standard_detail.audited_balance reflects the new trial
        balance rollup"
      action: "call"
      target: "standard_detail"
      method: "invalidate_cache"

    - step: "Sanity-check the fixture: standard_detail audited_balance is 10,000.0"
      action: "assert"
      target: "standard_detail"
      asserts:
        audited_balance:
          type: "value"
          expected: 10000.0

    - step:
        "Create Preliminary Materiality worksheet (d9d2b44) with performance_materiality
        = 6,000.0"
      action: "create"
      model: "general_audit_ws_d9d2b44"
      save_as: "ws_pm"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: ws_type_d9d2b44.id"
        other_amount_ok: true
        other_base_amount: 120000.0
        base_amount_source: "end_period"
        overall_materiality_percentage: 10.0
        performance_materiality_percentage: 50.0
        tolerable_misstatement_percentage: 10.0

    - step: "Sanity-check the fixture: ws_pm performance_materiality is 6,000.0"
      action: "assert"
      target: "ws_pm"
      asserts:
        performance_materiality:
          type: "value"
          expected: 6000.0

    - step: "Create account type 2 (second standard account)"
      action: "create"
      model: "client_account_type"
      save_as: "account_type_2"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type 2 - F9A2C3D"
        code: "/"
        group_id: "REC: account_group.id"
        normal_balance: "dr"
        python_code: "result = 0.0"

    - step: "Create account type 3 (standard account without mapping line)"
      action: "create"
      model: "client_account_type"
      save_as: "account_type_3"
      as_user: "base.user_admin"
      values:
        name: "Test Account Type 3 - F9A2C3D"
        code: "/"
        group_id: "REC: account_group.id"
        normal_balance: "dr"
        python_code: "result = 0.0"

    - step: "Create standard detail 2 for the audit"
      action: "create"
      model: "general_audit.standard_detail"
      save_as: "standard_detail_2"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: account_type_2.id"

    - step: "Create standard detail 3 for the audit"
      action: "create"
      model: "general_audit.standard_detail"
      save_as: "standard_detail_3"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: account_type_3.id"

    - step: "Create an assertion type"
      action: "create"
      model: "general_audit_assersion_type"
      save_as: "assertion_type"
      as_user: "base.user_admin"
      values:
        name: "Test Assertion - F9A2C3D"
        code: "/"

    - step: "Set ROMM, assertion type and AP result of standard detail 1"
      action: "write"
      target: "standard_detail"
      as_user: "base.user_admin"
      values:
        romm: "high"
        analytical_procedures_cycle_result: "high"
        pr_assersion_type_ids: [[6, 0, ["REC: assertion_type.id"]]]

    - step: "Set the AP result of standard detail 2"
      action: "write"
      target: "standard_detail_2"
      as_user: "base.user_admin"
      values:
        romm: "low"
        analytical_procedures_cycle_result: "moderate"

    - step: "Create Specific Materiality worksheet (6dcda0e), Performance type"
      action: "create"
      model: "general_audit_ws_6dcda0e"
      save_as: "ws_6dcda0e"
      as_user: "base.user_admin"
      values:
        general_audit_id: "REC: audit.id"
        type_id: "REC: ws_type_6dcda0e.id"
        worksheet_d9d2b44_id: "REC: ws_pm.id"
        materiality_type: "pm"

    - step: "Mapping line of standard detail 1 uses specific materiality 99,999.0"
      action: "create"
      model: "general_audit_ws_6dcda0e_materiality_mapping"
      save_as: "mapping_1"
      as_user: "base.user_admin"
      values:
        worksheet_id: "REC: ws_6dcda0e.id"
        standard_detail_id: "REC: standard_detail.id"
        use_specific_materiality: true
        specific_materiality: 99999.0

    - step: "Mapping line of standard detail 2 does not use specific materiality"
      action: "create"
      model: "general_audit_ws_6dcda0e_materiality_mapping"
      save_as: "mapping_2"
      as_user: "base.user_admin"
      values:
        worksheet_id: "REC: ws_6dcda0e.id"
        standard_detail_id: "REC: standard_detail_2.id"
        use_specific_materiality: false

    - step: "Sanity-check the fixture: the base of the 6dcda0e worksheet is 6,000.0"
      action: "assert"
      target: "ws_6dcda0e"
      asserts:
        base:
          type: "value"
          expected: 6000.0

scenarios:
  # ------------------------------------------------------------------
  # 01 - Create
  # ------------------------------------------------------------------
  - name: "01 - Create worksheet f9a2c3d (defaults)"
    steps:
      - step: "Create worksheet f9a2c3d"
        action: "create"
        model: "general_audit_ws_f9a2c3d"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Assert worksheet created in draft without lines"
        action: "assert"
        target: "worksheet"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          detail_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

  # ------------------------------------------------------------------
  # 02 - Detail button: one line per standard account, idempotent
  # ------------------------------------------------------------------
  - name: "02 - Detail creates one line per standard account, twice is the same"
    steps:
      - step: "Create worksheet f9a2c3d"
        action: "create"
        model: "general_audit_ws_f9a2c3d"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Press the Detail button"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Assert one line per standard account of the audit"
        action: "search"
        model: "general_audit_ws_f9a2c3d.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "lines_first"
        expect_count: 3

      - step: "Press the Detail button again"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"

      - step: "Assert the lines were not doubled"
        action: "search"
        model: "general_audit_ws_f9a2c3d.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "lines_second"
        expect_count: 3

  # ------------------------------------------------------------------
  # 03 - Columns 1-6, account with specific materiality
  # ------------------------------------------------------------------
  - name: "03 - Columns of an account that uses specific materiality"
    steps:
      - step: "Create worksheet f9a2c3d"
        action: "create"
        model: "general_audit_ws_f9a2c3d"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Press the Detail button"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"
      - step: "Find the line of standard_detail"
        action: "search"
        model: "general_audit_ws_f9a2c3d.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail.id"]
        save_as: "line_1"
        limit: 1

      - step: "Assert columns 1 to 6 of the line"
        action: "assert"
        target: "line_1"
        asserts:
          type_id:
            type: "m2o"
            expected: "REC: account_type"
          balance:
            type: "value"
            expected: "EVAL: registry['mapping_1'].balance"
          performance_materiality:
            type: "value"
            expected: 99999.0
          romm:
            type: "value"
            expected: "high"
          pr_assersion_type_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: assertion_type"
          ap_result:
            type: "value"
            expected: "high"

  # ------------------------------------------------------------------
  # 04 - Account that does not use specific materiality
  # ------------------------------------------------------------------
  - name: "04 - Performance materiality falls back to the base of 6dcda0e"
    steps:
      - step: "Create worksheet f9a2c3d"
        action: "create"
        model: "general_audit_ws_f9a2c3d"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Press the Detail button"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"
      - step: "Find the line of standard_detail_2"
        action: "search"
        model: "general_audit_ws_f9a2c3d.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail_2.id"]
        save_as: "line_2"
        limit: 1

      - step: "Assert performance materiality is the base, AP result moderate"
        action: "assert"
        target: "line_2"
        asserts:
          performance_materiality:
            type: "value"
            expected: 6000.0
          ap_result:
            type: "value"
            expected: "moderate"
          romm:
            type: "value"
            expected: "low"

  # ------------------------------------------------------------------
  # 05 - Negative: account without mapping line and without AP result
  # ------------------------------------------------------------------
  - name: "05 - Account without mapping line and without AP result"
    steps:
      - step: "Create worksheet f9a2c3d"
        action: "create"
        model: "general_audit_ws_f9a2c3d"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Press the Detail button"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"
      - step: "Find the line of standard_detail_3"
        action: "search"
        model: "general_audit_ws_f9a2c3d.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail_3.id"]
        save_as: "line_3"
        limit: 1

      - step: "Assert balance 0.0, base as materiality, AP result none"
        action: "assert"
        target: "line_3"
        asserts:
          balance:
            type: "value"
            expected: 0.0
          performance_materiality:
            type: "value"
            expected: 6000.0
          ap_result:
            type: "value"
            expected: "none"

  # ------------------------------------------------------------------
  # 06 - Columns 7-9 come from master data, technique takes several
  # ------------------------------------------------------------------
  - name: "06 - Timing, extent and techniques are filled from master data"
    steps:
      - step: "Create worksheet f9a2c3d"
        action: "create"
        model: "general_audit_ws_f9a2c3d"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Press the Detail button"
        action: "call"
        target: "worksheet"
        method: "action_load_detail"
        as_user: "base.user_admin"
      - step: "Find the line of standard_detail"
        action: "search"
        model: "general_audit_ws_f9a2c3d.detail"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
          - ["standard_detail_id", "=", "REC: standard_detail.id"]
        save_as: "line_1"
        limit: 1

      - step: "Get the Interim Testing timing"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_test_planning.general_audit_ws_f9a2c3d_timing_1"
        save_as: "timing"

      - step: "Get the Sampling extent"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_test_planning.general_audit_ws_f9a2c3d_extent_2"
        save_as: "extent"

      - step: "Get the Inspection technique"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_test_planning.general_audit_ws_f9a2c3d_technique_1"
        save_as: "technique_1"

      - step: "Get the Observation technique"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_test_planning.general_audit_ws_f9a2c3d_technique_2"
        save_as: "technique_2"

      - step: "Get the Confirmation technique"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_test_planning.general_audit_ws_f9a2c3d_technique_3"
        save_as: "technique_3"

      - step: "Fill timing, extent and three techniques"
        action: "write"
        target: "line_1"
        as_user: "base.user_admin"
        values:
          timing_id: "REC: timing.id"
          extent_id: "REC: extent.id"
          technique_ids:
            - [
                6,
                0,
                ["REC: technique_1.id", "REC: technique_2.id", "REC: technique_3.id"],
              ]

      - step: "Assert the planning columns"
        action: "assert"
        target: "line_1"
        asserts:
          timing_id:
            type: "m2o"
            expected: "REC: timing"
          extent_id:
            type: "m2o"
            expected: "REC: extent"
          technique_ids:
            type: "m2m"
            check: "count"
            expected_count: 3

  # ------------------------------------------------------------------
  # 07 - Seeded master data
  # ------------------------------------------------------------------
  - name: "07 - Master data of timing, extent and technique is seeded"
    steps:
      - step: "Assert three timings"
        action: "search"
        model: "general_audit_ws_f9a2c3d_timing"
        domain: []
        save_as: "timings"
        expect_count: 3

      - step: "Assert two extents"
        action: "search"
        model: "general_audit_ws_f9a2c3d_extent"
        domain: []
        save_as: "extents"
        expect_count: 2

      - step: "Assert seven techniques"
        action: "search"
        model: "general_audit_ws_f9a2c3d_technique"
        domain: []
        save_as: "techniques"
        expect_count: 7

  # ------------------------------------------------------------------
  # 17 - Workflow draft to done
  # ------------------------------------------------------------------
  - name: "17 - Workflow draft to done"
    steps:
      - step: "Create worksheet f9a2c3d"
        action: "create"
        model: "general_audit_ws_f9a2c3d"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Open worksheet"
        action: "call"
        target: "worksheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Invalidate cache after opening worksheet"
        action: "call"
        target: "worksheet"
        method: "invalidate_cache"

      - step: "Assert worksheet open"
        action: "assert"
        target: "worksheet"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create conclusion for f9a2c3d worksheet type"
        action: "create"
        model: "general_audit_worksheet_conclusion"
        save_as: "conclusion"
        as_user: "base.user_admin"
        values:
          name: "Test Planning has been completed"
          code: "/"
          type_id: "REC: ws_type_f9a2c3d.id"

      - step: "Fill required conclusion fields before confirm"
        action: "write"
        target: "worksheet"
        as_user: "base.user_admin"
        values:
          conclusion_id: "REC: conclusion.id"
