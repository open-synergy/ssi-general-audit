scenarios:
  # ------------------------------------------------------------------
  # Installed data - worksheet_type_806c4e1.standard_item_ids
  # ------------------------------------------------------------------
  - name:
      "Worksheet type 806C4E1 (Acceptance and Continuance of Client Relationships
      Analysis) - standard_item_ids installed data"
    steps:
      - step: "Get worksheet type 806C4E1"
        action: "ref"
        xml_id: "ssi_general_audit_worksheet_acceptance_continuance.worksheet_type_806c4e1"
        save_as: "type_806c4e1"

      - step: "Assert standard_item_ids is exactly ISA 210, ISA 220, ISA 300, ISQC 1"
        action: "assert"
        target: "type_806c4e1"
        asserts:
          standard_item_ids:
            type: "m2m"
            check: "exact_xml_ids"
            expected_xml_ids:
              - "ssi_general_audit.general_audit_standard_audit_2_bc892752"
              - "ssi_general_audit.general_audit_standard_audit_3_f4f0eb9d"
              - "ssi_general_audit.general_audit_standard_audit_10_b78a64b0"
              - "ssi_general_audit.general_audit_standard_audit_39_4ec6443c"

      - step:
          "Verify unrelated audit standards (ISA 510, PMK NO.55/PMK.01/2017) from
          sibling records are not linked to 806C4E1"
        action: "search"
        model: "general_audit_worksheet_type"
        domain:
          [
            ["id", "=", "REC: type_806c4e1.id"],
            ["standard_item_ids.code", "in", ["ISA 510", "PMK NO.55/PMK.01/2017"]],
          ]
        save_as: "unrelated_standard_link_806c4e1"
        expect_count: 0

