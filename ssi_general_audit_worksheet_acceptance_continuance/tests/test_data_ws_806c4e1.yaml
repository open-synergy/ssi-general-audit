  # general_audit_ws_806c4e1.checklist - write + cascade delete
  # ------------------------------------------------------------------
  - name: "Worksheet 806c4e1 - Checklist write and cascade delete"
    steps:
      - step: "Create worksheet 806c4e1"
        action: "create"
        model: "general_audit_ws_806c4e1"
        save_as: "worksheet"
        as_user: "base.user_admin"
        values:
          general_audit_id: "REC: audit.id"
          type_id: "REC: ws_type.id"

      - step: "Create item master"
        action: "create"
        model: "general_audit_ws_806c4e1.item"
        save_as: "item_cascade"
        values:
          name: "Cascade Check 806c4e1"
          code: "CASCADE-806C4E1-01"
          option_set_id: "REF: ssi_general_audit.checklist_option_set_2"

      - step: "Create checklist row"
        action: "create"
        model: "general_audit_ws_806c4e1.checklist"
        save_as: "checklist_row"
        values:
          worksheet_id: "REC: worksheet.id"
          item_id: "REC: item_cascade.id"

      - step: "Write checklist_ok on the checklist row"
        action: "write"
        target: "checklist_row"
        values:
          checklist_ok: false

      - step: "Assert checklist_ok value saved"
        action: "assert"
        target: "checklist_row"
        asserts:
          checklist_ok:
            type: "value"
            expected: false

      - step: "Delete the worksheet (still draft)"
        action: "unlink"
        target: "worksheet"

      - step: "Assert checklist row cascaded away"
        action: "search"
        model: "general_audit_ws_806c4e1.checklist"
        domain:
          - ["worksheet_id", "=", "REC: worksheet.id"]
        save_as: "checklist_after_delete"
        expect_count: 0
