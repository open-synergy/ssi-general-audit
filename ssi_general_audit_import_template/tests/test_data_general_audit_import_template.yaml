          model_id.model:
            type: "value"
            expected: "client_trial_balance"
          has_header:
            type: "value"
            expected: true
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 6
          server_action_id:
            type: "value"
            operator: "is_truthy"
          server_action_id.binding_model_id.model:
            type: "value"
            expected: "client_trial_balance"
          server_action_id.model_id.model:
            type: "value"
            expected: "client_trial_balance"
          server_action_id.binding_type:
            type: "value"
            expected: "action"
          server_action_id.state:
            type: "value"
